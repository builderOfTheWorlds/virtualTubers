# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.table.yml: the live agent table on vLLM (build plan P0.5)
#
# An OVERRIDE, never used on its own. It points every LLM-calling stream
# worker at the ONE shared vLLM server (deployments/vllm-agents, host :8092)
# instead of Ollama :11434:
#
#   docker compose -f docker-compose.yml -f docker-compose.table.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.office.yml \
#                  -f docker-compose.table.yml up -d        # office table
#
# D&D seats (plan U1; seat configs arrive with P3.7):
#   worker-gm=tuber_0 (GM)  worker-manager=tuber_1  worker-coder-native=tuber_2
#   worker-coder-aider=tuber_3  worker-tester=tuber_4
# The other two workers get the same LLM env so the office table (7 seats,
# docker-compose.office.yml) runs on the same model with no extra file.
# worker-observer (office tuber_7) is silent and makes no LLM calls.
#
# Only LLM env changes here; `environment` merges by key, so every other
# setting from the base/office files is untouched.
#
# Secret: VLLM_API_KEY is passed by NAME from .env; no value lives in this
# file. app/llm_client.build_llm_client reads it via llm.api_key_env
# (default VLLM_API_KEY). LLM_MODEL must equal the server's
# --served-model-name (vllm-agents .env VLLM_SERVED_NAME, default table-agents).
# ──────────────────────────────────────────────────────────────────────────────

# P3.7: the D&D table. Each seat's container gets its generated worker config
# (config/workers/table/<slug>.yaml, scripts/build_table_configs.py), its seat
# WORKER_ID, the pack (lore for the brief) and the character DB settings. The GM
# container also gets the scene-contract fixture. Secrets by NAME only.
x-character-db-env: &character-db-env
  CHARACTER_DB_HOST: ${TABLE_CHARACTER_DB_HOST:-host.docker.internal}
  CHARACTER_DB_PORT: ${TABLE_CHARACTER_DB_PORT:-5433}
  CHARACTER_DB_PASSWORD: ${CHARACTER_DB_PASSWORD:?CHARACTER_DB_PASSWORD must be set in .env for the table overlay}

x-table-llm-env: &table-llm-env
  LLM_PROVIDER: vllm
  LLM_BASE_URL: ${TABLE_LLM_BASE_URL:-http://host.docker.internal:8092}
  LLM_MODEL: ${TABLE_LLM_MODEL:-table-agents}
  VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY must be set in .env for the table overlay}

services:
  worker-gm:
    environment:
      <<: [*table-llm-env, *character-db-env]
      WORKER_ID: tuber_0
    volumes:
      - ${REPO_ROOT:-.}/config/workers/table/gm.yaml:/config/worker.yaml:ro
      - ${REPO_ROOT:-.}/campaigns:/data/campaigns:ro
      - ${REPO_ROOT:-.}/config/character.yaml:/config/character.yaml:ro
      - ${REPO_ROOT:-.}/tests/table/fixtures:/data/table/fixtures:ro
  worker-manager:
    environment:
      <<: [*table-llm-env, *character-db-env]
      WORKER_ID: tuber_1
    volumes:
      - ${REPO_ROOT:-.}/config/workers/table/chadwick.yaml:/config/worker.yaml:ro
      - ${REPO_ROOT:-.}/campaigns:/data/campaigns:ro
      - ${REPO_ROOT:-.}/config/character.yaml:/config/character.yaml:ro
  worker-coder-native:
    environment:
      <<: [*table-llm-env, *character-db-env]
      WORKER_ID: tuber_2
    volumes:
      - ${REPO_ROOT:-.}/config/workers/table/Leena.yaml:/config/worker.yaml:ro
      - ${REPO_ROOT:-.}/campaigns:/data/campaigns:ro
      - ${REPO_ROOT:-.}/config/character.yaml:/config/character.yaml:ro
  worker-coder-aider:
    environment:
      <<: [*table-llm-env, *character-db-env]
      WORKER_ID: tuber_3
    volumes:
      - ${REPO_ROOT:-.}/config/workers/table/Vigil.yaml:/config/worker.yaml:ro
      - ${REPO_ROOT:-.}/campaigns:/data/campaigns:ro
      - ${REPO_ROOT:-.}/config/character.yaml:/config/character.yaml:ro
  worker-tester:
    environment:
      <<: [*table-llm-env, *character-db-env]
      WORKER_ID: tuber_4
    volumes:
      - ${REPO_ROOT:-.}/config/workers/table/sodacan_bob.yaml:/config/worker.yaml:ro
      - ${REPO_ROOT:-.}/campaigns:/data/campaigns:ro
      - ${REPO_ROOT:-.}/config/character.yaml:/config/character.yaml:ro
  worker-coder-opencode:
    environment:
      <<: *table-llm-env
  worker-coder:
    environment:
      <<: *table-llm-env
  # P4: the roundtable channel airs the table's committed lines (agent.live + table_arbiter).
  worker-roundtable:
    volumes:
      - ${REPO_ROOT:-.}/config/workers/table/roundtable.yaml:/config/worker.yaml:ro
