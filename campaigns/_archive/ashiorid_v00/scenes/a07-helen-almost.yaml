# The one ambient scene that touches the arc's central question. It still
# decides nothing — it is a flicker, not a revelation. Leena never gets an
# answer here, because the answer belongs to the spine.
id: Leena-almost
title: Something Familiar
ambient: true

lore: [the-event, the-begene-program]

prompt: |
  Something in front of Leena is familiar and should not be: a turn of phrase
  somebody used, a tune being hummed, the shape of a doorway, a smell.

  She says so out loud, because she always says so out loud. She cannot explain
  it and she is not frightened by it — she is curious, and a little amused at
  herself.

  The others offer ordinary explanations and one of them is probably right.
  Sodacan Bob suggests she saw one like it in her village. Vigil does not offer
  anything. Chadwick tells her not to chase it.

  She lets it go. Nothing is confirmed, nothing is denied, and nobody uses the
  words Leena, Begene, or the Event. Leena does not learn anything about
  where she is from — that belongs to the plot, and this is not the plot.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
