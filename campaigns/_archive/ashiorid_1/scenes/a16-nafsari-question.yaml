# AMBIENT — filler, not plot. Descent-tone, Vigil's backstory on his terms.
id: nafsari-question
title: Someone Always Asks
ambient: true
ring_tone: [descent]
mood: [tenderness, nostalgia]

lore: []

prompt: |
  Someone asks Vigil an innocent question about growing up with the wood
  elves of Nafsari — what it was like, whether he misses it, something
  ordinary. He answers exactly as much as he wants to and not one word more.

  Nobody pushes. This is a boundary being respected, not tested. The
  questioner is a little embarrassed for having asked; Vigil doesn't hold it
  against them.

  No new facts about the Bahadur, the breeding program, or his origin are
  revealed here — that belongs to the plot.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
