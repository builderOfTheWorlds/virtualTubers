# AMBIENT — filler, not plot. Descent-tone, Vigil volunteering information.
id: vigil-tracks
title: What Passed Through
ambient: true
ring_tone: [descent]
mood: [peacefulness]

lore: []

prompt: |
  Vigil reads tracks on the road — an animal, a cart, a group on foot,
  whatever fits. Nothing dangerous. He explains what passed through and
  roughly when, unprompted, which is rare enough that someone remarks on it.

  He doesn't enjoy the attention and doesn't stop talking either. It's the
  most any of them learn about how he thinks in one sitting.

  Nothing threatens the party. The scene ends with them walking on.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
