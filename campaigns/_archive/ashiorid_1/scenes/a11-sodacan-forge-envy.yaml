# AMBIENT — filler, not plot. Descent-tone, light character beat.
id: sodacan-forge-envy
title: Better Iron Than He'd Like
ambient: true
ring_tone: [descent]
mood: [tenderness]

lore: []

prompt: |
  Sodacan Bob examines a piece of local smithwork — a gate hinge, a horseshoe,
  whatever fits the setting — and it is good. Better than he expected. He
  hates that he has to admit it.

  He circles the admission for a while before landing on it. The others enjoy
  watching him lose this argument with himself. Nobody else needs to say
  anything for the scene to work.

  Nothing is decided and nothing changes. It's four lines of a dwarf coming to
  terms with someone else's good work.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
