# AMBIENT — filler, not plot. Descent-tone, mundane and grounding.
id: inventory-argument
title: Whose Bag Is This
ambient: true
ring_tone: [descent]
mood: [joyful_activation]

lore: []

prompt: |
  A mundane argument about whose bag holds what, and why nobody ever labels
  anything. Something useful turns up in the wrong pack. Someone is smug
  about it, someone else is not.

  Nothing is lost, nothing is at stake. This is four traveling companions
  being tired of each other's packing habits.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
