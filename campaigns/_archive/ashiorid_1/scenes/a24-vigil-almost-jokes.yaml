# AMBIENT — filler, not plot. Comedic descent-tone, rare Vigil warmth.
id: vigil-almost-jokes
title: Was That a Joke
ambient: true
ring_tone: [descent]
mood: [joyful_activation, tenderness]

lore: []

prompt: |
  Vigil says something that is almost, possibly, a joke. It's very nearly
  funny. Nobody is sure if he meant it as one, including — visibly — Vigil.

  The party spends more time debating whether it was a joke than the joke
  itself would ever have been worth. Vigil watches this happen and says
  nothing further.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
