# AMBIENT — filler, not plot. Ascent-tone: Vigil's quiet vigilance as care.
id: vigil-watches-longer
title: He Didn't Say Why
ambient: true
ring_tone: [ascent]
mood: [tenderness]

lore: []

prompt: |
  Vigil takes a longer watch than his turn without explaining why. Someone
  else wakes, notices, and doesn't ask him about it — just sits with him for
  a while instead.

  Very little is said. This is the most tender the party gets without anyone
  naming it as tenderness.

  Six to ten short lines, mostly silence. Everything here is read aloud, so
  write for the ear.
