  speaker: sodacan_bob
  text: You want to know about Vabokedos? It's a real mess, to be honest. The rivers
    are always flooding, the mountains are steep, and the winters are brutal. But
    the people are nice, they'll take you in for a meal or two.
- kind: dialogue
  speaker: Leena
  text: I'm telling you, my village is the most beautiful place you'll ever see. We
    have crystal clear rivers, and the trees are so tall they touch the sky.
- kind: dialogue
  speaker: Vigil
  text: Nafsari... it's just a... a lot of rocks. Yeah.
- kind: dialogue
  speaker: chadwick
  text: How's the weather been treating you all today?
- kind: dialogue
  speaker: sodacan_bob
  text: It's been pleasant, I suppose. Not too hot, not too cold. Just... existing,
    really.
- kind: dialogue
  speaker: Leena
  text: Do you think we'll get there by sunset?
- kind: dialogue
