- kind: dialogue
  speaker: sodacan_bob
  text: Oh, take a look at this, you'll never guess what it does - this one's a threshold
    rune for suppressing magical echoes.
- kind: dialogue
  speaker: chadwick
  text: What, exactly, is a magical echo?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, well, it's when a spell's residual energy sticks around after it's cast,
    interfering with subsequent magic.
- kind: dialogue
  speaker: Leena
  text: Wait, so if someone's already cast a spell near here, it would mess up our
    next one?
- kind: dialogue
  speaker: sodacan_bob
  text: Exactly, exactly - that's why this rune's here to suppress the echo, let the
    next spell go through clean.
- kind: dialogue
  speaker: Vigil
  text: Go on.
- kind: dialogue
  speaker: sodacan_bob
  text: You see, the threshold rune's keyed to the specific magical frequencies it's
    meant to suppress - this one's tuned for, say, a pyromancer's spell.
- kind: dialogue
  speaker: chadwick
  text: Oh, great, just what we need, another thing to worry about.
- kind: dialogue
  speaker: sodacan_bob
  text: Now, if I were to, say, re-tune this rune to the right magical frequency,
    it would amplify the next spell instead of suppressing it.
- kind: dialogue
  speaker: Leena
  text: How do you re-tune it?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, that's the beauty of it - it's a resonant crystal within the rune itself,
    just need to apply the right harmonic vibrations.
