- kind: dialogue
  speaker: sodacan_bob
  text: Ah, this gate post, notice the mortise for the latch, it's a simple design,
    but it tells us a lot about the carpenter who built it.
- kind: dialogue
  speaker: chadwick
  text: Come on, Bob, we're not here to admire gates.
- kind: dialogue
  speaker: Vigil
  text: Wait, what kind of wood is this?
- kind: dialogue
