  text: Ah, excellent question, Vigil, it's a type of cedar, very durable and resistant
    to rot.
- kind: dialogue
  speaker: Leena
  text: Ooh, can you tell us more about the design?
- kind: dialogue
  speaker: sodacan_bob
  text: Well, the maker was trying to balance form and function, it's not just about
    aesthetics, you see.
- kind: dialogue
  speaker: sodacan_bob
  text: Note the way the joints are reinforced, it's a testament to the maker's attention
    to detail.
- kind: dialogue
  speaker: chadwick
  text: We're going to be here all day if we keep examining every piece of wood.
- kind: dialogue
