- kind: dialogue
  speaker: sodacan_bob
  text: Alright, so this wagon axle, it's a standard design from the Southern Colonies,
    typical of the late 1700s.
- kind: dialogue
  speaker: chadwick
  text: Let's keep moving, we don't want to get caught out after dark.
- kind: dialogue
  speaker: Vigil
  text: Bob, how does it look like it was mounted?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, good question, Vigil. I'd say it was attached to a wooden frame, probably
    a cart or a carriage.
- kind: dialogue
  speaker: Leena
  text: Ooh, I love the craftsmanship on this bracket. It's so... precise.
- kind: dialogue
  speaker: sodacan_bob
  text: Yes, the maker was clearly skilled. I'd say this was made by someone who worked
    in a foundry.
- kind: dialogue
  speaker: chadwick
  text: (muttering) Foundry, who cares about the foundry?
- kind: dialogue
  speaker: sodacan_bob
  text: (excitedly) Well, it's interesting, actually. The use of iron for wagon axles
    became more widespread in the 1780s.
- kind: dialogue
  speaker: Vigil
  text: And what does that tell us?
- kind: dialogue
  speaker: sodacan_bob
  text: (thoughtfully) Not much, probably, but it's good to know our context.
