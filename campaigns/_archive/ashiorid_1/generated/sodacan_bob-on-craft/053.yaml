- kind: dialogue
  speaker: sodacan_bob
  text: I'm telling you, this gate was made by a small foundry in the city, and I'd
    say it's from about twenty years ago, give or take a few.
- kind: dialogue
  speaker: chadwick
  text: Can we move on? We've got a long way to go and not much daylight left.
- kind: dialogue
  speaker: Leena
  text: Oh, wow, can I see it closer? What's that pattern on the bracket?
- kind: dialogue
  speaker: Vigil
  text: What kind of metal is this? Is it durable enough for regular use?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, yes, the bracket on the door is a nice touch, isn't it? I think the maker
    wanted to add a bit of ornamentation to balance out the practicality of the gate.
- kind: dialogue
  speaker: sodacan_bob
  text: See, the maker was thinking about aesthetics as much as functionality – that's
    why they chose that particular style of bracket.
- kind: dialogue
  speaker: Leena
  text: I love the way it curves around the door handle.
- kind: dialogue
  speaker: chadwick
  text: This is taking too long. We should keep moving.
- kind: dialogue
  speaker: Vigil
  text: (to Sodacan Bob) Is the metal rusting? That might be a problem if it's been
    exposed to the elements.
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, yes, you're right, Vigil! The maker probably didn't account for this particular
    climate – it's a good thing you asked that.
- kind: dialogue
  speaker: sodacan_bob
  text: Now, now, Leena, come see the way the blade is balanced – that's a nice bit
