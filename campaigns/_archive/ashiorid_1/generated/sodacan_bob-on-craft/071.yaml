- kind: dialogue
  speaker: sodacan_bob
  text: It's an excellent example of a late 19th century wagon axle, with a smooth
    turned finish and a lovely curve to the king pin.
- kind: dialogue
  speaker: chadwick
  text: Let's move on, we've got a long way to go.
- kind: dialogue
  speaker: Leena
  text: Wait, is that a maker's mark on the axle?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, yes, it's a small "W" with an arrow through it, that's the mark of the
    Waterhouse foundry.
- kind: dialogue
  speaker: Vigil
  text: How much weight could it have been expected to handle?
- kind: dialogue
  speaker: sodacan_bob
  text: Well, that's a good question, Vigil, and I would say it was likely designed
    to handle loads of up to a few hundred pounds.
- kind: dialogue
  speaker: Leena
  text: (excitedly) Oh, I've seen pictures of the Waterhouse foundry! They made some
    beautiful work.
- kind: dialogue
  speaker: sodacan_bob
  text: (laughing) Yes, they were a very skilled outfit, and this axle is a fine example
    of their craftsmanship.
- kind: dialogue
  speaker: chadwick
  text: (sighing) I'm glad we're not carrying it with us, whatever weight it can handle.
- kind: dialogue
  speaker: sodacan_bob
  text: (proudly) Yes, of course not, we're not here to haul heavy equipment, we're
    here to observe.
