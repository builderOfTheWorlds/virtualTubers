beats:
- kind: dialogue
  speaker: sodacan_bob
  text: I've seen some weathered runes in my time, but this one... the depth of it
    is almost a wonder.
- kind: dialogue
  speaker: sodacan_bob
  text: A good rune can last for centuries, but this one's not just carved, it's etched
    into the stone like it was done yesterday.
- kind: dialogue
  speaker: sodacan_bob
  text: Who in this world still has the patience for that kind of work?
- kind: dialogue
  speaker: sodacan_bob
  text: A die struck just so, a chisel held steady, it's not something you can teach,
    it's something you're born with.
- kind: dialogue
  speaker: Vigil
  text: Sodacan Bob, what do you think it means?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, Vigil, I don't think anything, I just think about how it was done, that's
    all.
- kind: dialogue
  speaker: chadwick
  text: What if it's not just a carving, but a... a message?
- kind: dialogue
  speaker: sodacan_bob
  text: A message? To who? The people who built the Malvakar are dust and ashes.
- kind: dialogue
  speaker: Leena
  text: Maybe it's for us.
- kind: dialogue
  speaker: sodacan_bob
  text: Leena, I'm not trying to figure out its secrets, I'm just trying to understand
    how it was made.
- kind: dialogue
  speaker: gm
  text: Alright, let's focus on the task at hand, rather than getting lost in theories.
- kind: dialogue
  speaker: sodacan_bob
  text: But theories are what we have, Ashiorid, and sometimes it's just as useful
    to speculate as it is to work.
