beats:
- kind: dialogue
  speaker: sodacan_bob
  text: Alright, this gate was made in the town of Oakwood, about twenty miles east
    of here, and I'm guessing it's from the early 1800s.
- kind: dialogue
  speaker: chadwick
  text: Come on, let's move, we can't afford to waste time here.
- kind: dialogue
  speaker: Leena
  text: I've never seen anything like it, Bob, the craftsmanship is incredible.
- kind: dialogue
  speaker: Vigil
  text: Is there a makers mark on it anywhere?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, yes, there's a tiny stamp on the hinge here, looks like a little hammer
    and anvil, that's the mark of the Oakwood Guild of Blacksmiths.
- kind: dialogue
  speaker: sodacan_bob
  text: The Guild was known for their high-quality work, especially their hinges,
    which is why this gate was so expensive when it was new.
- kind: dialogue
  speaker: Leena
  text: Oh, Bob, this is amazing, can you tell us more about the Guild?
- kind: dialogue
  speaker: chadwick
  text: Leena, not now.
- kind: dialogue
  speaker: sodacan_bob
  text: Yes, of course, Leena, the Guild was made up of about a dozen master blacksmiths
    who worked together to create some of the finest metalwork in the region.
- kind: dialogue
  speaker: Vigil
  text: And what's with the strange scratches on the gate?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, those are just signs of wear and tear, probably from when it was used
    as a farm gate.
- kind: dialogue
  speaker: Leena
  text: But Bob, this is so beautiful, don't you think it's worth taking with us?
