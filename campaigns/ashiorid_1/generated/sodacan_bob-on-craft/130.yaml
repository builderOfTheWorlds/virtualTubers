- kind: dialogue
  speaker: Vigil
  text: Does anyone know how long it's been since it was last used?
- kind: dialogue
  speaker: sodacan_bob
  text: Well, I'd say it's been at least ten years, maybe more. The rust is a good
    indicator of disuse.
- kind: dialogue
  speaker: sodacan_bob
  text: It's a shame it's just sitting here, really. Someone must have abandoned it
    in a hurry.
- kind: dialogue
  speaker: chadwick
  text: Let's keep moving, Bob.
- kind: dialogue
  speaker: sodacan_bob
  text: Oh, come on, Chad. It's not every day we get to examine something so meticulously
    crafted.
- kind: dialogue
  speaker: Leena
  text: I like it, Bob. It's...nice.
- kind: dialogue
  speaker: sodacan_bob
  text: Thank you, Leena! I'm glad you appreciate it. I think I might even be able
