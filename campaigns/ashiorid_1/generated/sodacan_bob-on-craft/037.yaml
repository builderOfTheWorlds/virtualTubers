  speaker: gm
  text: Right, Sodacan Bob, what've you got?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, this gate, it's a real beauty, made by the Smiths in Ironhaven.
- kind: dialogue
  speaker: chadwick
  text: Can we move on?
