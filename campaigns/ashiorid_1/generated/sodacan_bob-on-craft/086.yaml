- kind: dialogue
  speaker: sodacan_bob
  text: I'll tell you, this gate was made in the Kaelinian workshops, early in the
    century when they were still experimenting with the new steel alloys.
- kind: dialogue
  speaker: chadwick
  text: Can we move on? We've got a long way to go.
- kind: dialogue
  speaker: Vigil
  text: What kind of steel alloy do you think they used here?
- kind: dialogue
  speaker: Leena
  text: Ooh, Sodacan Bob, what do you think made this wagon axle so sturdy?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, good question, Vigil. I'd say it's a variant of the Kaelinian's new iron-based
    steel, it's got a distinct resonance to it.
- kind: dialogue
  speaker: sodacan_bob
  text: And if I'm not mistaken, the bracket on this door is a classic example of
    Kaelinian design influence.
- kind: dialogue
  speaker: Leena
  text: Oh, I love the way the maker thought about the flow of the wood, it's so...
    elegant.
- kind: dialogue
  speaker: sodacan_bob
  text: Elegant? Ha! The Kaelinians were masters of functionality, no frills, just
    getting the job done.
- kind: dialogue
  speaker: Vigil
  text: And what about the blade the fellow is carrying? Any story to tell there?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, now that's an interesting piece. I think it's a reworked Kaelinian pattern,
    probably from the second half of the century.
