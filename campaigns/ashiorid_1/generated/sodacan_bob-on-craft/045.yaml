- kind: dialogue
  speaker: sodacan_bob
  text: I'm telling you, it's a piece of work from the old Ironhaven factory, mid-fourth
    century. The bracket's a standard design, but the maker added a little flourish
    to the rivets.
- kind: dialogue
  speaker: chadwick
  text: Come on, Bob, let's not waste our time on an old piece of junk.
- kind: dialogue
  speaker: Vigil
  text: What's the significance of the rivet design? Does it have a purpose?
- kind: dialogue
  speaker: sodacan_bob
  text: Ah, the rivets, yes! It's a maker's signature, a subtle touch to show off
    his skills. He was trying to prove he could make it better.
- kind: dialogue
  speaker: Leena
  text: (excitedly) Oh, Sodacan, can you tell us more about the maker? What was he
    like?
- kind: dialogue
  speaker: sodacan_bob
  text: (laughing) Ah, Leena, you'd love this. He was a young apprentice at the time,
    trying to make a name for himself. He's got a lot of character in his work.
- kind: dialogue
  speaker: chadwick
  text: (sighing) We're never going to make it to camp at this rate.
- kind: dialogue
  speaker: Vigil
  text: (calmly) I think we're good. We've got a few hours of daylight left.
- kind: dialogue
  speaker: sodacan_bob
  text: (chuckling) Ah, come on, guys. Just one more minute. I'm on a roll!
