# AMBIENT — filler, not plot. Ascent-tone: Bob assesses cost in his own idiom.
id: counting-the-cost
title: What the Forge Would Say
ambient: true
ring_tone: [ascent]
mood: [sadness]

lore: []

prompt: |
  Sodacan Bob assesses damage — to gear, to the cart, to whatever needs
  fixing after a hard stretch — in his own idiom: forge and joinery
  metaphors, never medical ones, even when he's clearly also talking about
  people.

  He doesn't say anything sentimental directly. The metaphor is doing all the
  work. The others let him have that distance.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
