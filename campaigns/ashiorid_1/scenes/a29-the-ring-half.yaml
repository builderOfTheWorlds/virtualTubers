# AMBIENT — filler, not plot. Keystone-adjacent: the signet ring looked at
# directly, unlike carrying-the-signet's deflection. Still resolves nothing.
id: the-ring-half
title: Looking At It Directly
ambient: true
ring_tone: [keystone]
mood: [tension, nostalgia]

lore: [the-begene-program]

prompt: |
  A quiet moment where whoever carries the half-signet-ring looks at it
  directly, alone or with one other party member present, instead of
  deflecting the way they usually do.

  They talk about what it might mean, plainly, without reaching a
  conclusion. This is the closest the ambient layer comes to the arc's real
  stakes — it must not answer the question, only ask it out loud for once.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
