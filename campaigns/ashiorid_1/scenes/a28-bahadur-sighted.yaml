# AMBIENT — filler, not plot. Keystone-adjacent tension.
id: bahadur-sighted
title: Something at the Treeline
ambient: true
ring_tone: [keystone]
mood: [tension]

lore: [the-bahadur]

prompt: |
  A distant, wordless sighting of something that might be Bahadur — a shape
  at a treeline, a shadow that moves wrong, gone before anyone can be sure.
  Nobody says the word "Bahadur" out loud. Nobody needs to.

  Nothing happens. The party keeps moving. This scene does not resolve
  whether it was real.

  Short, tense lines. Long pause after the sighting before anyone speaks.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
