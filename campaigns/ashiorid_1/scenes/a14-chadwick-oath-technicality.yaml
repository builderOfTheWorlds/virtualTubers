prompt: |
  Chadwick argues, badly, that some minor rule-bending doesn't violate his
  Oath of Vengeance. He's not lying, exactly — he believes it while he's
  saying it — but nobody else is convinced, including, eventually, him.

  He doesn't fully concede. He just stops arguing and does the honourable
  thing anyway, loudly annoyed about it.

  Nothing about the oath itself is explained or expanded. This is character,
  not lore.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
