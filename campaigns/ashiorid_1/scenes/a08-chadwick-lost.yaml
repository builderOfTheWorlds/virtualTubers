id: chadwick-lost
title: This Is The Way
ambient: true

prompt: |
  Chadwick has been leading and Chadwick does not know where he is. He will not
  say this. He has a terrible sense of direction and he refuses to admit it,
  and everyone else worked that out a long time ago.

  Vigil knows exactly where they are and waits to be asked. Sodacan Bob finds the
  whole thing very funny and says so. Leena tries to give Chadwick a way out
  that lets him keep his dignity, and he does not take it.

  Eventually they go the right way. Chadwick does not concede anything and
  nobody makes him. The party is not lost at the end of the scene and was never
  in any real danger.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
