# AMBIENT — filler, not plot. Keystone-adjacent: quiet dread before a
# moonwell approach. Do not resolve or foreshadow the actual keystone event.
id: before-the-well
title: The Night Before
ambient: true
ring_tone: [keystone]
mood: [tension]

lore: [moonwells]

prompt: |
  The night before the party reaches a moonwell. Quiet dread that nobody
  names out loud. Nobody sleeps well. Watches are kept a little more
  carefully than usual, without anyone saying why.

  Short exchanges, long silences between them. This is not the crisis
  itself — nothing happens tonight, nothing is decided, no plot content is
  revealed. It is only the held breath before it.

  Six to ten short lines, more silence than dialogue. Everything here is read
  aloud, so write for the ear.
