# AMBIENT — filler, not plot. Pure texture, lowest-stakes scene in the pool.
id: weather-argument
title: It's Not Going to Rain
ambient: true
ring_tone: [descent]
mood: [peacefulness]

lore: []

prompt: |
  The party argues, mildly, about whether it's going to rain. Everyone has an
  opinion and a reason for it, none of them expert reasons.

  The scene ends before anyone finds out who was right. It doesn't matter.
  This is four adults filling a road with a disagreement that costs nothing.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
