# AMBIENT — filler, not plot. Descent-tone, touches the signet ring lightly
# without paying it off — same restraint pattern as Leena-almost.
id: carrying-the-signet
title: Half a Ring
ambient: true
ring_tone: [descent]
mood: [nostalgia]

lore: [the-begene-program]

prompt: |
  Someone notices the half-signet-ring one of the party carries and asks
  about it — a stranger, an innkeeper, doesn't matter who. Whoever's carrying
  it deflects, easily and practiced, the way you deflect a question you've
  been asked before.

  The party doesn't discuss it further among themselves after the stranger
  leaves. This is a habit of concealment shown once, not explained.

  Nothing about what the ring means or who holds the other half is revealed
  here.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
