# AMBIENT — filler, not plot. Ascent-tone: Leena notices a change in herself.
id: leena-different-now
title: Something's Different
ambient: true
ring_tone: [ascent]
mood: [wonder, sadness]

lore: [the-event]

prompt: |
  Leena notices something about herself has changed recently and doesn't
  have the vocabulary for it yet — a feeling, an instinct, something in how
  her magic sits differently than it used to. She says so out loud, the way
  she always does, but this time she can't make it sound light.

  The others notice her noticing and don't push. No mechanism or explanation
  is given — this scene names the feeling, not the cause.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
