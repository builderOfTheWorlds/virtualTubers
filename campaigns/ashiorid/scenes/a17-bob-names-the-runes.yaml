# AMBIENT — filler, not plot. Descent-tone, Sodacan Bob showing off.
id: bob-names-the-runes
title: Nobody Asked, Bob Answers Anyway
ambient: true
ring_tone: [descent]
mood: [joyful_activation]

lore: []

prompt: |
  Sodacan Bob notices a rune on some mundane object — a doorframe, a tool, a
  gatepost — and explains, in detail, what it actually does. Nobody asked. He
  tells them anyway, delighted with himself.

  The others tolerate this with varying degrees of patience. Vigil tunes it
  out entirely. Leena asks one genuine follow-up question that makes Bob
  light up even more.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
