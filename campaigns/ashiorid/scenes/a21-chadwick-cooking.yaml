prompt: |
  Chadwick insists on cooking. It is bad. Genuinely, structurally bad. The
  others eat it anyway, badly disguising the fact that they're only doing it
  out of solidarity and hunger.

  Nobody tells him the truth. He seems to suspect anyway and doesn't ask.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
