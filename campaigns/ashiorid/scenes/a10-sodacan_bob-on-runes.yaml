# AMBIENT — filler, not plot. Injected between spine scenes.
id: sodacan_bob-on-runes
title: Sodacan Bob Reads the Riddle Stone
ambient: true

lore: [amulet-of-wonder]

prompt: |
  Sodacan Bob can't stop turning over what he saw carved into the Malvakar. He
  talks shop — smith's shop, not adventurer's shop — about how a die is
  struck, how deep a rune has to be cut to survive a few thousand years of
  weather, and who in this world still has the patience for that kind of
  work.

  He is not looking for an answer from the others. He is thinking out loud,
  the way he does at a forge. Someone eventually asks him a question he
  doesn't expect, and it needles him more than he'll admit.

  Nothing is decided. Nobody learns anything load-bearing.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
