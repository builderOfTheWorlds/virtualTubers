id: night-watch
title: Second Watch
ambient: true

lore: [moonwells]

prompt: |
  The middle of the night. Two of the party are awake on watch and the other
  two are asleep nearby. Nothing is coming. Both of them know nothing is
  coming, and they keep watching anyway.

  This is the quietest scene in the show. Long gaps, short lines, and a
  conversation that keeps stopping and restarting. They talk about the sky,
  about what they can hear, about whether to wake the others early. One of them
  admits something small that they would not admit in daylight, and the other
  does not make anything of it.

  Nothing happens. Nobody is attacked. Morning does not arrive within the
  scene.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
