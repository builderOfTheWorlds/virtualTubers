id: drokki-on-craft
title: Hinges and Joinery
ambient: true

prompt: |
  Drokki has found something made — a gate, a wagon axle, a bracket on a door,
  a blade someone is carrying — and has stopped to look at it properly.

  He explains it at length, whether or not anyone asked. He is genuinely
  delighted, and he is also showing off. He can tell you where it was made and
  roughly when and what the maker was thinking, and he is right.

  The others react in character: Buffalo wants to keep moving, Carl asks one
  question that turns out to be the useful one, Helen is interested in a way
  Drokki finds encouraging and slightly exhausting.

  Whatever he has found is ordinary. It is not a clue and it is not magic.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
