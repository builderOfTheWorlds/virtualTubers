# AMBIENT — filler, not plot. Ascent-tone: aftermath of a major decision.
id: after-the-choice
title: Nobody's Celebrating
ambient: true
ring_tone: [ascent]
mood: [sadness, tenderness]

lore: []

prompt: |
  Quiet aftermath following a major decision the party made recently.
  Nobody's celebrating. Something was given up to get here, even if it was
  the right call.

  Short lines, long pauses. One person tries to make it feel lighter than it
  is; it doesn't quite work, and that's allowed to sit there unresolved.

  Nothing about which specific decision is named — this scene should work
  regardless of which branch the arc actually took.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
