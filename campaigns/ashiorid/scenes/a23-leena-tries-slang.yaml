# AMBIENT — filler, not plot. Comedic descent-tone.
id: leena-tries-slang
title: That's Not What That Means
ambient: true
ring_tone: [descent]
mood: [joyful_activation]

lore: []

prompt: |
  Leena picked up a piece of local slang wrong and uses it confidently and
  incorrectly for the whole scene. Nobody corrects her right away — it's
  funnier not to.

  Eventually someone does, gently. She's delighted rather than embarrassed
  and immediately starts using it correctly, which is somehow less funny.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
