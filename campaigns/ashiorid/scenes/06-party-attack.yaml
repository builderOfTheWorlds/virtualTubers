id: party-attack
title: The Party Attack
enter_narration: >-
  The doors open on people who were not invited, and the room stops moving.

beats:
  - type: pane
    show: combat

  - type: narration
    speaker: gm
    text: >-
      The music stops mid-bar, which is the first thing anyone notices. The
      second thing is that nobody in the room can move.

  - type: narration
    speaker: gm
    text: >-
      A holding spell, laid over three hundred people at once, by someone who
      did not need to be in the room to do it. That should not be possible in
      any age.

  - type: narration
    speaker: gm
    text: >-
      They come in through the main doors without hurrying. They walk to the
      Duke, and one of them puts a blade through his heart while he is still
      standing, still smiling, unable to fall.

  - type: narration
    speaker: gm
    text: >-
      "Burn it down," their leader says. "We will search through the ashes."

  - type: action
    speaker: buffalo
    primitive: roll_check
    params:
      skill: constitution save
      dc: 16

  - type: dialogue
    speaker: buffalo
    text: >-
      My hand moves. That's all I need.

  - type: action
    speaker: buffalo
    primitive: attack
    params:
      target: the nearest intruder
      weapon: greatsword

  - type: action
    speaker: helen
    primitive: cast_spell
    params:
      spell: shatter
      target: the barred doors
      level: 3

  - type: narration
    speaker: gm
    text: >-
      The doors are already barred from the outside. Smoke comes up through
      the floorboards faster than fire should travel. Somebody set this before
      they ever knocked.

branches:
  - id: success
    when:
      outcome: success
      weight: 3
    next: grovley-revelation

  - id: failure
    when:
      outcome: failure
      weight: 2
    next: burn-it-down

default_next: grovley-revelation
