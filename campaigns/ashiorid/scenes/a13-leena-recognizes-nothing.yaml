# AMBIENT — filler, not plot. Descent-tone, brushes the arc's mystery
# lightly, same restraint as Leena-almost: plants unease, resolves nothing.
id: leena-recognizes-nothing
title: A Landmark She's Never Seen
ambient: true
ring_tone: [descent]
mood: [wonder, nostalgia]

lore: [the-begene-program]

prompt: |
  Leena almost-recognizes a landmark she's never been to before — the shape
  of a hill, the angle of a road, the way a building sits against the light.
  She says so, curious rather than frightened, the way she always is about
  these things.

  Nobody in the party makes anything of it out loud, but everyone notices her
  noticing. Sodacan Bob offers an ordinary explanation. Vigil watches and
  says nothing. Chadwick changes the subject, gently.

  Nothing is confirmed, nothing is denied. Leena does not learn anything
  about where she is from — that belongs to the plot, not to this scene.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
