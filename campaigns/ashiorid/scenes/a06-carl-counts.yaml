id: carl-counts
title: What Carl Noticed
ambient: true

prompt: |
  Carl has noticed something small and true about wherever the party currently
  is: how many people are in the room, which way the doors open, that a shutter
  has been repaired recently, that the same cart has passed twice.

  He mentions it once, plainly, without making a case out of it. The others
  decide what to do with it, which is mostly nothing.

  This is a habit, not a warning. What he noticed is not a threat and does not
  turn out to matter. He does not press the point and he does not repeat
  himself.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
