id: portal-encounter
title: The Portal
enter_narration: >-
  At the tunnel's mouth, a dying wizard finishes what he came to do.

lore: [the-event]

beats:
  - type: pane
    show: map

  - type: narration
    speaker: gm
    improv: true
    text:
      - >-
        The tunnel comes out on the hillside. Behind you the manor is a single
        column of fire, straight up, no wind to bend it.
      - >-
        You come out partway down the hill. Behind you the house is one straight
        column of fire going up, and there is no wind tonight to lean it over.
      - >-
        The tunnel lets you out on the slope. What was the manor is now a pillar
        of fire standing perfectly upright, which is not how fire behaves.

  - type: narration
    speaker: gm
    improv: true
    text:
      - >-
        There is a man on the ground at the tunnel's mouth. He is not going to
        get up again, and he knows it, and he is still speaking.
      - >-
        A man is lying at the mouth of the tunnel. He will not be getting up.
        He is entirely aware of that, and he has not stopped talking.
      - >-
        Someone is down on the ground just outside. He is finished and he knows
        he is finished, and he is still working through whatever he is saying.

  - type: action
    speaker: carl
    primitive: attack
    params:
      target: the dying wizard
      weapon: longbow

  - type: narration
    speaker: gm
    improv: true
    text:
      - >-
        Carl's arrow finds him. It is not fast enough. The last syllable leaves
        the wizard's mouth at the same moment the arrow arrives, and both of them
        land.
      - >-
        The shot is good. The shot is also late. His final syllable and Carl's
        arrow reach their destinations in the same instant, and neither of them
        misses.
      - >-
        Carl does not miss. Carl is simply not quicker than a word. The arrow and
        the last sound of the spell arrive together, and both of them work.

  - type: narration
    speaker: gm
    improv: true
    text:
      - >-
        The air in front of you opens. Not a door — a tear, hanging at chest
        height, edges moving like something wet.
      - >-
        The air ahead of you comes apart. It is not a doorway. It is a tear, at
        about chest height, and its edges move the way wet things move.
      - >-
        Something opens in the air in front of you. Not cleanly, and not in the
        shape of a door — a rip, hanging at chest height, with edges that will
        not hold still.

  - type: narration
    speaker: gm
    improv: true
    text:
      - >-
        Fingers come through it. Too many of them, on a hand that is far too
        large, and they take hold of the edges from the inside and begin, very
        patiently, to pull it wider.
      - >-
        Fingers come out of it. The count is wrong and the scale is wrong, and
        they get a grip on the edges from the far side and start widening the
        gap without any particular hurry.
      - >-
        A hand comes through, or most of one. There are too many fingers and the
        whole thing is far too big, and it takes hold of the opening from the
        inside and begins, unhurriedly, to make it larger.

  - type: dialogue
    speaker: drokki
    improv: true
    text:
      - >-
        That's the eighty-sixth, then. It didn't need the room. It just needed a
        hole.
      - >-
        There's your eighty-sixth. Never wanted the vault at all. Wanted an
        opening, and it's got one.
      - >-
        So that's it. Ten thousand years guarding a room, and it turns out the
        room was never the point. It only ever needed a way through.

  - type: dialogue
    speaker: helen
    improv: true
    text: >-
      Helen realises she knows what is on the other side of the tear, and that
      she has always known.

  - type: narration
    speaker: gm
    improv: true
    text:
      - >-
        Ten thousand years to the day since the Event. That is where we stop
        tonight.
      - >-
        Ten thousand years, to the day, since the Event. And that is where we
        leave it for tonight.
      - >-
        Tonight is the anniversary. Exactly ten thousand years. And that is where
        we are going to stop.
