# AMBIENT — filler, not plot. Injected between spine scenes.
id: malmont-market
title: What the Stalls Are Selling
ambient: true

lore: [malmont]

prompt: |
  A market morning in Malmont. Nothing urgent, nothing dangerous — just stalls,
  haggling, and four strangers with too much road dust on them.

  Sodacan Bob wants to look at the smithwork and is unimpressed by most of it.
  Vigil keeps a hand near his coin and says little. Chadwick gets recognised by
  no one, which visibly relaxes him. Leena is drawn to a stall selling old
  maps for reasons she can't quite name.

  Nothing is decided. Nobody learns anything load-bearing. It's just a town,
  for one morning.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
