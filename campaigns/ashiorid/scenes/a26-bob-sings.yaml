# AMBIENT — filler, not plot. Comedic descent-tone.
id: bob-sings
title: A Dwarven Work-Song, Badly
ambient: true
ring_tone: [descent]
mood: [joyful_activation]

lore: []

prompt: |
  Sodacan Bob sings a dwarven work-song. He is not good at it. He is
  completely without embarrassment about this fact and sings louder because
  of it, not less.

  Reactions vary from delight to visible pain. Nobody asks him to stop, or if
  they do, he ignores it happily.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
