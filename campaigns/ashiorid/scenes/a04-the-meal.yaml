id: the-meal
title: Whatever There Is
ambient: true

prompt: |
  The party is eating. The food is not good and there is enough of it.

  Drokki has a great deal to say about how the meal was prepared and would do
  it better. Buffalo eats without comment and wants the conversation to end.
  Helen tries to make it into an occasion. Carl gives his portion away, or
  takes the worst of it, and does not explain why.

  It becomes a small argument about nothing — who cooked, who is cooking
  tomorrow, whether the pot was ever properly cleaned — and it resolves the way
  those arguments resolve, which is that everyone stops talking and keeps
  eating.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
