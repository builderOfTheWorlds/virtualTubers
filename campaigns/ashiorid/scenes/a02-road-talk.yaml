id: road-talk
title: The Road, Later
ambient: true

prompt: |
  A long stretch of road with nothing on it. The party has been walking since
  morning and will be walking until dark.

  They talk about home, because there is nothing else. Drokki describes
  Vabokedos as though everyone has been asking. Carl says something short about
  Nafsari and then stops, having said more than he meant to. Helen talks about
  her village with complete confidence. Buffalo does not talk about where he is
  from, and changes the subject when it comes to him.

  Nobody presses anybody. The road does not end.

  Six to ten short lines. Everything here is read aloud, so write for the ear.
