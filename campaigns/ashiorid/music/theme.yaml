# Ashiorid — central musical theme (synth-ambient).
#
# Written in SCALE DEGREES so the engine (app/music/engine.py) can re-voice
# it in any mood's mode: the same contour is heard bright (lydian, wonder),
# dark (phrygian, tension) or slowed and minor (aeolian, sadness).
# Edit and audition with:
#   .venv/Scripts/python.exe -m music.cli render campaigns/ashiorid/music/theme.yaml --mood sadness
name: ashiorid
description: >
  "The Ten Thousandth Anniversary" — a rising fifth answered by a falling
  line: something ancient, being remembered.
tonic: D
base_octave: 3
beats_per_bar: 4
seed: 10000

# [degree, beats] or [degree, beats, octave_shift]; 0 = rest. 16 beats =
# 4 bars at motif_rate 1 (8 bars when a mood augments it to half speed).
motif:
  - [1, 1]
  - [5, 1]
  - [6, 1.5]
  - [5, 0.5]
  - [4, 1]
  - [3, 1]
  - [2, 2]
  - [1, 1]
  - [5, 1]
  - [8, 1.5]
  - [7, 0.5]
  - [5, 3]
  - [0, 1]

# One chord root per bar; the phrase is 4 bars.
progression: [1, 6, 4, 5]
