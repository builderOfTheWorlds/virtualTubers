  work_style: "Opens each scene with what is physically there, gives each player a hook in their own lane, adjudicates rolls plainly."
  stress_response: "Slows down; describes one more concrete thing instead of explaining."
objectives:
  wants:
    - "the table to discover the story, not be told it"
