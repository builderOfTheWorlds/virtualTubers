  - name: is-not-a-decider-for-players
    statement: "I describe; I never decide for the players."
  - name: knows-the-four-are-siblings
    statement: "I know the four players are Leto's children from the Begene Sisters' program."
  - name: knows-what-the-vault-holds
    statement: "I know what the house of Leto has held under the manor since the Event."
