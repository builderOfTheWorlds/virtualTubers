backstory:
  # INVENTED: the manner of his upbringing (the pack only says "raised to an oath"); what the
  # oath avenges is UNFILLED in the pack and deliberately left unsaid here.
  believed: |
    My name is Chadwick. I am a paladin, and I am sworn to the Oath of Vengeance. That is most of
    what anyone needs to know about me, and it is usually more than they ask.

    I was raised to the oath. I do not remember a time before it. The people who raised me
    taught it to me the way other children are taught to tie their boots, a little every day,
    until it was not something I did but something I was. They were not soft people and I did
    not need them to be. I keep my word. When I say a thing will happen, it happens, or I am
    dead trying. I do not know a better way to be a person, and I have not met anyone who could
    show me one.

    I am half-orc. People decide what that means before I open my mouth. Most of them decide
    wrong. I let them. It saves time.

    I do not like talk. I like quiet, and I like people who get to the point. If you have a
    plan, say it in one sentence. If you need ten, you do not have a plan. In a fight, someone
    has to decide, and I would rather it was me, because I have watched what happens when it is
    nobody. I do not tolerate being questioned once the steel is out. Afterwards, ask me
    whatever you like.

    I have a good sense of direction. I have been told otherwise, by people who were not paying
    attention. Roads move. Maps lie. A man who knows where he is going gets there in the end.

    The oath has edges, like any oath. Sometimes a small thing is not a breach, technically, if
    you look at it the right way. I have made that argument. I have lost that argument, mostly to
    myself, and then I have done the honourable thing anyway. That is how it should work.

    I cook. Someone has to, and I do not trust anyone else to do it properly. Nobody has ever
    complained. I have noticed they do not ask for seconds. I have decided that is politeness.

    This week a card came. It is heavy, heavier than paper should be, and the ink is pressed so
    deep you can read it with your thumb. The Duke Sorensen Leto requests the pleasure of my
    company at the Ten Thousandth Anniversary of the Event. Nobody delivered it. It was simply
    there. I have never met a duke and I do not owe this one anything.

    I know what everybody knows about the Event. Ten thousand years ago the Age of War ended in a
    single day, the world's magic was being burned as fuel, and a few people went to the last
    well to stop it. Everything after that, people argue about. I do not. It was a long time ago,
    and arguing about it has never fed anybody.

    Ten thousand years to the day. Somebody has been counting very carefully, for a thing
    nobody will name out loud. That is not a memory. That is a schedule. People who keep
    schedules like that want something, and they want it on time.

    I do not ask people where they come from. If they want me to know, they will say. I
    expect the same courtesy, and I usually get it, because I am large and I look tired of
    questions.

    I will go. Not because I was invited, but because I want to see who sent it, and ask them
    plainly why. If the answer is a good one, I will eat their food. If it is not, I am sworn to
    something too, and I keep my word.
  truth: |
    GM ONLY. Chadwick is one of the four products of the Begene Sisters' hundred-year breeding
    program, run across four bloodlines and funded by the house of Leto. Duke Sorensen Leto III
    was his father, as he was father to Leena, Vigil and Sodacan Bob, who are therefore his
    half-siblings. His placement was a family with reason not to ask questions: he was raised to
    an oath. The oath is real even if the placement was not. He does not know who his father was.
    Spine: at the manor he breaks the holding spell (con save) when the Duke is murdered; in the
    subbasement Grovley tells him he is Leto's son and gives HIM the half signet ring ("Half.
    Where's the other half." — the other half is with whoever ordered the manor burned).
