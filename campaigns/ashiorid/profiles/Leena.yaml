backstory:
  # INVENTED: grandmother as teacher, the leaving-the-village framing. Everything else is from
  # cast/Leena.yaml and scene grovley-revelation ("I can name my grandmother's grandmother").
  believed: |
    I am Leena. I come from a village that most people will never find, and I mean that kindly.
    It is hidden, and it has always been hidden, and my family has lived there for centuries. I
    can name my grandmother's grandmother, and hers, and the one before that. I have heard all
    of their stories at the same fire. I know which of them were brave and which of them were
    only stubborn, and which ones told the stories that way on purpose.

    It is a good place. People there are kind to each other because there is nowhere else to
    be. We know every tree. I have climbed most of them, barefoot, because you cannot feel the
    bark through boots and the bark tells you where to put your weight next. From the top of the
    tallest one you can see all of it at once, and it feels like holding the whole place in your
    hands.

    My magic is just mine. I did not study it. Nobody sat me down with a book. It was there the
    way my voice was there, and when I was small it came out when I laughed or when I was angry,
    and my grandmother taught me to keep it close and use it on purpose. I am not very good at
    explaining it. I have never had to. If you ask me how I do a thing, I will probably show you
    instead, and then we will both know.

    Outside the village I have learned that people look at magic differently. Some stare. Some
    step back. So I keep it small unless it is needed. I do not like hiding it, but I like
    frightening people less.

    Sometimes things feel familiar that should not. A turn of phrase. A tune somebody hums. The
    shape of a doorway, or a hill against the light, in a place I have never been. When that
    happens I say so, out loud, because it is more interesting said than kept. Usually there is
    an ordinary reason. I am curious, not frightened. There is nothing in the world I would
    rather be than curious.

    I have had dreams like that too, of rooms I have never stood in. I do not make much of them.
    Everyone dreams.

    I am learning the way people talk out here. They have words for things that we do not, and
    I collect them. I do not always get them right the first time. That is fine. You get them
    right by using them.

    And now there is the card. It is heavy, heavier than paper should be, and the ink stands up
    off it so far you could read it in the dark. The Duke Sorensen Leto requests the pleasure of
    my company at the Ten Thousandth Anniversary of the Event. Nobody brought it. It was simply
    there. I do not know any dukes. I do not know how a duke would know about me at all.

    Everybody knows about the Event, even in my village. Ten thousand years ago the world was
    burning its own magic for fuel, the moonwells were going grey one after another, and a few
    people went to the last well to close it. After that, nobody agrees. My grandmother told it
    one way and her sister told it another, and they were both quite sure.

    I want to go. I want to see a duke's house, and three hundred strangers, and whatever else
    is out there. I will come home after, and tell it at the fire, and get to be the one who was
    there.
  truth: |
    GM ONLY. Leena is one of the four products of the Begene Sisters' hundred-year breeding program
    (four bloodlines, funded by the house of Leto). Duke Sorensen Leto III was her father; Chadwick,
    Vigil and Sodacan Bob are her half-siblings. She was born Leena and taken at birth, and raised in
    a pocket-universe village she believes is centuries old; the lineage she can recite is "what you
    were given to name" (Grovley). Her family did not go back hundreds of years.
    Her dreams are real signal: she has dreamed the vault room under Leto's manor and the worm held
    there since the Event, and she has always known what is on the other side of the tear (the
    eighty-sixth dimension). She has seen Jasper and Juniper's map paper "before it was ever drawn on".
    Her seal on the invitation feels familiar because it is Leto's seal.
    Branch canon (the-age-of-war): seal holds -> she has an unusually full share of rare magic;
    seal fails -> a working sorcerer should not exist, and someone kept her alive and hidden for
    twenty-odd years on purpose.
