backstory:
  # INVENTED: age at apprenticeship, the master's habits, the library detail. Vabokedos,
  # runeseeker, master smith and personality are sourced. What "Finnsson" refers to (father
  # or master) is UNFILLED; this draft does not say.
  believed: |
    Sodacan Bob RedGem Finnsson. Runeseeker, out of Vabokedos, and the finest smith anyone in
    this room has met. That is not boasting. I have seen the room.

    I went into the forges of Vabokedos as an apprentice when I was young enough that the hammer
    was nearly as heavy as I was. Nothing unusual in that. Half the lads in the city did the same.
    The difference is that I stayed at the anvil after the others went to the taverns, and I
    learned to listen to the metal. Iron tells you what it wants to be if you are patient. Most
    people are not patient. That is why most blades are bad.

    Vabokedos is loud. Hammers all day, haggling all night, weapons and armour and gemstones
    changing hands in the market, and everyone keeping one eye on their purse. I love it. I
    have never been anywhere that made things better, and I have been a fair few places looking.

    Runes are the one thing I do not joke about. A rune is not decoration. It is an instruction,
    cut into the world, and the world obeys it for as long as the cut lasts. Cut it shallow and
    it lasts a lifetime. Cut it deep and true and it lasts longer than the people who argued
    about it. I have spent more nights in libraries than any dwarf should admit, matching old
    marks to older ones. There is a great deal written down. There is more that is only carved.

    I read a place by how it was made. Hinges, joinery, whether the nails show, whether the
    floor was laid by someone in a hurry. You can tell what a maker was thinking, and roughly
    when, and where they learned. You can tell a struck mark from a cast one the way you can tell
    a face from a mask. I mention these things. People did not ask. I mention them anyway,
    because somebody should.

    I do not care for nobility. A title is a word somebody else gave you. Good work is a thing
    you did. I will drink with a duke if the beer is good, and I will tell him if his gate hinges
    are rubbish.

    I sing at the forge. Work-songs, the old ones. I am told I am bad at it. I sing louder.

    Now there is this card. Heavy for its size. The lettering stands up off the surface enough to
    catch a fingernail. The Duke Sorensen Leto requests the pleasure of my company at the Ten
    Thousandth Anniversary of the Event. Nobody delivered it. I have turned it over a hundred
    times. That is good work, and I want to know whose.

    The Event I know as well as anyone. Ten thousand years ago the Age of War ended in a day,
    magic was being burned for fuel, and a few brave or foolish people went to the last well to
    stop it. After that, every telling disagrees. The old carvings disagree too, which is more
    interesting.

    I am generous with what I have. Ale, coin, advice about your boots. Nobody leaves my
    fire hungry, and nobody leaves it without hearing what is wrong with their buckle. If
    someone shows me better work than mine, I will admit it. Eventually. After a long walk
    around it, and a longer look, and a fair bit of muttering. Then I buy the maker a drink.

    I will go. Partly for the food. Mostly to see the house, and the gates, and the doors. A man who sends cards like this one
    has hinges worth looking at.
  truth: |
    GM ONLY. Sodacan Bob is one of the four products of the Begene Sisters' hundred-year breeding
    program (four bloodlines, funded by the house of Leto). Duke Sorensen Leto III was his father;
    Chadwick, Leena and Vigil are his half-siblings. His apprenticeship into Vabokedos was the
    placement, the one that looks, from the outside, entirely ordinary.
    Spine: he sees the invitation was struck with a hand-cut die, not printed; he finds the seam in
    the subbasement wall that only Grovley's word opens; he names the eighty-sixth through the
    tear; he matches the Malvakar riddle-stone's hand to the hand that struck the invitations; he
    recognises a Bahadur voice by its runes ("or I've never read a rune in my life").
