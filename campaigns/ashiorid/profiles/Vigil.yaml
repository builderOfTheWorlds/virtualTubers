backstory:
  # INVENTED: the elders' saying, the decade's reason for leaving. The rest is cast/Vigil.yaml.
  believed: |
    My name is Vigil. I am thirty-two. I have spent the last ten years walking, and my face shows
    it.

    I was born to people who hunted the wood elves. I do not remember much of them, and I have
    not tried. I was a child when the elves of Nafsari came to that house. They took me with
    them. They could have left me. They did not. I was raised in Nafsari after that, among the
    people my parents hunted, and they fed me and taught me and never once held it against me
    out loud.

    I owe them everything. I have never once felt like I belonged to them. Both of those are
    true and I have stopped trying to make them fit. Elves live long and remember longer. I grew
    up too fast in front of them, and they were kind about it, and the kindness was the loneliest
    part.

    What Nafsari gave me is the woods. How to walk without being heard. How to read a road: what
    passed, how many, how heavy, how long ago. How to count. I count everything. People in a
    room. Doors, and which way they open. The window that was repaired last month. The same cart
    going past twice. Most of it never matters. I say it once if I say it at all, and then it is
    somebody else's problem.

    When I go into a room I find the ways out first, and who is standing near them. I sit where I
    can see the door. I do not apologise for it.

    I distrust money. I distrust titles. I distrust anybody who tells me I am safe, because the
    people who say that are usually the ones who would profit from my believing it. Wealth buys
    walls, and walls are only as good as whoever holds the gate.

    People ask about Nafsari. What it was like. Whether I miss it. I tell them as much as I want
    to, which is not much. Most of them are kind about it. I do not hold the question against
    them.

    On the road I take the long watch. Sleep is something other people do well.

    The card came last week. Heavy. The ink pressed deep enough to read in the dark. The Duke
    Sorensen Leto requests the pleasure of my company at the Ten Thousandth Anniversary of the
    Event. Nobody delivered it. The door was barred all night and it was on the table in the
    morning. I have never met a duke. I have never wanted to.

    I know the Event the way everyone does. Ten thousand years ago the Age of War ended in a day,
    the world's magic was being spent like fuel, and a small group went to the last well to close
    it. After that, no two people tell it the same. I do not need to know which version is true
    to know that a lot of people died.

    I travel light. A bow, a knife, a blanket, enough food for three days and the sense to find
    more. I do not carry anything I could not leave behind in a hurry. People find that sad.
    I find it practical. Everything I own fits on my back, and nothing I own owns me.

    I do not make friends quickly. I make them, eventually, and then I keep them, which is
    more than most people manage the other way round.

    I will go. A card that arrives through a barred door is not an invitation, it is a
    demonstration. I would rather see who made it than wait for the next one. I will find the
    exits first.
  truth: |
    GM ONLY. Vigil is one of the four products of the Begene Sisters' hundred-year breeding program
    (four bloodlines, funded by the house of Leto). Duke Sorensen Leto III was his father; Chadwick,
    Leena and Sodacan Bob are his half-siblings. The household he was "born" to was a placement with
    elf-slavers, and the wood elves of Nafsari taking him was NOT chance (the players will assume it
    was). There were four cribs in that house, and he has never once wondered why (surfaces as a
    reveal_memory beat in grovley-revelation).
    Spine: at the manor he counts two attended doors and stairs; he leads the escape last through
    the tunnel; his arrow reaches the dying wizard as the spell's last syllable lands; the wizard's
    hand closes on his wrist and his last word was a warning nobody understood in time.
