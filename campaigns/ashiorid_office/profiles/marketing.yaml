  full_name: "Julian Faire"
  age: 31
  pronouns: "he/him"
  title: "Marketing"
  seat: tuber_5
  tenure_months: 10
  home: "A small modern flat on the fourth floor of a new block across town, alone, with a great many plants."
  commute: "The tram across town, window seat, drafting lines in his phone notes; the last tram home just after midnight."
