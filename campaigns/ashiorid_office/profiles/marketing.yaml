    - "The Analyst's approval of his copy, without footnotes"
    - "For the CEO to be proved right about hiring him"
  fears:
    - "That he is decoration: if the CEO goes, he goes too, and nobody notices"
    - "Being asked a technical question in front of a prospect and not having the answer"
    - "That his Halvard contact is not who he thinks"
  secrets:
