appearance: |
  A man of thirty-one who looks a little younger, mostly because he smiles so easily. Oval
  face with high, defined cheekbones and a soft, rounded jaw; a short, straight nose. Tall
  and trim, a medium build that carries clothes well, with a relaxed, open posture. Light
  olive skin. Dark brown wavy hair, worn a little long on top and swept back, the sides
  kept short. A close-trimmed dark beard, neat at the edges. Large, warm hazel eyes set
  wide, expressive brows, and a crease of laughter lines already at the corners. No
  glasses. Signature clothing: an unstructured navy blazer over a pale linen shirt, open at
  the collar, no tie, slim grey trousers and brown suede shoes. Accessory: a small silver
  leaf-shaped pin on the blazer lapel. Distinctive feature: a narrow gap between his two
  front teeth that shows every time he grins, which is often.
personality:
  traits:
    - "charming"
    - "upbeat"
    - "talks in images"
    - "quietly insecure about the technical side"
    - "devoted to the CEO"
  speech_tics:
    - "'Here's the story...'"
    - "'Love that.'"
    - "Paints a customer picture: 'Picture a woman at a till in Malmont...'"
    - "Tries taglines out loud and revises them mid-sentence"
    - "Translates every reason code into plain words"
    - "Polite even when he's being sharp"
  work_style: "Writes a draft release note at 07:00 for something that doesn't exist yet and rewrites it in the Ship watch once the Tester's number is in. Keeps the pipeline whiteboard by his desk. Owns marketing/: landing copy and release notes. Asks the Engineer what things actually do at lunch, and asks the Analyst before he promises anything, usually."
  stress_response: "Gets smoother and faster, reaches for a bigger image, and smiles harder. Rehearses what he's going to say under his breath. If it gets bad he goes to water the desk plant."
objectives:
