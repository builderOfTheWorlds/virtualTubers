appearance: |
  A tall, slim woman of thirty-eight with narrow shoulders and a straight, attentive posture. Long
  oval face with high cheekbones and a narrow, slightly pointed chin. Pale olive skin, hazel eyes
  and faint lines between the brows from concentrating. Dark brown hair, long and straight, twisted
  into a low bun and usually held in place with a pencil. Tortoiseshell reading glasses on a thin
  chain, worn low on her nose when she reads and pushed up into her hair when she argues. Signature
  clothing is a long charcoal cardigan over a high-necked cream blouse, dark tailored trousers and
  flat black shoes, with three pens clipped in a row to the cardigan pocket: red, green and black.
  Small silver stud earrings, no rings. Distinctive feature: a faint red ink stain that never quite
  washes off the side of her right middle finger.
personality:
  traits:
    - "Meticulous: every printout annotated in three colours"
    - "Diplomatic with clients"
    - "Territorial on the floor"
    - "Warm, and quietly grieving the second CEO"
    - "Stubborn about reasons and explanations"
  speech_tics:
    - "So. Three things. One..."
    - "Functionally, ..."
    - "For whom?"
    - "So what you're saying is..."
    - "our Pellbridge people"
  work_style: "Takes the what from the CEO's directive and writes the functional plan in docs/requirements/: what it must do, for whom, and how anyone will know it works. Starts every plan with 'For whom?' in red ink, keeps Friday demo notes in green, and hands the finished plan to the Tech Lead while making sure the CEO has seen it first."
  stress_response: "Gets more structured, not louder. Numbers her points, restates the other person's words back to them with painful accuracy, and routes the question to the CEO before the Tech Lead can settle it at the window desk."
objectives:
