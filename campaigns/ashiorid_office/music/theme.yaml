# Ashiorid office — central musical theme (office lo-fi).
#
# Written in SCALE DEGREES so the engine (app/music/engine.py) can re-voice
# it in any mood's mode: the same lazy, off-beat contour reads warm (major,
# a good morning), tense (phrygian, a red suite at 18:00) or slowed and
# minor (aeolian, an empty desk).
# Edit and audition with:
#   .venv/bin/python -m music.cli render campaigns/ashiorid_office/music/theme.yaml --mood tension
name: ashiorid_office
description: >
  "Morning watch" — a lo-fi figure that leans off the beat and keeps
  circling the same few notes, like a first coffee going cold beside a
  keyboard. The ii-V-I-vi turnaround never quite lands.
tonic: F
base_octave: 3
beats_per_bar: 4
seed: 600

# [degree, beats] or [degree, beats, octave_shift]; 0 = rest. 16 beats =
# 4 bars at motif_rate 1. The half-beat rests push each phrase off the beat.
motif:
  - [0, 0.5]
  - [3, 0.5]
  - [5, 1]
  - [6, 0.5]
  - [5, 1.5]
  - [0, 0.5]
  - [2, 0.5]
  - [4, 1]
  - [3, 0.5]
  - [2, 1.5]
  - [0, 0.5]
  - [3, 0.5]
  - [5, 1]
  - [7, 0.5]
  - [8, 1]
  - [6, 0.5]
  - [5, 3]
  - [0, 1]

# One chord root per bar; the phrase is 4 bars. ii - V - I - vi.
progression: [2, 5, 1, 6]
