  synopsis: The journey north takes the party across glass plains where the wind screams.
    The Malvakar monument rises from the black glass, a slab of obsidian etched with
    runes that predate the Event. The riddle is not spoken; it is felt. As the party
    stands before the stone, the map reacts, and the monument answers, opening a door
    that should not exist. Inside, the air tastes of ozone and old blood, and the
    first fragment of the route is within reach, but something watches from the cracks
    in the glass.
