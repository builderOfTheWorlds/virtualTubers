  - bahadur-revealed
  synopsis: The rune from the wizard's journal unlocks a hidden frequency in the map,
    projecting a holographic ledger that reveals the truth of the Begene Program.
    The party realizes Chadwick, Leena, Vigil, and Sodacan Bob are all children of
    Duke Leto, bred to serve the Bahadur's plan to reopen the door to Ord. The tear
    in the air begins to widen, not from magic, but from a microfracture forced by
    a sleeper agent in their midst. The tear does not close; it answers back, calling
    to the blood in their veins.
