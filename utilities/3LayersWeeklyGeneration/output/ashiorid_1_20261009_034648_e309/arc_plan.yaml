  synopsis: Four days south of the ashes, the road widens into Malmont, a town that
    has never heard of them. Amidst the uneasy balance of day-watch and night-stalkers,
    the group pieces together the fractured history of the Event through recovered
    accounts and the first monument’s riddle. The black glass plain of the Malvakar
    answers itself to those who know where to look, and the map’s next mark draws
    them toward the first of nine doors. The road ahead is long, but the first step
    is complete.
