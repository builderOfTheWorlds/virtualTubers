  synopsis: 'Beneath the frozen party, the butler Grovley guides the four into the
    subbasement, where he reveals what they truly are: products of the Begene Sisters’
    breeding program and heirs to a century of hidden lineage. Behind a concealed
    wall lies the vault containing The Word and the Worm, the anchor of the manor’s
    ten-thousand-year watch. A tear in the air begins to weep, and it answers back,
    exposing the Bahadur’s ten-millennia harvesting of Ashiorid’s magic to fund a
    fractured gateway home.'
