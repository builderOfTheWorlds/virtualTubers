  synopsis: Four strangers receive identical cards marking the ten-thousandth anniversary
    of the Event. They arrive at Duke Sorensen Leto the Third’s manor, expecting a
    celebration, but find the doors opening onto uninvited guests and a room that
    suddenly stops moving. The party is suspended in an unnatural stasis as the true
    nature of the gathering reveals itself.
