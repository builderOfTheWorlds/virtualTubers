  title: The Arrival and the Stillness
  summary: Four strangers approach Duke Sorensen Leto the Third’s manor, clutching
    identical commemorative cards for the Event’s ten-thousandth anniversary. As the
    grand doors swing open, they step into a foyer filled with uninvited guests, only
    for the entire space to abruptly freeze. Time halts mid-breath, leaving the newcomers
    suspended in the threshold as the first whispers of the manor’s secret begin to
    surface.
  continuity_in: The strangers approach the manor grounds, cards in hand, anticipating
    the anniversary celebration.
  continuity_out: The doors swing wide to reveal a hall of uninvited guests, and the
    ambient motion of the world abruptly ceases as the room locks into stasis.
