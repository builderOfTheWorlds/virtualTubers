  title: The Frozen Gala and the Unveiling
  summary: 'Suspended in an unnatural pause, the party’s true purpose is laid bare:
    the gathering was never a celebration, but a convergence point for the Event’s
    lingering resonance. The strangers realize they are part of a deliberate pattern,
    their identical cards acting as anchors in the temporal lock. The manor’s architecture
    hums with dormant energy, holding every guest in perfect, weightless suspension
    as the deeper mechanics of the anniversary take shape.'
  continuity_in: The room locks into stasis, trapping the manor’s guests in a suspended
    moment while the invitation cards remain tightly clutched in hand.
