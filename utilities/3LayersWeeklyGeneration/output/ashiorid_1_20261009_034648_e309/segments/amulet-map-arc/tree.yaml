  title: Malmont's Silent Heart
  summary: The party enters Malmont, a town that feels deeply wrong. Magic shops brim
    with stock, yet blacksmiths work without fire, and locals flinch at the name 'Leto'.
    Grovley's half of the signet ring grows heavy in his palm. Above all, the map's
    mark pulses in time with the town's concealed heartbeat, hinting at secrets the
    constable cannot touch.
  continuity_in: The road south leads to Malmont, where the town's strange silence
    and hidden pulse await their arrival.
