synopsis: 'The map hums as the ink settles, burning a fresh mark into the parchment
  that points north toward a jagged peak. The party leaves the ashes of the manor
  behind, finding the road south leads to Malmont, the first settlement in days. The
  town feels wrong: the magic shops are full, but the blacksmiths are cold, and the
  locals avoid the word ''Leto''. Grovley''s half of the signet ring feels heavy,
  and the map''s mark pulses in rhythm with the town''s hidden heartbeat.'
continuity_in: The map's next mark is revealed; the nine-door route begins.
continuity_out: The mark points to the northern monument; Malmont holds a secret the
  constable cannot touch.
