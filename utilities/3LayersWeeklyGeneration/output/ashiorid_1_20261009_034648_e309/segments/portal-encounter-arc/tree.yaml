  summary: The second mark leads back to the ruins of the manor's grounds, now overgrown
    with strange, silver flora. A dying wizard lies at the threshold of a shimmering
    tear in the air, his robes scorched with Bahadur sigils. He gasps a warning about
    the 'harvest' before his body crumbles to ash, leaving behind a journal filled
    with calculations on energy storage and a single, glowing rune. As the party studies
    the rune, the moonwell beneath the ruins flares with light, and the seal holds,
    preserving the last dregs of magic in the world.
  continuity_in: The map draws the second mark, which points toward the town's unregistered
    night.
  continuity_out: The wizard's warning reveals the Bahadur's endgame; the seal holds,
    confirming the current timeline.
