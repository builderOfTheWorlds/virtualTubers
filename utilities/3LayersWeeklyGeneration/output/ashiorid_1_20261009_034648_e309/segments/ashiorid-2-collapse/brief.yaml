synopsis: The hold breaks too late. Flames consume the manor as the four escape into
  the smoke-choked night, forced to make a final decision at a widening tear in the
  air. They step through just as a dying wizard finishes his work at the tunnel’s
  mouth, leaving behind a fragment of the amulet-map and a warning about the wells.
  The portal deposits them onto a quiet road, the weight of the burning past settling
  behind them.
continuity_in: The tear widens; the manor’s foundations groan under the strain of
  exposed magic.
continuity_out: The portal deposits them onto a quiet road; the amulet-map fragment
  is secured.
