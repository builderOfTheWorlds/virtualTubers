  containing The Word and the Worm, the anchor of the manor’s ten-thousand-year watch.
  A tear in the air begins to weep, and it answers back, exposing the Bahadur’s ten-millennia
  harvesting of Ashiorid’s magic to fund a fractured gateway home.'
