  parent_id: portal-encounter-arc
  order: 1
  depth: 1
  title: The Warning Beyond
  summary: With his final breath, the wizard delivers his warning to the void beyond
    the tear. His voice echoes through dimensions as he describes the entities that
    dwell in the spaces between spaces - beings of pure entropy and chaos that have
    been drawn to this moment of dimensional weakness. He explains that these creatures
    are not merely destructive but fundamentally incompatible with existence as they
    know it, and their arrival will reshape reality itself. The warning resonates
    across the void, carrying the weight of his knowledge into the unknown.
  continuity_in: As he speaks his final words, the very fabric of reality around him
