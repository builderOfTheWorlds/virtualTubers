  node_id: invitation-arc-n1
  parent_id: invitation-arc
  order: 1
  depth: 1
  title: The Gathering
  summary: Each stranger arrives at Leto's Manor to find it unlike anything they've
    ever seen - a place where time seems to flow differently, where the very air hums
    with ancient energy. They discover that others have arrived before them, and that
    this gathering is part of something far larger than individual destiny. The manor
    itself begins to shift and change as the party commences, revealing secrets about
    their shared past and the Event that transformed their world.
  continuity_in: The cards arrive simultaneously across the realm, each stranger feeling
    an inexplicable pull toward the manor despite their different locations and circumstances.
  continuity_out: As the party continues, the strangers realize they are not alone
    in their journey - others have been watching, waiting, and preparing for this
    convergence of destinies.
