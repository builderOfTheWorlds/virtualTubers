  title: The Cards Arrive
  summary: Ten thousand years to the day since the Event, four strangers each receive
    a mysterious card inviting them to a party at Leto's Manor. Each card bears strange
    symbols and promises revelations about their past lives. The recipients are drawn
    from different walks of life - a scholar, a soldier, a healer, and a merchant
    - all living in the shadow of the great upheaval that changed everything.
  continuity_in: Ten thousand years to the day since the Event, four strangers each
    receive a mysterious card inviting them to a party at Leto's Manor.
  continuity_out: The cards arrive simultaneously across the realm, each stranger
    feeling an inexplicable pull toward the manor despite their different locations
    and circumstances.
