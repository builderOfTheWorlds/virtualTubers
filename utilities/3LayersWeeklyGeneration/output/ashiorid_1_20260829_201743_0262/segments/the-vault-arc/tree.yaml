  title: The Moonwell Connection
  summary: Through careful examination of the subbasement's findings, the party discovers
    that Leto's family has been the guardian of a network of moonwells, with each
    generation taking responsibility for maintaining the balance between the earthly
    realm and the celestial forces. They learn how their own family line is connected
    to this ancient duty, and what terrible consequences await if they fail in their
    role as guardians.
  continuity_in: The party realizes the full scope of their responsibility and the
