  parent_id: magic-lost-arc
  order: 0
  depth: 1
  title: The Collapse of Magical Reality
  summary: The seal fails and the last well runs dry, marking the definitive end of
    magic in their world. The four strangers witness the complete collapse of the
    magical infrastructure they've come to rely on, leaving them suddenly vulnerable
    and human in a realm where sorcery was once commonplace. They realize that without
    magic, their journey has fundamentally changed and their abilities are now meaningless.
  continuity_in: The seal fails, and the last well runs dry. Magic dies out, and the
    four strangers realize they are now in a world where sorcery is impossible — unless
    one of them is different.
  continuity_out: The four strangers stand in the ruins of what was once a magical
    realm, their bodies now subject to natural laws, yet each carrying the potential
    for something different.
  target_words: 210
  target_slots: 2
  kind: leaf
  forced: false
  children: []
