magic-lost-arc-n1:
  node_id: magic-lost-arc-n1
  parent_id: magic-lost-arc
  order: 1
  depth: 1
  title: The Revelation of Individual Difference
  summary: As magic fades from the world around them, the four strangers begin to
    notice subtle differences in their own experiences. While others seem to have
    lost all magical abilities, one among them retains some capacity for the arcane
    — or perhaps discovers they were never truly human at all. This realization creates
    a schism among the group as they question who among them might be the key to restoring
    magic or understanding what has really happened.
  continuity_in: The four strangers stand in the ruins of what was once a magical
    realm, their bodies now subject to natural laws, yet each carrying the potential
    for something different.
  continuity_out: The group is divided by this discovery, with one member's unique
    abilities becoming both a source of hope and suspicion among the others.
  target_words: 490
  target_slots: 5
  kind: leaf
  forced: false
  children: []
