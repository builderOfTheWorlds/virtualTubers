letos-manor-arc-n1:
  node_id: letos-manor-arc-n1
  parent_id: letos-manor-arc
  order: 1
  depth: 1
  title: The Hidden Truth
  summary: After being rejected from the manor, the strangers discover that Duke Sorensen
    Leto III's party was not just a social gathering but part of a larger cosmic ritual.
    The duke has been waiting for ten thousand years to perform a ceremony that requires
    specific outsiders to participate. The strangers realize their presence wasn't
    accidental - they were chosen for a reason. As they explore the manor's hidden
    passages, they uncover ancient texts revealing that this party was designed to
    open a gateway between dimensions, and they are the key elements needed to complete
    the ritual.
  continuity_in: The strangers are turned away by the duke's guards and servants who
    refuse to allow them entry. They must now find another way to approach the duke
    or leave this place entirely.
  continuity_out: The strangers have discovered that they were specifically chosen
    for a cosmic ritual, and their presence at the manor was part of a ten-thousand-year
    plan orchestrated by Duke Sorensen Leto III.
