  title: Arrival and Rejection
  summary: The four strangers arrive at Duke Sorensen Leto III's manor for a party
    that was planned ten thousand years in advance, only to discover they are not
    welcome. They are immediately met with hostility from the duke's servants and
    guards who recognize them as outsiders. The strangers attempt to explain their
    presence but are quickly ushered away by the stern guards. Despite their attempts
    at diplomacy, they realize this is a place where they don't belong, and the duke's
    estate seems to be designed to exclude them rather than welcome them.
  continuity_in: The four strangers arrive at Duke Sorensen Leto III's manor for a
    party that was planned ten thousand years in advance, only to discover they are
    not welcome.
  continuity_out: The strangers are turned away by the duke's guards and servants
    who refuse to allow them entry. They must now find another way to approach the
    duke or leave this place entirely.
