malmont-arrival-arc-n1:
  node_id: malmont-arrival-arc-n1
  parent_id: malmont-arrival-arc
  order: 1
  depth: 1
  title: Shadows of the Past
  summary: As the party explores Malmont's main square, they discover a weathered
    stone marker that tells the tale of a great magical cataclysm that once shattered
    the town's protective wards. The marker speaks of how the very fabric of magic
    in this region was torn asunder, leaving only whispers and echoes of what once
    was. Strange symbols carved into the stone seem to pulse faintly with residual
    energy, drawing the party's attention as they realize this is no ordinary place.
  continuity_in: The party navigates the quiet streets of Malmont, their footsteps
    echoing in the unnatural silence as they search for information about local threats
    and opportunities.
  continuity_out: The party investigates the ancient stone marker, uncovering secrets
    that suggest a deeper mystery lies beneath Malmont's seemingly peaceful surface,
    with the residual magical energy hinting at future revelations.
