  title: The Weight of Silence
  summary: The party arrives in Malmont, a town where magic is scarce and danger lurks
    in the shadows. They immediately notice the absence of magical auras that they're
    accustomed to, making every step feel heavier with anticipation. The cobblestone
    streets echo with an unnatural quiet, as if the very air holds its breath. The
    locals keep their distance, eyes darting nervously between the party and the dark
    alleys that branch off from the main square.
  continuity_in: The party arrives in Malmont, a town where magic is scarce and danger
    lurks in the shadows.
  continuity_out: The party navigates the quiet streets of Malmont, their footsteps
    echoing in the unnatural silence as they search for information about local threats
    and opportunities.
