  title: Dangerous Knowledge
  summary: As the initial shock wears off, the group realizes that their former mastery
    of magic has become a liability. They must navigate a world where anyone with
    magical knowledge is either hunted or revered, and their expertise puts them in
    grave danger while simultaneously making them invaluable to those who seek to
    exploit what they know.
  continuity_in: The group begins to understand that their magical abilities are now
    not just useless but potentially deadly in this new world order.
