  title: The Seal's Collapse
  summary: The ancient magical seal that maintained the balance between the mortal
    realm and the source of all magic begins to fail. Cracks form across its surface
    as the protective barrier weakens, allowing a sudden surge of raw magical energy
    to escape. The players witness this catastrophic failure firsthand, feeling the
    ground tremble beneath their feet as the magical forces they've relied upon begin
    to unravel.
  continuity_in: The seal that held back the tide of magic begins to crack and fail.
  continuity_out: The seal's collapse sends shockwaves through the land, causing immediate
    magical disruptions in the surrounding area.
