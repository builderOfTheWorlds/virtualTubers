  title: The Last Well's Final Drain
  summary: As the seal gives way, the last remaining source of pure magical energy
    - a sacred well that has sustained magic throughout the realm for centuries -
    begins to run dry. The players observe the well's magical properties fading away,
    its surface turning to stone as the lifeblood of magic is drawn from it. This
    moment marks the beginning of the end for the magical world they've known, with
    consequences rippling outward to affect all living things.
  continuity_in: The seal's collapse causes the last well to begin draining of its
    magical essence.
  continuity_out: The well's depletion leaves behind a barren landscape where magic
    once flourished, setting the stage for new challenges and dangers.
