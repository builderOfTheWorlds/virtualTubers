  order: 0
  depth: 1
  title: The Cards Arrive
  summary: Ten thousand years to the day since the Event, four strangers each receive
    the same mysterious card, marking the beginning of their journey. Each person
    finds the card in their pocket, on their doorstep, or delivered by an unknown
    hand. The cards are identical - a single symbol etched into silver that seems
    to pulse with its own inner light.
  continuity_in: Ten thousand years to the day since the Event, four strangers each
    receive the same mysterious card, marking the beginning of their journey.
  continuity_out: The cards arrive simultaneously across the world, each stranger
    receiving theirs at exactly the same moment, though they live thousands of miles
    apart in different cities and cultures.
