invitation-arc-n1:
  node_id: invitation-arc-n1
  parent_id: invitation-arc
  order: 1
  depth: 1
  title: First Steps
  summary: Each stranger begins to investigate their card's meaning. Some research
    ancient texts, others seek out experts, while a few simply feel compelled to follow
    an instinct that the card has awakened within them. The first signs of the journey
    begin as each person starts to notice changes in their world - subtle shifts in
    weather, strange dreams, or an inexplicable pull toward distant places.
  continuity_in: The cards arrive simultaneously across the world, each stranger receiving
    theirs at exactly the same moment, though they live thousands of miles apart in
    different cities and cultures.
  continuity_out: As each person begins to act on their card's influence, they unknowingly
    start moving toward a common destination, though they have no idea that others
    share their experience or are destined for the same place.
