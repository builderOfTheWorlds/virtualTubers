  title: The Crucible of Ruin
  summary: The players witness the peak of magical warfare during the Age of War,
    examining the catastrophic battles where entire cities were consumed by arcane
    flames. They learn about the desperate measures taken by both sides, the moral
    compromises made by leaders, and how the very fabric of reality began to unravel
    under the weight of magical destruction. This period reveals the true horror of
    war fueled by magic.
