    to protect them.
- kind: dialogue
  speaker: gm
  text: 'As the GM, I assure you that the accounts of the Event vary, but the consequences
    are stark: either magic was saved, or it was lost forever.'
- kind: dialogue
  speaker: sodacan_bob
  text: 'I''ve seen the scars on the land, the charred remains of once-great cities,
