  order: 1
  depth: 1
  title: The Cost of Silence
  summary: With magic gone, the players must confront the harsh realities of a world
    without supernatural aid. The last well's dryness represents not just the depletion
    of resources, but the loss of protection, healing, and wonder that magic once
    provided. Communities begin to crumble as people struggle to adapt to mundane
    existence, while the players face new challenges that require cunning, strength,
    and resourcefulness rather than spells.
  continuity_in: The magical energies begin to destabilize across the realm
  continuity_out: The players must navigate a world without magic's support
