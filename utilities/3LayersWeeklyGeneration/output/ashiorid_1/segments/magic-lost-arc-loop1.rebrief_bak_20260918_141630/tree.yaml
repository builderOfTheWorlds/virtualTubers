  title: The Crack in the Veil
  summary: As the magical seal shatters, reality begins to fray at the edges. The
    last well's waters turn to silver mist, and the very air grows thick with static
    electricity. Players witness the immediate physical manifestations of magic's
    departure - floating debris, flickering shadows, and the sudden inability of spells
    to take hold. The world around them starts to feel less solid, less certain.
  continuity_in: The seal fails, and the last well runs dry. The players witness the
    consequences
  continuity_out: The magical energies begin to destabilize across the realm
