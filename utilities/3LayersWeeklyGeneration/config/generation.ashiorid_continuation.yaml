# Continuation config for ashiorid_1 — generates PAST the Letos Manor intro
# arc (invitation -> the-vault/portal-encounter) into the post-manor spine:
# portal-choice, bahadur-revealed, malmont-arrival, amulet-map,
# malvakar-riddle — and, via the arc planner's loop/fork mechanism (see the
# original production arc_plan.yaml, orders 24-27), additional segments that
# revisit and extend those scenes with new state/carry combinations rather
# than stopping at one segment per spine scene.
#
# hours_total=168 / segment_hours=6 -> 28 segments requested (matches
# production's real scale), but with fast/light local models throughout so
# a full run finishes in well under half an hour instead of days. Submit via
# the 3layer-generator API (campaign manager) rather than running ad hoc, so
# the job is tracked with an id and visible in the dashboard.

campaign:
  pack: campaigns/ashiorid_1

output:
  dir: utilities/3LayersWeeklyGeneration/output

defaults:
  provider: ollama
  base_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 1024
  timeout_s: 180

budget:
  measured_baseline:
    words_per_take: 105
    beats_per_take: 7.7
    generation_words_per_min: 95.4
  target_total_words: 25200
  target_total_hours: 168
  target_words_per_hour: 150
  takes_per_slot_semantics: choice_pool

arc:
  models:
    light:
      model: "qwen3-coder:30b"
    heavy:
      model: "qwen3-coder:30b"
  active_model: light
  hours_total: 168           # -> n_segments = ceil(168/6) = 28 segments
  segment_hours: 6
  batch_size: 5
  max_attempts: 2

segment:
  models:
    light:
      model: "qwen3-coder:30b"
    heavy:
      model: "qwen3-coder:30b"
  active_model: light
  target_words: 700
  target_slots: 12
  tree:
    max_leaf_slots: 5
    max_children: 3
    max_depth: 2
    min_node_words: 50
    leaf_density_floor: 0.50
  concurrency: 4
  max_attempts: 3
  sensitivity_budget: 0.40
  density_floor: 0.50

dialogue:
  breaker:
    window: 30
    failure_rate: 0.5
    min_samples: 10
  models:
    light:
      model: "llama3.1:8b"
      temperature: 0.9
      max_tokens: 300
    heavy:
      model: "llama3.1:8b"
      temperature: 0.9
      max_tokens: 300
      num_ctx: 4096
  active_model: light
  max_recent: 6
  max_words: 45
  max_beats: 8
  takes_per_slot: 1
  neutral_takes: 1
  concurrency: 6
  max_attempts: 2
  seconds_per_take: 8

state:
  flags:      [Leena-wounded, moonwell-tainted, chadwick-lost-axe]
  moods:      [tense, weary, hopeful, giddy]
  carry_keys: [Leena-wounded, moonwell-tainted]
