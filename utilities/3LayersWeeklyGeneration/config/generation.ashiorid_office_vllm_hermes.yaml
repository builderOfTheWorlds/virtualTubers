# Regeneration run for campaigns/ashiorid_office (OB-40 follow-on) using
# vLLM-served Hermes-3-Llama-3.1-70B-FP8 for ALL THREE layers (arc, segment,
# dialogue) — not split across vLLM + Ollama.
#
# Rationale (2026-09-29 operator decision, revised): this GB10 box does not
# have enough unified memory to run vLLM's 70B FP8 (~68GB weights + KV
# cache) and Ollama's llama3.1:8b (~23GB) at the same time — confirmed by
# `free -h` showing 119GB/121GB used and 14GB into swap while both were
# loaded, which starves the whole system. Since vLLM is already resident
# for arc/segment, dialogue now reuses that same server rather than loading
# a second model. Ollama is stopped for the duration of a vLLM-served run
# (`ollama stop llama3.1:8b`) to free the memory vLLM needs.
#
# Trade-off accepted: dialogue takes lose the free concurrency headroom a
# second, smaller model would give (llama3.1:8b's own KV cache didn't
# compete with the 70B's), and every dialogue call now shares the same
# ~70k-token KV cache pool as arc/segment. Concurrency is kept modest
# (see `dialogue.concurrency` below) to avoid exhausting it.
#
# Endpoint: container vllm-hermes3-70b (deployment:
# environments/argyreServer/deployments/vllm-hermes3-70b), OpenAI-compatible
# server on host port 8092. Served model name: hermes3-70b (config `model:`
# below MUST use this served name, not the HF repo path). Auth: bearer key
# VLLM_API_KEY from that deployment's .env.
#
# Known pitfall fixed in this deployment (see vllm-on-gb10-blackwell skill):
# this checkpoint's compressed-tensors W8A8 FP8 quantization has NO Triton
# kernel (only per-tensor Cutlass or Torch fallback exist for this scheme —
# Triton only covers the block-scaled FP8 variant). `--linear-backend triton`
# silently falls back to the broken CutlassFP8ScaledMMLinearKernel on this
# GB10's SM (`cutlass_gemm_caller.cuh:62, Error Internal`, confirmed by two
# crash-loop attempts on 2026-09-29). Forcing `--linear-backend torch`
# (TorchFP8ScaledMMLinearKernel) avoids the broken Cutlass path entirely and
# is what the deployment's docker-compose.yml actually uses.
#
# vLLM is NOT a reasoning model here (no <think> tags for Hermes-3), so no
# thinking-token budget headroom is needed — max_tokens can stay modest.
#
# Segment-stage prompt fix (2026-09-29): the original build_leaf_prompt
# under-specified `depends_on`, and Hermes-3-70B-FP8 repeatedly invented
# slot-id-shaped values there instead of copying from the legal state-key
# list, failing validation on every retry and producing empty segments.
# Fixed in segment_schema.py with an explicit definition + inline example;
# confirmed 5/5 clean live-model replies after the fix (was ~1/3 before).

campaign:
  pack: campaigns/ashiorid_office

output:
  dir: utilities/3LayersWeeklyGeneration/output

defaults:
  # Not actually used at runtime — every layer below (arc/segment/dialogue)
  # sets provider: vllm explicitly. Left as ollama/localhost only as an
  # inert fallback shape; do not rely on it.
  provider: ollama
  base_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 1024
  timeout_s: 600

budget:
  measured_baseline:
    words_per_take: 105
    beats_per_take: 7.7
    generation_words_per_min: 95.4
  target_total_words: 3600
  target_total_hours: 24
  target_words_per_hour: 150
  takes_per_slot_semantics: choice_pool

arc:
  models:
    light:
      provider: vllm
      base_url: "http://127.0.0.1:8092"
      model: "hermes3-70b"
      api_key_env: VLLM_HERMES_API_KEY
      max_tokens: 2048
      timeout_s: 900
    heavy:
      provider: vllm
      base_url: "http://127.0.0.1:8092"
      model: "hermes3-70b"
      api_key_env: VLLM_HERMES_API_KEY
      max_tokens: 2048
      timeout_s: 900
  active_model: heavy
  hours_total: 24            # -> n_segments = ceil(24/6) = 4 segments
  segment_hours: 6
  batch_size: 4              # == n_segments -> single-shot arc planning
  max_attempts: 2

segment:
  models:
    light:
      provider: vllm
      base_url: "http://127.0.0.1:8092"
      model: "hermes3-70b"
      api_key_env: VLLM_HERMES_API_KEY
      max_tokens: 2048
      timeout_s: 900
    heavy:
      provider: vllm
      base_url: "http://127.0.0.1:8092"
      model: "hermes3-70b"
      api_key_env: VLLM_HERMES_API_KEY
      max_tokens: 2048
      timeout_s: 900
  active_model: light
  target_words: 700
  target_slots: 12
  tree:
    max_leaf_slots: 5
    max_children: 3
    max_depth: 2
    min_node_words: 50
    leaf_density_floor: 0.50
  concurrency: 2             # vLLM single-model GPU — keep fan-out modest;
                              # each concurrent request shares the ~70k-token
                              # KV cache pool (see deployment logs).
  max_attempts: 3
  sensitivity_budget: 0.40
  density_floor: 0.50

dialogue:
  breaker:
    window: 30
    failure_rate: 0.5
    min_samples: 10
  models:
    light:
      provider: vllm
      base_url: "http://127.0.0.1:8092"
      model: "hermes3-70b"
      api_key_env: VLLM_HERMES_API_KEY
      temperature: 0.9
      max_tokens: 300
      timeout_s: 300
    heavy:
      provider: vllm
      base_url: "http://127.0.0.1:8092"
      model: "hermes3-70b"
      api_key_env: VLLM_HERMES_API_KEY
      temperature: 0.9
      max_tokens: 300
      timeout_s: 300
  active_model: light
  max_recent: 6
  max_words: 45
  max_beats: 8
  takes_per_slot: 1
  neutral_takes: 1
  concurrency: 2             # same single vLLM instance as arc/segment —
                              # keep modest so dialogue calls don't starve
                              # the shared ~70k-token KV cache pool.
  max_attempts: 2
  seconds_per_take: 8

state:
  flags:      [fraud-miss-flagged, regulator-audit-open, launch-imminent, spy-rumour-active]
  moods:      [tense, weary, hopeful, giddy]
  carry_keys: [fraud-miss-flagged, regulator-audit-open]
