    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set in .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-vtuber.messages}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Backs POST /logs/prune (docs/log_shipper.md) — deletes container_logs
      # rows in a caller-specified time range.
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Symbolic voice registry (roundtable_stream_design.md v1.1 §7.2) — POST
      # /replays validates that a show header's voice NAMES are known (§8.1 V1).
      VOICE_REGISTRY_PATH: /config/voices.yaml
    volumes:
      # Registry only — deliberately NO /data/voices mount. message-api must
      # validate voice names without being able to see voice files; that
      # asymmetry is the entire reason the registry exists (§7.2). Checking the
      # assets themselves is V2's job, in a container that has them (§8.2).
      - ${REPO_ROOT:-.}/config/voices.yaml:/config/voices.yaml:ro
    ports:
      - "8090:8000"
    restart: unless-stopped
    depends_on:
      - redis

  # Browser control panel over message-api's HTTP surface (docs/control_panel.md)
  # — worker on/off, log-filter toggram, message injection, log pruning, and
  # the Rerun Theater replay library, without needing curl. Talks only to
  # message-api; never touches Redis/Kafka/Postgres directly itself.
  control-panel:
    image: virtualtubers-control-panel:latest
    pull_policy: never
    environment:
      MESSAGE_API_URL: http://message-api:8000
      CONTROL_PANEL_BASIC_AUTH_USER: ${CONTROL_PANEL_BASIC_AUTH_USER:-}
      CONTROL_PANEL_BASIC_AUTH_PASS: ${CONTROL_PANEL_BASIC_AUTH_PASS:-}
    ports:
      - "8091:8000"
    restart: unless-stopped
    depends_on:
      - message-api

  # Campaign Manager Web GUI
  # Handles job tracking and model pulling for the 3-layer generator
  campaign-manager:
    build:
      context: ./services/campaign-manager
      dockerfile: Dockerfile
    pull_policy: never
    environment:
      GENERATOR_API_URL: http://host.docker.internal:8001
      # Which container's log lines belong to the generator job runner.
      GENERATOR_CONTAINER_NAME: ${GENERATOR_CONTAINER_NAME:-virtualtubers-3layer-generator-1}
      # Optional HTTP Basic Auth on the whole service (mirrors control-panel's
      # own pattern — off unless BOTH are set; /healthz is always open).
      # Phase 2 turns this service into a write surface for campaign content,
      # so set both in .env before enabling write access anywhere.
      CAMPAIGN_MANAGER_BASIC_AUTH_USER: ${CAMPAIGN_MANAGER_BASIC_AUTH_USER:-}
      CAMPAIGN_MANAGER_BASIC_AUTH_PASS: ${CAMPAIGN_MANAGER_BASIC_AUTH_PASS:-}
    ports:
      - "8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only Docker socket access so the job detail page can show the
      # generator's live log output for a job's time window. Same pattern
      # log-shipper uses; scoped to this one container's logs only, never
      # writes/starts/stops anything.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - 3layer-generator

  # Watches each worker's Twitch chat (anonymous IRC — no Twitch credentials
  # needed) and announces arriving viewers as `viewer_joined` messages via
  # message-api, so workers greet them on stream (docs/twitch_presence.md).
  # Idles with a periodic log line until TWITCH_CHANNEL_MAP is set.
  twitch-presence:
    image: virtualtubers-twitch-presence:latest
    pull_policy: never
    environment:
      # channel:worker_id pairs, e.g. "mycoderchannel:coder,mymgrchannel:manager"
      TWITCH_CHANNEL_MAP: ${TWITCH_CHANNEL_MAP:-}
      MESSAGE_API_URL: http://message-api:8000/messages
      # Seconds before the same viewer in the same channel is greeted again
      PRESENCE_COOLDOWN_S: ${PRESENCE_COOLDOWN_S:-3600}
      # Extra chat bots to ignore (extends the built-in list)
      PRESENCE_IGNORE_USERS: ${PRESENCE_IGNORE_USERS:-}
    restart: unless-stopped
    depends_on:
      - message-api

  log-shipper:
    image: virtualtubers-log-shipper:latest
    pull_policy: never
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # container_logs rows older than this are purged hourly (docs/log_shipper.md)
      RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      # Read-only Docker socket access is required to discover and follow
      # sibling containers' logs; there's no finer-grained way to scope this.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Shared world state
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Local RTMP server — workers stream here, preview in VLC
  rtmp-preview:
    image: tiangolo/nginx-rtmp
    ports:
      - "1935:1935"
      - "8088:80"
    restart: unless-stopped

  # ── Self-contained local infra for a standalone deployment. Two
  # independent opt-in profiles, mix and match per what's actually external
  # for a given deployment:
  #   COMPOSE_PROFILES=local-infra     → bundled Kafka only
  #   COMPOSE_PROFILES=local-postgres  → bundled Postgres only
  #   COMPOSE_PROFILES=local-infra,local-postgres → both (fully standalone,
  #     e.g. a side-by-side perf-test host with no dependency on another
  #     environment's shared Kafka/Postgres)
  # Without the relevant profile, that service never starts, so an
  # external-broker/external-Postgres deployment (e.g. argyle: local Kafka,
  # Postgres on mafober) only starts what it actually needs.
  # Point .env at whichever of these you enable by service name, not a host
  # IP:
  #   KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  #   POSTGRES_HOST=postgres
  # No depends_on linking the workers/services to these on purpose — adding
  # one would force these profiles on every deployment. restart: unless-stopped
  # means the workers just crash-loop briefly on first boot until Kafka/
  # Postgres finish initializing, same self-healing behavior as any
  # transient external-Kafka hiccup today.
  # Official Apache Kafka image (KRaft mode, single broker+controller — no
  # Zookeeper). bitnami/kafka was tried first but that repo currently has no
  # published tags at all ("docker.io/bitnami/kafka:3.7: not found") — this
  # is the authoritative single-node config from Kafka's own repo:
  # https://github.com/apache/kafka/blob/trunk/docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml
  # (adapted to a single `kafka:9092` listener, since every consumer here is
  # in this same Compose network and expects exactly that address — the
  # upstream example's extra host-facing listener isn't needed here, so
  # host-side Kafka tools pointed at localhost:9092 won't fully work, only
  # in-network clients will).
  # One-shot init: apache/kafka runs as uid 1000 (appuser), but Docker
  # creates a fresh named volume owned by root — chown it before Kafka
  # starts, or every boot fails formatting its own metadata directory with
  # AccessDeniedException. Runs once and exits; kafka waits for it to
  # succeed before starting (depends_on + service_completed_successfully).
  kafka-init-perms:
    image: busybox:latest
    profiles: ["local-infra"]
    command: ["chown", "-R", "1000:1000", "/tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.9.2
    profiles: ["local-infra"]
    hostname: kafka
    depends_on:
      kafka-init-perms:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["local-postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Offline 3-layer content generator (utilities/3LayersWeeklyGeneration,
  # PLAN_v3). Plans an arc, recursively segments it, and generates the dialogue
  # library — driven over HTTP so the management GUI can submit and watch jobs.
  # Job state and generated artifacts live in generator-postgres, NOT mafober.
  3layer-generator:
    image: virtualtubers-3layer-generator:latest
    pull_policy: never
    network_mode: "host"
    build:
      context: .
      dockerfile: services/3layer-generator/Dockerfile
    environment:
      # Override to utilities/3LayersWeeklyGeneration/config/generation.test.yaml
      # for fast smoke-test jobs (1 segment, tiny slot counts, light models,
      # short timeouts) instead of the full 168-hour production scope. See
      # GENERATOR_CONFIG_FILE in .env — defaults to the real config so this
      # never silently changes production behaviour.
      GENERATOR_CONFIG: /data/config/${GENERATOR_CONFIG_FILE:-generation.yaml}
      PACK_ROOT: /data/packs
      DEFAULT_PACK: ${GENERATOR_PACK:-ashiorid}
      # Consumed by generator_api.overlay_output_dir: generation.yaml ships a
      # repo-relative host path and is mounted as ro, so the value is
      # replaced in memory at startup. Without this the container writes into
      # its own image layer.
      OUTPUT_DIR: /data/output
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5455
      POSTGRES_DB: ${GENERATOR_POSTGRES_DB:-generation}
      POSTGRES_USER: ${GENERATOR_POSTGRES_USER:-generation}
      POSTGRES_PASSWORD: ${GENERATOR_POSTGRES_PASSWORD:?GENERATOR_POSTGRES_PASSWORD must be set in .env}
      # Where the `publish/{run}/upload` proxy forwards a finished episode
      # (Phase 3). Host network mode: message-api publishes 8090 to this
      # host, so loopback is correct here — override only if that mapping
      # changes.
      MESSAGE_API_URL: ${MESSAGE_API_URL:-http://127.0.0.1:8090}
    # host networking already binds 0.0.0.0:8000 for the app's own
    # LLM_BASE_URL default (127.0.0.1:11434 Ollama) — but port 8000 itself
    # collides with Portainer on this host, so run the API on 8001 instead.
    command: ["uvicorn", "generator_api:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      - generator-postgres
    volumes:
      - /home/secus/codeProjects/virtualTubers/campaigns:/data/packs:ro
      - /home/secus/codeProjects/virtualTubers/utilities/3LayersWeeklyGeneration/config:/data/config:ro
      - /home/secus/codeProjects/virtualTubers/utilities/3LayersWeeklyGeneration/output:/data/output
    restart: unless-stopped

  # Local Postgres owning ONLY the 3-layer generator's data (PLAN_v3 V15).
  # Deliberately separate from the mafober instance the rest of the stack uses:
  # generation output is a distinct dataset with a distinct backup story, a
  # GPU-hours run should not depend on the LAN, and an evolving generated
  # schema has no business on the production database. Backup mirroring to
  # mafober is a later, separate service.
  generator-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${GENERATOR_POSTGRES_DB:-generation}
      POSTGRES_USER: ${GENERATOR_POSTGRES_USER:-generation}
      POSTGRES_PASSWORD: ${GENERATOR_POSTGRES_PASSWORD:?GENERATOR_POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5455:5432"
    volumes:
      - generator-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  generator-postgres-data:
  world-state:
  repo:
  repo-native:
  repo-opencode:
  repo-aider:
  redis-data:
  kafka-data:
  postgres-data:
