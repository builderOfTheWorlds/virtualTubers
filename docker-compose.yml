  # ── The 7th channel: GM / roundtable (tuber_0) ──────────────────────────────
  # roundtable_stream_design.md v1.1 §9. The "main" stream: 7 tiles (one per
  # character slot, including the GM's own) + the show log + a status strip.
  #
  # This container is the DIRECTOR of every roundtable show — it runs the LLM
  # narration and the TTS for EVERY speaker in the cast, then cues the six
  # character channels scene-by-scene (docs/duet_replay.md). Two mounts are
  # therefore load-bearing and easy to forget:
  #   * /data/voices      — without it the GM cannot synthesize ANY speaker, so
  #                         there is no audio on ANY channel (not just this one).
  #   * /config/voices.yaml — the symbolic voice registry (§7.2), which is how a
  #                         show header's voice name resolves to a real model.
  worker-gm:
    image: vtube-worker:latest
    pull_policy: never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONFIG_PATH: /config/worker.yaml
      STREAM_RTMP_URL: ${STREAM_RTMP_URL:-rtmp://rtmp-preview:1935/live}
      STREAM_KEY: ${TUBER0_STREAM_KEY:-tuber0}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 99-104 are taken by the six character workers; the GM takes 105.
      DISPLAY_NUM: 105
      WORKER_ID: tuber_0
      LAYOUT_PRESET: ${GM_LAYOUT_PRESET:-roundtable}
      AVATAR_PROVIDER: ${GM_AVATAR_PROVIDER:-}
      # Where the director writes per-tile cue/request relay files and each tile
      # writes its own avatar state (§5.1 — tiles cannot share one state file).
      TILE_RELAY_DIR: ${TILE_RELAY_DIR:-/tmp/tiles}
      VOICE_REGISTRY_PATH: /config/voices.yaml
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set in .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-vtuber.messages}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # narration reuse cache + the shared airing followers load (app/narration_store.py)
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # With 7 slots to gather instead of 2, the default 60s ready window is
      # tighter than it looks — tune here, measured during the §8.4 rehearsal.
      REPLAY_READY_TIMEOUT_S: ${REPLAY_READY_TIMEOUT_S:-}
      REPLAY_SKIP_LLM: ${REPLAY_SKIP_LLM:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
    volumes:
      - ${REPO_ROOT:-.}/config/workers/tuber_0.yaml:/config/worker.yaml:ro
      # CRITICAL: the GM does ALL the TTS for every speaker in every show.
      - ${REPO_ROOT:-.}/voices:/data/voices:ro
      # The symbolic voice registry (§7.2) — resolves show-header voice names.
      - ${REPO_ROOT:-.}/config/voices.yaml:/config/voices.yaml:ro
      - world-state:/data/world-state
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  message-logger:
