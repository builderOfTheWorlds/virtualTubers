services:

  # ── Generic, interchangeable workers (docs/blank_workers.md) ────────────────
  # worker-1 .. worker-8: eight IDENTICAL service definitions. No persona env,
  # no per-worker stream key name, no per-worker config file — every worker
  # mounts the SAME ./config directory and the SAME /config/worker.yaml
  # (config/worker.yaml, a deliberately blank/inert default). Persona
  # (agent.role/name/system_prompt, voice, avatar) is assigned at runtime via
  # `POST /campaigns/{campaign}/start` (message-api), not from this file and
  # not from .env — a worker with no persona assigned is just disabled
  # (app/worker_control.py's existing blank==disabled convention; no new mode).
  #
  # The only things that differ between the eight blocks below are, by design:
  #   - WORKER_ID          (fixed per-container identity, NOT a persona)
  #   - DISPLAY_NUM         (Xvfb display isolation, extends the old 99+ scheme)
  #   - the *names* of the three indexed override env vars
  #     (WORKER_<N>_STREAM_KEY / WORKER_<N>_LAYOUT_PRESET / WORKER_<N>_AVATAR_PROVIDER)
  # Everything else — image, volumes, Kafka/Redis/Postgres env, ipc/shm_size,
  # restart policy, depends_on — is byte-for-byte identical (verified by
  # tests/test_docker_compose_structure.py).
  #
  # Coding-backend workspace volumes (repo/repo-native/repo-opencode/
  # repo-aider) and the tester's read-only cross-mounts are deliberately NOT
  # here — those are coder-campaign-specific infra, not generic-worker infra.
  # See docker-compose.coder.yml.

  worker-1:
    image: vtube-worker:latest
    pull_policy: never
    environment: &worker-env
      CONFIG_PATH: /config/worker.yaml
      STREAM_RTMP_URL: ${STREAM_RTMP_URL:-rtmp://rtmp-preview:1935/live}
      # Indexed per-worker stream key (docs/blank_workers.md). Unset keeps
      # this worker's stream pointed at the literal "worker-N" key on the
      # bundled rtmp-preview server.
      STREAM_KEY: ${WORKER_1_STREAM_KEY:-worker-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host-gateway:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DISPLAY_NUM: 99
      # Fixed per-container identity — the message-bus `from`/routing id and
      # the Redis worker_control/campaign_control key. NOT a persona: this
      # never changes for this container's lifetime, unlike agent.role/name/
      # system_prompt which are assigned at campaign-start time.
      WORKER_ID: worker-1
      # Every generic worker defaults to Rerun Theater mode so a freshly
      # cast persona can perform episodes immediately — set
      # WORKER_1_LAYOUT_PRESET to "coder"/"tester"/"manager" in the stack
      # env to give this worker a live editor/htop pane instead. Env-only
      # change, no rebuild.
      LAYOUT_PRESET: ${WORKER_1_LAYOUT_PRESET:-replay}
      # Swap the avatar renderer without a config edit or rebuild — e.g.
      # "ascii_avatar" (docs/avatar_providers.md). Unset keeps the resolved
      # persona's (or the base template's) avatar.provider.
      AVATAR_PROVIDER: ${WORKER_1_AVATAR_PROVIDER:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set in .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-vtuber.messages}
      # Left empty for local-commits-only mode until a git server exists;
      # only matters once this worker is cast into a coding-backend role
      # (CODING_BACKEND set — see docker-compose.coder.yml).
      GIT_SERVER_URL: ${GIT_SERVER_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # narration reuse cache (app/narration_store.py)
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # duet replay (docs/duet_replay.md) — how long a duet director waits
      # for its cast to ready-up before refusing the airing. Unset/empty
      # keeps the code default (60s).
      REPLAY_READY_TIMEOUT_S: ${REPLAY_READY_TIMEOUT_S:-}
      # testing-only: skip the LLM narration call on a fresh replay airing
      # (app/replay.py prepare_voiced_show) so this worker's fallback,
      # template-only narration is used instead. Unset/empty performs
      # normally. Never affects this worker's real coding-task LLM use.
      REPLAY_SKIP_LLM: ${REPLAY_SKIP_LLM:-}
      # testing-only: override voice.provider (docs/tts_client.md). Set to
      # "fake" to skip real TTS synthesis (no piper subprocess/model load)
      # while still returning a real, duet-safe client with a proportional
      # silent-WAV duration. Unset/empty keeps this worker's configured
      # provider (piper).
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      # Point Piper synthesis at a remote piper.http_server instead of
      # running it in this container (docs/tts_client.md) — e.g. once TTS
      # moves onto a separate, more powerful machine. Unset/empty
      # synthesizes locally (single resident model per worker process).
      TTS_BASE_URL: ${TTS_BASE_URL:-}
    volumes: &worker-volumes
      # Whole config directory, read-only (docs/blank_workers.md) — replaces
      # the old one-file-per-worker bind mount. This worker resolves its own
      # persona from config/campaigns/<campaign>/personas.yaml at runtime;
      # message-api never reads persona files, it only stores
      # {campaign, speaker} in Redis (app/campaign_control.py).
      - ./config:/config:ro
      - world-state:/data/world-state
      # "Rerun Theater" episode library (docs/replay_pane.md) — parsed,
      # redacted session scripts synced onto the host; :ro because replays
      # only ever read them.
      - ./replays:/data/replays:ro
      # Piper .onnx voice models for spoken replay narration
      # (docs/tts_client.md; download with scripts/download_voices.py)
      - ./voices:/data/voices:ro
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-2:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_2_STREAM_KEY:-worker-2}
      DISPLAY_NUM: 100
      WORKER_ID: worker-2
      LAYOUT_PRESET: ${WORKER_2_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_2_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-3:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_3_STREAM_KEY:-worker-3}
      DISPLAY_NUM: 101
      WORKER_ID: worker-3
      LAYOUT_PRESET: ${WORKER_3_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_3_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-4:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_4_STREAM_KEY:-worker-4}
      DISPLAY_NUM: 102
      WORKER_ID: worker-4
      LAYOUT_PRESET: ${WORKER_4_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_4_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-5:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_5_STREAM_KEY:-worker-5}
      DISPLAY_NUM: 103
      WORKER_ID: worker-5
      LAYOUT_PRESET: ${WORKER_5_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_5_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-6:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_6_STREAM_KEY:-worker-6}
      DISPLAY_NUM: 104
      WORKER_ID: worker-6
      LAYOUT_PRESET: ${WORKER_6_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_6_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-7:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_7_STREAM_KEY:-worker-7}
      DISPLAY_NUM: 105
      WORKER_ID: worker-7
      LAYOUT_PRESET: ${WORKER_7_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_7_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  worker-8:
    image: vtube-worker:latest
    pull_policy: never
    environment:
      <<: *worker-env
      STREAM_KEY: ${WORKER_8_STREAM_KEY:-worker-8}
      DISPLAY_NUM: 106
      WORKER_ID: worker-8
      LAYOUT_PRESET: ${WORKER_8_LAYOUT_PRESET:-replay}
      AVATAR_PROVIDER: ${WORKER_8_AVATAR_PROVIDER:-}
    volumes: *worker-volumes
    ipc: host
    shm_size: 256mb
    restart: unless-stopped
    depends_on:
      - rtmp-preview
      - redis

  message-logger:
    image: virtualtubers-message-logger:latest
    pull_policy: never
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set in .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-vtuber.messages}
      KAFKA_GROUP_ID: vtuber-logger
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped
    depends_on:
      - redis

  message-api:
    image: virtualtubers-message-api:latest
    pull_policy: never
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS must be set in .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-vtuber.messages}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Backs POST /logs/prune (docs/log_shipper.md) — deletes container_logs
      # rows in a caller-specified time range.
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "8090:8000"
    restart: unless-stopped
    depends_on:
      - redis

  # Watches each worker's Twitch chat (anonymous IRC — no Twitch credentials
  # needed) and announces arriving viewers as `viewer_joined` messages via
  # message-api, so workers greet them on stream (docs/twitch_presence.md).
  # Idles with a periodic log line until TWITCH_CHANNEL_MAP is set.
  twitch-presence:
    image: virtualtubers-twitch-presence:latest
    pull_policy: never
    environment:
      # channel:worker_id pairs, e.g. "mychannel:worker-1,mychannel2:worker-2"
      TWITCH_CHANNEL_MAP: ${TWITCH_CHANNEL_MAP:-}
      MESSAGE_API_URL: http://message-api:8000/messages
      # Seconds before the same viewer in the same channel is greeted again
      PRESENCE_COOLDOWN_S: ${PRESENCE_COOLDOWN_S:-3600}
      # Extra chat bots to ignore (extends the built-in list)
      PRESENCE_IGNORE_USERS: ${PRESENCE_IGNORE_USERS:-}
    restart: unless-stopped
    depends_on:
      - message-api

  log-shipper:
    image: virtualtubers-log-shipper:latest
    pull_policy: never
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # container_logs rows older than this are purged hourly (docs/log_shipper.md)
      RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      # Read-only Docker socket access is required to discover and follow
      # sibling containers' logs; there's no finer-grained way to scope this.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Shared world state
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # Local RTMP server — workers stream here, preview in VLC
  rtmp-preview:
    image: tiangolo/nginx-rtmp
    ports:
      - "1935:1935"
      - "8088:80"
    restart: unless-stopped

  # ── Self-contained local infra for a standalone deployment (e.g. a
  # side-by-side perf-test host with no dependency on another environment's
  # shared Kafka/Postgres). Opt-in only: set COMPOSE_PROFILES=local-infra in
  # .env to start these; without it they never start, so an external-broker
  # deployment (e.g. pointing at Kafka/Postgres on the deploy host itself,
  # as the d2000 stack does) is unaffected.
  # Point .env at these by service name, not a host IP:
  #   KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  #   POSTGRES_HOST=postgres
  # No depends_on linking the workers/services to these on purpose — adding
  # one would force this profile on every deployment. restart: unless-stopped
  # means the workers just crash-loop briefly on first boot until Kafka/
  # Postgres finish initializing, same self-healing behavior as any
  # transient external-Kafka hiccup today.
  # Official Apache Kafka image (KRaft mode, single broker+controller — no
  # Zookeeper). bitnami/kafka was tried first but that repo currently has no
  # published tags at all ("docker.io/bitnami/kafka:3.7: not found") — this
  # is the authoritative single-node config from Kafka's own repo:
  # https://github.com/apache/kafka/blob/trunk/docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml
  # (adapted to a single `kafka:9092` listener, since every consumer here is
  # in this same Compose network and expects exactly that address — the
  # upstream example's extra host-facing listener isn't needed here, so
  # host-side Kafka tools pointed at localhost:9092 won't fully work, only
  # in-network clients will).
  # One-shot init: apache/kafka runs as uid 1000 (appuser), but Docker
  # creates a fresh named volume owned by root — chown it before Kafka
  # starts, or every boot fails formatting its own metadata directory with
  # AccessDeniedException. Runs once and exits; kafka waits for it to
  # succeed before starting (depends_on + service_completed_successfully).
  kafka-init-perms:
    image: busybox:latest
    profiles: ["local-infra"]
    command: ["chown", "-R", "1000:1000", "/tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.9.2
    profiles: ["local-infra"]
    hostname: kafka
    depends_on:
      kafka-init-perms:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["local-infra"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtualtubers}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtubers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  world-state:
  # Coder-campaign-only workspaces (docker-compose.coder.yml). Declared here
  # (not in the overlay) because Compose requires every volume an overlay
  # file references to exist in the merged top-level `volumes:` section, and
  # keeping them alongside the other named volumes avoids a second
  # `volumes:` block that would itself need merging.
  repo:
  repo-native:
  repo-opencode:
  repo-aider:
  redis-data:
  kafka-data:
  postgres-data:
