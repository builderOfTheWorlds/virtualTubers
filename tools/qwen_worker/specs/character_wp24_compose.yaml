task_id: character_wp24_compose

goal: |
  Add the `character-live` service to the root `docker-compose.yml` (playbook
  WP-24; plan §8 "It is a separate container, character-live", D-19). It runs
  the live driver in the foreground for one loop week and exits 0 when
  story-stop disables `char-live:<campaign>` or the week ends:

      docker compose up -d character-live          (what `main.py story-start` runs)

  It is NOT restarted on a clean exit: a finished story must stay finished
  until the next story-start. So `restart: "no"`, profile `live` (plain `up -d`
  of the stack never starts it).

  THE FAILURE THAT MUST NEVER HAPPEN: the edit breaks the other services in
  docker-compose.yml. The harness emits WHOLE files, so every existing line
  must come back byte-for-byte, with the new block added and nothing else.

  !! PLANNER WARNING (tracker questions Q7 and P3b-Q4): this spec has the same
  problem as character_wp06_compose.yaml. docker-compose.yml is ~50 KB, over
  the playbook §2.2 prompt budget as context plus a whole-file reply, and the
  sandbox does not copy the root compose files. Recommendation: add the block
  below BY HAND (config, like config/character.yaml), after the user answers
  Q7. Second problem (P3b-Q4): the character-updater image (WP-06 Dockerfile)
  copies only app/character, but the driver imports app/campaign, app/office,
  replay, emotion, agent_state, audio_envelope, agent_metrics, message_bus,
  worker_control and llm_client, plus the pack under campaigns/. The block
  below therefore assumes a second Dockerfile,
  services/character-updater/Dockerfile.live (a new file: a file-location
  decision, so it waits for the user's answer).

target_files:
  - docker-compose.yml
  - services/character-updater/Dockerfile.live

test_files:
  - tests/test_office_configs.py          # parses docker-compose.yml; must stay green

context_files:
  - docker-compose.yml
  - services/character-updater/Dockerfile # WP-06 image, the style to copy

interface: |
  ── services/character-updater/Dockerfile.live ── (only if P3b-Q4 = new file)
      FROM python:3.12-slim
      ENV PYTHONUNBUFFERED=1
      WORKDIR /app
      COPY services/character-updater/requirements.txt /app/requirements.txt
      RUN pip install --no-cache-dir -r /app/requirements.txt redis
      COPY app /app                       # the driver needs campaign/, office/ and the shared modules
      COPY campaigns /campaigns
      COPY config/character.yaml /config/character.yaml
      COPY services/character-updater/main.py /app/main.py
      ENTRYPOINT ["python3", "/app/main.py"]
      CMD ["story-start", "--foreground"]
    No secret baked in; config.pack must resolve to /campaigns/ashiorid_office in
    the container (a volume or CHARACTER_PACK-style override: part of P3b-Q4).

  ── docker-compose.yml: add after the character-jobs block ──
    # Character v4 live driver (plan §8, D-19): plays the campaign with memory for
    # one loop week. Started by `main.py story-start`, stopped by story-stop
    # (WorkerControl char-live:<campaign>) or the week's end. Exit 0 = done.
    character-live:
      build:
        context: .
        dockerfile: services/character-updater/Dockerfile.live
      image: virtualtubers-character-live:latest
      profiles: ["live"]
      restart: "no"
      command: ["story-start", "--foreground"]
      environment:
        CHARACTER_DB_HOST: ${CHARACTER_DB_HOST:-192.168.1.120}
        CHARACTER_DB_PORT: ${CHARACTER_DB_PORT:-5433}
        CHARACTER_DB_NAME: ${CHARACTER_DB_NAME:-character_profile}
        CHARACTER_DB_USER: ${CHARACTER_DB_USER:-character_profile}
        CHARACTER_DB_PASSWORD: ${CHARACTER_DB_PASSWORD:-}
        KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
        KAFKA_TOPIC: ${KAFKA_TOPIC:-vtuber.messages}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      volumes:
        - ${REPO_ROOT:-.}/config/character.yaml:/config/character.yaml:ro
        - ${REPO_ROOT:-.}/campaigns:/campaigns:ro

notes: |
  - Change NOTHING else in docker-compose.yml: no reordering, re-indenting,
    comment edits or quoting changes.
  - Never put a secret value in either file; only ${VAR:-} references.
  - No ports, no healthcheck; `depends_on` only if the stack already declares
    redis/kafka services under those names (check the file; do not invent).
  - Gate: `docker compose config` is valid and tests/test_office_configs.py
    passes.
