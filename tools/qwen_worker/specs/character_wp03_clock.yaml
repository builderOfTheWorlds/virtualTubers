task_id: character_wp03_clock

goal: |
  Write `app/character/clock.py`, the loop clock of the character v4 memory
  loop (plan §2, decisions D-01 and D-24), and refresh the docstring of
  `app/character/__init__.py`.

  A campaign runs as a weekly time loop. Week N starts at 00:00
  America/New_York on `epoch + 7*(N-1)` days, where `loop.epoch` is a Sunday
  in config (for the office campaign, OB-41: 2026-09-27, the same Sunday the
  office weekly reset uses). `loop_day` is the New York calendar date.
  clock.py is THE ONLY code that turns a timestamp into a week or a day:
  ingest stamps every experience row with it, the nightly job asks it for
  "yesterday", the weekly reset asks it for the bounds of the next week.

  THE FAILURE THAT MUST NEVER HAPPEN: a timestamp is bucketed by its UTC date
  or by 24-hour arithmetic instead of the New York wall clock. Every bus
  message carries a UTC timestamp; 02:00Z on a Sunday is still 22:00 Saturday
  in New York, and a week containing a DST change is 169 or 167 real hours,
  not 168. Getting either wrong files a character's Saturday-night memories
  into the wrong week, and the weekly reset then archives them a week early.
  Always convert with `ts.astimezone(ZoneInfo(tz))` and build bounds with
  `datetime.combine(day, time(0), tzinfo=zone)` — never add timedelta(hours=...)
  to an aware datetime to find a boundary.

  A naive datetime has no defined New York time, so it raises ValueError
  rather than being guessed.

target_files:
  - app/character/clock.py
  - app/character/__init__.py

test_files:
  - tests/character/test_character_clock.py

context_files:
  - app/character/__init__.py      # the CURRENT file: keep every export exactly
  - app/office/clock.py            # the office clock on the same epoch; same tz handling

interface: |
  ── app/character/clock.py ──

  class LoopClock:
      def __init__(self, epoch: date, tz: str)
          epoch must be a datetime.date (not a datetime) and a Sunday
          (weekday() == 6), else ValueError. tz is an IANA name resolved with
          zoneinfo.ZoneInfo (unknown name -> ValueError). Keep .epoch and .tz
          (the name) as attributes and the ZoneInfo as .zone.

      def position(self, ts: datetime) -> tuple[int, date]
          (week, day): day = ts.astimezone(zone).date();
          week = (day - epoch).days // 7 + 1. A timestamp before the epoch
          gives week 0 or a negative week (ingest counts and skips those);
          it does not raise.

      def week_bounds(self, week: int) -> tuple[datetime, datetime]
          start = datetime.combine(epoch + timedelta(days=7*(week-1)), time(0), tzinfo=zone)
          end   = datetime.combine(epoch + timedelta(days=7*week),     time(0), tzinfo=zone)
          Both tz-aware. end of week N == start of week N+1.

      def day_bounds(self, day: date) -> tuple[datetime, datetime]
          New York midnight of `day` and of the next day (a DST day is 23 or 25 h).

      def previous_day(self, now: datetime) -> date
          The New York calendar date before now's New York date. At 00:00:30
          New York on a Sunday it is that Saturday. This is what the nightly
          job summarises.

      def is_week_start(self, now: datetime) -> bool
          True when now's New York date is a Sunday (the first day of a loop
          week), else False.

      Every method taking a datetime raises ValueError when
      `ts.tzinfo is None or ts.utcoffset() is None` (naive).

  This is the validated reference (.claude/prompts/character_v4_plan_validation.py:73-83)
  that the class wraps:

      def week_bounds(week, epoch, tz=NY):
          start_day = epoch + timedelta(days=7 * (week - 1))
          start = datetime.combine(start_day, time(0), tzinfo=tz)
          end = datetime.combine(start_day + timedelta(days=7), time(0), tzinfo=tz)
          return start, end

      def loop_position(ts, epoch, tz=NY):
          local = ts.astimezone(tz)
          day = local.date()
          return (day - epoch).days // 7 + 1, day

