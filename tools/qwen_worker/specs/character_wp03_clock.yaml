notes: |
  - Imports in clock.py: stdlib only (datetime, logging, zoneinfo).
  - `log = logging.getLogger(__name__)`. DEBUG in __init__ (epoch, tz) and when
    raising; no logging in position() beyond DEBUG (it is called per ingested
    message, so keep it cheap).
  - ZoneInfo needs the IANA database; `tzdata` is already in requirements.txt
    (OB-06), so no fallback code.
  - Compare/convert only aware datetimes. Never call datetime.now() in this
    module: callers pass `now` (jobs take `--at`).
  - app/character/__init__.py: emit the whole file; it is short. Do not rename,
    reorder or drop any avatar name.
  - Pending guard: tests/character/test_character_clock.py skips while
    app/character/clock.py is missing (tests/character/pending.py). The
