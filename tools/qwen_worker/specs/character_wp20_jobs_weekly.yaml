task_id: character_wp20_jobs_weekly

goal: |
  Write the `weekly-reset` job, `app/character/jobs_weekly.py`, and register it
  in `services/character-updater/main.py` (plan §5 job table, D-02, D-08, D-09).

      python services/character-updater/main.py weekly-reset [--at ISO] [--force] [--dry-run]
      (cron, Sunday 00:02 NY, after daily-maintenance)

  Plan §5, idempotency key loop_weeks(campaign, week).reset_steps, for the week W
  that just ended:
    1. close_saturday   make sure Saturday's summaries exist (runs step 1 of
                        daily-maintenance if not)
    2. select_fragments fragments for the retains_fragments characters
    3. archive          set archived_at_week = W on week-W nodes and edges, for
                        every character, in one transaction
    4. open_next        insert week W+1, status open
    5. refresh          publish character_refresh (reset.refresh_mode: push | none)
  "Each step runs under SELECT … FOR UPDATE on the week row and records
  {completed_at}. A re-run skips completed steps (validated)." Characters never
  know they are in a loop: after the reset the week-W knowledge is unreachable,
  and the live driver (WP-24) drops its caches on character_refresh.

  THE FAILURE THAT MUST NEVER HAPPEN: a half-done reset that a re-run cannot
  finish, or finishes twice. Every step goes through store.weeks.run_step, which
  records the step in the same transaction as the step's own writes; a crash in
  step 3 leaves steps 1-2 recorded, and the next run skips them and finishes.
  Running before the week has ended must do nothing (exit 2), unless --force;
  --dry-run writes nothing and publishes nothing.

target_files:
  - app/character/jobs_weekly.py
  - services/character-updater/main.py

