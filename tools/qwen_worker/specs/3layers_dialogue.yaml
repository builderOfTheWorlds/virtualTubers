task_id: 3layers_dialogue

goal: |
  Implement Layer 3 of the 3-layer offline content generator: the pass that
  turns a segment's planned slots into actual voiced takes on disk.

  THIS MODULE OWNS ALMOST NO LOGIC. `worklist` already decides what to
  generate and under which conditions, `pool` already runs the workers with a
  circuit breaker and a single writer thread, and
  `app/campaign/batch_generate` already writes the take files and the
  manifest. Your job is the wiring plus one small take function. Every time
  you are tempted to reimplement something here, it already exists in one of
  those three modules — import it.

  THREE THINGS ARE EASY TO GET WRONG AND EXPENSIVE TO GET WRONG.

  1. THE TAKE FUNCTION MUST BE LOCAL, NOT `batch_generate._generate_take`.
     That function calls
     `improviser.update_context(scene=scene, loop=take, carry={})` — it
     overwrites `loop` with the TAKE NUMBER and blanks `carry`
     UNCONDITIONALLY. `carry` is the only channel through which the arc's
     state reaches the model. Reusing it would produce conditioned takes with
     no conditions at all, byte-similar to their neutral siblings, with
     nothing in any log to say why the library has no variety.

  2. `loop` COMES FROM THE BRIEF. It is the campaign's time-loop iteration —
     which repetition of the loop the story is on — not a counter of takes.

  3. THE NEUTRAL-TAKE GUARD IS HARD. Every ambient slot must end with exactly
     one take whose `conditions` is `{}`. A slot with only conditioned takes
     can dead-air at runtime when none of its conditions match, which is the
     single failure the whole `neutral_takes` design exists to prevent. It
     RAISES. It does not warn.

target_files:
  - utilities/3LayersWeeklyGeneration/src/generate_segment_dialogue.py

test_files:
  - utilities/3LayersWeeklyGeneration/tests/test_generate_segment_dialogue.py

context_files:
  - utilities/3LayersWeeklyGeneration/src/worklist.py
  - utilities/3LayersWeeklyGeneration/src/pool.py
  - app/campaign/batch_generate.py

interface: |
  utilities/3LayersWeeklyGeneration/src/generate_segment_dialogue.py must
  export exactly these names.

  The module must `import pool` AS A MODULE (`import pool`, then call
  `pool.run_pool(...)`), never `from pool import run_pool`. The tests
  monkeypatch `gsd.pool.run_pool`, and a name bound at import time cannot be
  patched.

  ------------------------------------------------------------------
  class NeutralTakeError(RuntimeError)
  ------------------------------------------------------------------
      Raised by the coverage guard. A distinct type so the API dispatcher can
      report it as a failed job with a readable reason rather than a generic
      crash.

  ------------------------------------------------------------------
  def generate_take(improviser, unit, config) -> list
  ------------------------------------------------------------------
      Produce ONE take for ONE WorkUnit. Returns a list of beat dicts; an
      empty list is a failed attempt. NEVER RAISES — catch every exception,
      log at ERROR, and return []. The pool treats both an empty list and an
      exception as a failure, but returning [] keeps the failure accounting in
      one place.

      Implement exactly this shape:

          scene = Scene(id=unit.slot_id,
                        prompt=unit.slot["prompt"],
                        lore=unit.slot.get("lore", []))
          improviser.recent = []
          improviser.update_context(scene=scene,
                                    loop=unit.slot.get("loop", 1),
                                    carry=unit.conditions)
          beats = improviser.generate_scene(scene)
          return [batch_generate._beat_to_dict(b) for b in beats]

      `Scene` comes from `campaign.pack`. Reuse
      `batch_generate._beat_to_dict`; do not write your own.

      RESETTING `improviser.recent` IS NOT OPTIONAL. Two takes of the same
      slot are ALTERNATES of each other, not a conversation. A worker thread
      keeps its improviser for the life of the run, so without the reset take
      2 reads as a reply to take 1 and the whole point of alternates is lost.

      NO RETRY LOOP HERE. Retries are `pool.run_pool`'s job via
      `max_attempts`. An inner loop would multiply the two together.

  ------------------------------------------------------------------
  def assert_neutral_take_coverage(segment_root, slot_ids) -> None
  ------------------------------------------------------------------
      For each slot id, read every take file under
      `worklist.take_path(segment_root, slot_id, n)` and confirm at least one
      has `conditions == {}` (an empty mapping, or a missing/None key — all
      three mean "unconditioned").

      Collect EVERY offending slot id, then raise ONE `NeutralTakeError`
      naming all of them. An operator fixing these wants the whole list, not
      one slot per run. A slot with no take files at all is an offender too.

      Discover the take files by globbing the slot's directory rather than
      counting up from 1 — a skipped leaf leaves gaps.

  ------------------------------------------------------------------
  def generate_segment_dialogue(pack, segment_ids, config, llm, out_root,
                                *, progress=None, cancel_check=None)
  ------------------------------------------------------------------
      The entry point. Returns an aggregate stats object or dict; must not
      return None on a successful run.

      For each segment id IN ORDER:

        1. Load `<out_root>/segments/<segment_id>/brief.yaml`.
        2. `units = worklist.build_worklist(out_root, [segment_id], config)`.
           THIS IS THE RESUME — re-running the scan is what makes the run
           resumable (design decision D8). Do NOT write your own
           "next unused take number" scan; that is precisely the racy call D8
           removed.
        3. Log the estimate from `worklist.estimate_seconds(units,
           config["dialogue"]["seconds_per_take"],
           config["dialogue"]["concurrency"])`.
        4. Call `pool.run_pool(...)` with:
             worker_factory = lambda: LLMImproviser(pack, llm)   ONE PER
                              WORKER THREAD — never one shared instance; it
                              holds mutable scene/carry/loop/recent state and
                              sharing it splices one slot's transcript into
                              another's prompt.
             generate       = lambda worker, unit: generate_take(worker, unit,
                                                                 config)
             writer         = a closure calling
                              `batch_generate._write_take(...)` and
                              `batch_generate._append_manifest(...)`
             concurrency    = config["dialogue"]["concurrency"]
             max_attempts   = config["dialogue"]["max_attempts"]
             breaker        = pool.CircuitBreaker(**config["dialogue"]["breaker"])
             cancel_check   = the cancel_check argument, passed straight
                              through
        5. Call `progress(done, total, segment_id)` after each segment when
           `progress` is not None, where `done` counts segments finished so
           far and `total` is `len(segment_ids)`.
        6. Run `assert_neutral_take_coverage` for that segment's ambient slot
           ids.

      SPINE SLOTS ARE NEVER GENERATED. `kind: spine` is authored canon and a
      spine slot reaching the pool would overwrite it with improvised
      dialogue. `worklist.units_for_segment` should already exclude them —
      confirm that rather than assuming, and never add spine slots yourself.

      DO NOT BUILD AN LLM CLIENT. The caller passes `llm` already constructed
      and shared; this module must never call `concurrent_llm.from_profile`.
      One shared client with per-thread improvisers is the contract.

      `cancel_check` is forwarded to the pool UNCHANGED — the pool owns the
      polling policy and its own poller thread. Do not poll it here.

notes: |
  - Module-level `log = logging.getLogger(__name__)`.
  - Follow the project logging conventions in CLAUDE.md: DEBUG on entry and at
    decision points, INFO for the per-segment estimate and the final report,
    ERROR inside every handler.
  - Builtin generics only in annotations. Do NOT import from `typing`.
  - `encoding="utf-8"` on every file open.
  - Import `pool` and `worklist` as MODULES (`import pool`), not as names.
  - `batch_generate` lives in the campaign PACKAGE, so it is
    `from campaign import batch_generate` — a bare `import batch_generate`
    raises ModuleNotFoundError, because only `app/` and the utility's `src/`
    are on the path, not `app/campaign/`. Reach its helpers as
    `batch_generate._write_take(...)` etc.
  - `from campaign.pack import Scene` and
    `from campaign.improviser import LLMImproviser`.
  - The final report logs takes written, failures, and per-segment counts.
  - Do NOT implement the stinger pass. It depends on `events.yaml`, which does
    not exist yet. Do not leave a stub that silently does nothing either.
  - Do NOT write `except (SomeError, Exception)`: the second member makes the
    first meaningless.
  - Do NOT reimplement `worklist.conditions_for`, `worklist.take_path`,
    `_write_take`, `_append_manifest` or `_beat_to_dict`.
