task_id: 3layers_plan_segment

goal: |
  Rewrite the Layer 2 ORCHESTRATOR so it drives a recursive tree instead of a
  flat 2a/2b pass. This module owns the startup interlock, resume, the
  concurrent drain, retry/degrade, the checkpoints, and writing `brief.yaml`.
  Everything pure — parsing, validation, prompt text, the brief merge — is
  imported from `segment_schema` and NOTHING pure is reimplemented here.

  WHAT CHANGED. The old version made one call for nine chapters, then one call
  per chapter for its slots: a fixed two-level shape. The new version starts
  from a single root node holding the whole segment's word budget and
  repeatedly asks "is this small enough to plan directly?" — planning it into
  slots if so, and splitting it into weighted children if not. The tree is as
  deep as the content needs and no deeper.

  FOUR PROPERTIES ARE LOAD-BEARING.

  1. THE TREE ALWAYS TERMINATES, AND NEVER BY DROPPING A NODE. Hitting
     `max_depth`, or exhausting the retries on an expand call, forces a LEAF —
     oversized, flagged `forced: True`, and planned anyway. A dropped node is a
     hole in the airtime that nothing downstream can detect; a forced leaf is
     merely a large call. Degrade, never drop.

  2. ONE BAD LEAF MUST NOT COST THE SEGMENT. A segment is six hours. A leaf
     that exhausts its attempts is logged at ERROR, left with empty slots, and
     every other node is still written. This is the ONLY remaining skip path.

  3. THE DRAIN IS CONTINUOUS, NOT LEVEL-BATCHED. A branch task discovers new
     children while other tasks are still running, so the executor must accept
     new work after the first wave. A single `with executor:` block over one
     initial list would never see the second level.

  4. RESUME IS NODE-GRANULAR. A leaf call is about a minute of a 70B model.
     Re-running a whole segment because the process died on the eighth leaf
     throws away eight minutes of GPU, and across 28 segments that is the
     difference between finishing overnight and not.

target_files:
  - utilities/3LayersWeeklyGeneration/src/plan_segment.py

test_files:
  - utilities/3LayersWeeklyGeneration/tests/test_plan_segment.py

context_files:
  - utilities/3LayersWeeklyGeneration/src/segment_schema.py
  - utilities/3LayersWeeklyGeneration/src/plan_arc.py
  - utilities/3LayersWeeklyGeneration/src/worklist.py

interface: |
  utilities/3LayersWeeklyGeneration/src/plan_segment.py exports ONE public
  function.

      def plan_segment(pack, arc_segment, config, llm, vocab, out_path,
                       *, progress=None, cancel_check=None) -> dict | None

  The first six parameters are unchanged from today — no caller or fixture
  grows an argument. The two new ones are keyword-only and default to None, so
  every existing call site keeps working.

      `progress(done, total, node)`  called after each node completes, branch
                                     or leaf. `total` GROWS as branching
                                     resolves — it is not known up front.
      `cancel_check() -> bool`       polled in the dispatch loop BETWEEN node
                                     submissions. See CANCELLATION below.

  Import from segment_schema exactly these names — they are the post-rewrite
  set, and the old chapter-era names no longer exist:

      SYSTEM_PROMPT_EXPAND, SYSTEM_PROMPT_LEAF, SegmentPlanError,
      validate_tree_config, derive_target_slots, leaf_eligible,
      distribute_words, parse_children, parse_slots, validate_children,
      validate_slots, check_sensitivity_budget, build_expand_prompt,
      build_leaf_prompt, merge_brief

  ------------------------------------------------------------------
  1. STARTUP — the knob interlock
  ------------------------------------------------------------------
      FIRST statement of the function, before any file read and before any
      model call:

          problems = validate_tree_config(config)
          if problems:
              raise SegmentPlanError(...)      # include the problem strings

      This is operator error, not model error. It must fail loudly and
      immediately rather than degrade into one giant forced leaf per segment
      after burning a GPU-hour discovering it. The test asserts that a run
      with an infeasible config makes ZERO model calls.

  ------------------------------------------------------------------
  2. RESUME — the tree checkpoint
  ------------------------------------------------------------------
      The checkpoint path is DERIVED, not a new argument:

          checkpoint = out_path.with_name("tree.yaml")

      If it exists, load it as the tree (a dict of `node_id -> node record`).
      A YAML error must raise SegmentPlanError — silently replanning over a
      corrupt checkpoint throws away everything it contained.

      If it does not exist, seed the tree with the ROOT node:

          node_id      = arc_segment["id"]     # note: "id", not "segment_id"
          parent_id    = None
          order        = 0
          depth        = 0
          title        = arc_segment.get("synopsis", "")[:80] or the id
          summary      = arc_segment["synopsis"]
          continuity_in / continuity_out from arc_segment
          target_words = config["segment"]["target_words"]
          target_slots = derive_target_slots(target_words, config)
          kind = None, forced = False, children = [], slots = None

      A node is UNRESOLVED when `kind is None`. Resume re-plans exactly the
      unresolved nodes and nothing else. A tree in which every node is
      resolved makes zero model calls.

  ------------------------------------------------------------------
  3. THE DRAIN — one executor, continuous submission
  ------------------------------------------------------------------
      Use ONE `concurrent.futures.ThreadPoolExecutor(
      max_workers=config["segment"]["concurrency"])` for the whole run.

      Seed it with every unresolved node. Then loop while work is pending:
      as each future completes, act on its result and submit any newly
      discovered work IMMEDIATELY — do not wait for a level to finish.

      Structure it roughly as:

          pending = {executor.submit(handle, nid): nid for nid in unresolved}
          while pending:
              done, _ = concurrent.futures.wait(
                  pending, return_when=concurrent.futures.FIRST_COMPLETED)
              for future in done:
                  nid = pending.pop(future)
                  ... apply the result to the tree, checkpoint, progress ...
                  for new_nid in newly_created_children:
                      pending[executor.submit(handle, new_nid)] = new_nid

      DO NOT write `with ThreadPoolExecutor(...) as ex: ex.map(...)` over a
      single list. A branch task creates children that must themselves be
      submitted; a one-shot map never sees them and the run silently stops at
      depth one.

      CLASSIFY each node when its turn comes, in this order:

        a. `node["depth"] >= max_depth`  -> FORCED LEAF.
           Log at WARNING, set `forced = True`, and plan it as a leaf for its
           full `target_slots`.
        b. `leaf_eligible(node["target_slots"], config)` -> LEAF.
        c. otherwise -> BRANCH.

      Apply every mutation to the shared tree dict under ONE
      `threading.Lock`. Several worker threads finish at once and each
      rewrites the checkpoint; unguarded dict mutation plus a concurrent
      `yaml.safe_dump` of the same dict is a corrupt file.

  ------------------------------------------------------------------
  4. THE BRANCH TASK
  ------------------------------------------------------------------
      For attempt in 1..`config["segment"]["max_attempts"]`:

          prompt   = build_expand_prompt(pack, arc_segment, ancestors, node,
                                         config, problems)
          reply    = llm.complete(SYSTEM_PROMPT_EXPAND, [{"role": "user",
                                                          "content": prompt}])
          children = parse_children(reply)
          problems = validate_children(children, node, config)
          if not problems:
              children = distribute_words(children, node, config)
              break

      A `parse_children` raise or any exception from `llm.complete` is a
      FAILED ATTEMPT, not a crash: catch it, record it as the problem for the
      next attempt, and continue the loop.

      ON SUCCESS: create one child node per entry, with
      `node_id = f"{parent_id}-n{order}"`, `depth = parent.depth + 1`, and the
      `target_words` / `target_slots` that `distribute_words` computed. Set the
      parent's `kind = "branch"` and `children = [child ids in order]`. Return
      the new ids so the drain submits them.

      ON EXHAUSTION: log at WARNING, set `forced = True`, and RECLASSIFY this
      node as a leaf — run the leaf task on it for its full `target_slots`.
      Do not leave it unresolved and do not drop it.

      `ancestors` is the chain from the root to this node's parent,
      ROOT-EXCLUSIVE, ordered shallow -> deep. It is empty for a node at
      depth 1. Walk `parent_id` up and reverse.

  ------------------------------------------------------------------
  5. THE LEAF TASK
  ------------------------------------------------------------------
      Same retry shape, with `build_leaf_prompt`, `SYSTEM_PROMPT_LEAF`,
      `parse_slots`, and `validate_slots(slots, pack, vocab, config, node=node)`
      — pass the node so the per-leaf density check runs.

      ON SUCCESS: prefix every slot id with the node id —
      `slot["slot_id"] = f"{node_id}-{slot['slot_id']}"` — then set
      `node["slots"] = slots` and `node["kind"] = "leaf"`.

      The prefix is what makes slot ids unique across a segment. Two leaves
      both returning `s-001` would otherwise collide on disk at
      `worklist.take_path`, and the second silently overwrites the first.

      ON EXHAUSTION: log at ERROR, set `node["slots"] = []` and
      `node["kind"] = "leaf"`. Do NOT raise. This is property 2 in the goal.

  ------------------------------------------------------------------
  6. CHECKPOINT AFTER EVERY COMPLETED NODE
  ------------------------------------------------------------------
      After each node resolves, while holding the lock:
        - write the whole tree to `tree.yaml`
        - rebuild the brief with `merge_brief(arc_segment, tree, config)` and
          write it to `out_path`
        - call `progress(done, total, node)` when `progress` is not None.
          THE THIRD ARGUMENT IS THE SINGLE NODE RECORD THAT JUST COMPLETED —
          the dict with `node_id`, `depth`, `kind` and the rest. It is NOT the
          whole tree and NOT a node id string; the API dispatcher reads
          `node["node_id"]` off it to fill the job's progress document.
          `done` is the number of resolved nodes; `total` is the number of
          nodes currently in the tree

      Create `out_path.parent` with `mkdir(parents=True, exist_ok=True)`.
      Write with `yaml.safe_dump(..., sort_keys=False, allow_unicode=True)`
      and `encoding="utf-8"` on every open. A crash then loses at most one
      node.

      `progress` must be called OUTSIDE the lock, or a slow callback (it
      writes to a database) serialises the whole drain.

  ------------------------------------------------------------------
  7. CANCELLATION (v3)
  ------------------------------------------------------------------
      When `cancel_check` is not None, call it in the DISPATCH LOOP between
      node submissions — on the thread running the loop, never inside a worker
      task and never from the `progress` callback.

      On True: stop submitting new work, let in-flight futures finish, write
      the final checkpoint, and RETURN the partial brief. Do NOT raise, and do
      NOT mark anything failed — a cancel is a deliberate partial success.

      WHY NOT FROM THE CALLBACK. The tasks run on a ThreadPoolExecutor. An
      exception raised inside a worker is captured in its Future and never
      reaches the caller, so a callback that raises would appear to do nothing
      at all. Only a check on the dispatching thread can actually stop the run.

  ------------------------------------------------------------------
  8. FINAL CHECKS AND RETURN
  ------------------------------------------------------------------
      After the drain, build the final brief with `merge_brief` and:

        - `check_sensitivity_budget(brief["slots"], config)` on the FLATTENED
          SEGMENT SLOT LIST, not per leaf. Log its message at WARNING when it
          returns one. Per-leaf was equivalent to per-chapter before; under a
          tree a six-slot leaf holding two flag-sensitive slots reads as 33%
          and warns on noise. The budget was written about the segment. A
          per-leaf figure may be logged at DEBUG only.

        - DENSITY: when
          `len(brief["slots"]) < config["segment"]["target_slots"] * density_floor`,
          log at WARNING and set `brief["needs_rebrief"] = True` before the
          final write. The API selects re-brief work on that flag, so it has
          to reach disk, not just the log.

        - A tree-shape summary at INFO naming: total nodes, leaves, forced
          leaves, max depth, total slots, and nodes skipped. Use the word
          "leaves" in it.

      Return the brief dict. Return None ONLY when the tree produced no slots
      at all — every leaf was skipped, or a cancel landed before any node
      resolved. A segment that is merely thin still returns its brief, with
      `needs_rebrief` set: the operator needs the partial content and the flag,
      not a None that discards both.

  ------------------------------------------------------------------
  9. STRUCTURE — define every helper before the code that calls it
  ------------------------------------------------------------------
      If you factor out nested helpers (`_write_brief`, `_handle_node`,
      `_ancestors_of`), define them ALL immediately after the startup checks
      and BEFORE the resume block — not further down the function body.

      Python resolves a nested function's name at CALL time, but the name is
      only bound when the `def` statement actually executes. A `_write_brief`
      defined after the resume block but called inside it raises
      `UnboundLocalError: cannot access local variable '_write_brief' where it
      is not associated with a value` — and ONLY on the resume path, so the
      clean-run tests all pass and the bug ships. Prefer module-level helpers
      taking explicit arguments over nested closures for exactly this reason.

notes: |
  - Module-level `log = logging.getLogger(__name__)`.
  - Follow the project logging conventions in CLAUDE.md: DEBUG on entry and at
    every classification decision, WARNING for forced leaves and both
    segment-level check failures, ERROR for a skipped leaf, INFO for the final
    summary.
  - Builtin generics only in annotations. Do NOT import from `typing`.
  - Standard library plus `yaml` only: concurrent.futures, threading, logging,
    pathlib, yaml. No imports from `app/`.
  - `llm.complete(system_prompt, messages)` takes a list of
    `{"role": ..., "content": ...}` mappings. Always pass a list, never a bare
    string — the test double asserts on the shape.
  - Do NOT catch bare `Exception` around the whole drain to "make it safe".
    Catch narrowly, at the attempt level, where a retry is the answer. In
    particular never write `except (SegmentPlanError, Exception)`: the second
    member makes the first meaningless and turns real bugs into skipped leaves.
  - Do NOT read `config["segment"]["chapters_per_segment"]`. It is gone.
  - Do NOT reimplement any validation, prompt text or merge logic that
    `segment_schema` already exports.
