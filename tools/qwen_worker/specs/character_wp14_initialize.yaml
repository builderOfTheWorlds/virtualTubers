interface: |
  ── app/character/jobs_initialize.py ──

  REPO_ROOT = Path(__file__).resolve().parents[2]

  class InitializeJob:
      name = "initialize"

      def add_arguments(self, parser) -> None
          --pack DIR     default None -> REPO_ROOT / cfg.pack (campaigns/ashiorid_office);
                         the pack directory holding profiles/ and cast/
          --no-export    store_true: skip the cast export step
          (jobs.build_parser already adds --campaign, --character, --dry-run,
          --at, -v; --character is not used by initialize: it loads the whole cast)

      def run(self, ctx) -> jobs.JobResult
          pack = Path(ctx.args.pack) if ctx.args.pack else REPO_ROOT / ctx.cfg.pack
          profiles, cast = pack / "profiles", pack / "cast"
          1. profiles is not a directory -> return JobResult("precondition",
             {"reason": f"no profiles directory in {pack}"}) (exit 3).
          2. accent = {slug: e.accent_color for slug, e in ctx.cfg.characters.items()}
             report = office_profiles.load_profiles(ctx.conn, profiles, cast,
                 campaign=ctx.args.campaign, accent_colors=accent, dry_run=ctx.dry_run)
             (a ProfileError propagates: the framework rolls back, writes a
             `failed` jobs row and exits 1)
          3. exported = [] when --no-export or cast is not a directory, else
             export.export_cast(ctx.conn, cast, campaign=ctx.args.campaign,
                                dry_run=ctx.dry_run)
          4. week, _ = ctx.clock.position(ctx.now)
             dry-run: opened = weeks.get_week(ctx.conn, campaign, week) is None
             otherwise: opened = weeks.ensure_week(ctx.conn, campaign, week, ctx.clock)
          5. print (stdout) "DRY RUN: nothing written" first when dry-run, then
             one line per slug f"{slug}: {action} v{version}" (sorted), then
             f"exported {len(exported)} cast file(s)" and
             f"week {week}: {'opened' if opened else 'already open'}".
          6. changed = report.changed or exported or opened
             return JobResult("done" if changed else "nothing",
                 {"actions": report.actions, "versions": report.versions,
                  "exported": [p.name for p in exported], "week": week,
                  "opened": opened})
          Never commits or rolls back itself: jobs.run_job commits on success and
          rolls back under --dry-run and on an exception.

  ── services/character-updater/main.py ──
  The promoted WP-06 file with exactly one behavioural change:
      from character.jobs_initialize import InitializeJob
      JOBS = {"status": jobs.StatusJob, "initialize": InitializeJob}
  and the positional `job` help text lists both jobs. Everything else
  (sys.path candidates, argv handling, logging setup, exit codes) stays as it
  is, and tests/character/test_character_updater_main.py must still pass.

notes: |
  - Imports in jobs_initialize.py: stdlib (logging, pathlib), `from character.jobs
    import JobResult`, `from character.generator import export, office_profiles`,
    `from character.store import weeks`. character.store.weeks (WP-05):
    ensure_week(conn, campaign, week, clock) -> bool (True when inserted),
    get_week(conn, campaign, week) -> dict | None. character.generator.export
    (character_wp14_export): export_cast(conn, cast_dir, *, campaign=None,
    dry_run=False) -> list[Path].
  - `log = logging.getLogger(__name__)`: DEBUG per step (pack path, action
    counts, exported count, week), INFO when done. The framework logs ERROR and
    pushes Loki; don't duplicate that.
  - No SQL in the job: everything goes through the loader, export and the
    weeks store.
  - Do not migrate the database here (the framework writes its jobs row
    before run(), so the schema must already exist; tracker question P2-Q4).
    The tests migrate first with db.migrate.
  - The tests call jobs.run_job(InitializeJob(), ["--pack", <tmp copy of
    campaigns/ashiorid_office>, "--at", "2026-09-29T12:00:00-04:00", ...],
    cfg=config.load(env={}), connect=<pgserver connect>); the office clock
    puts that in loop week 1. test_main_registers_initialize runs main.py as
    a subprocess. Run the harness with CHARACTER_TEST_REQUIRE_DB=1.
  - Pending guard: tests/character/test_character_initialize.py skips while
    app/character/jobs_initialize.py is missing; the harness sandbox overlays
    the staged files.
