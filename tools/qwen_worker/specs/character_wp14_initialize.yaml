task_id: character_wp14_initialize

goal: |
  Write `app/character/jobs_initialize.py` (the `initialize` job) and register
  it in `services/character-updater/main.py`.

  Plan §5: `initialize` (manual) "Load source (§1), then stages 4-6 for the
  configured characters, seed character_agents (char:<slug>), export cast
  YAML, open the current week". For the office cast (OB-41,
  .claude/prompts/ashiorid_office_build_plan.md: "The book source stages are
  replaced by scripts/load_office_profiles.py") the source + stages 4-6 are
  ONE step: character.generator.office_profiles.load_profiles over
  <pack>/profiles and <pack>/cast, which also seeds `char:<slug>` and the
  office seat worker ids `tuber_N`. Then export (character.generator.export,
  a no-op round trip for the office cast), then open the current loop week.

  THE FAILURE THAT MUST NEVER HAPPEN: a second `initialize` changes anything,
  or `--dry-run` writes anything (rows or files). Plan §5: the idempotency key
  is the stage outputs' sha256 and (character, version); a second run with
  unchanged profiles must exit 2 (nothing to do) and write no rows (the job
  framework still records its `skipped` jobs row); --dry-run writes nothing at
  all, not even the jobs row (the framework handles the row; this job must
  also pass dry_run down so no cast file is written).

target_files:
  - app/character/jobs_initialize.py
  - services/character-updater/main.py

test_files:
  - tests/character/test_character_initialize.py
  - tests/character/test_character_updater_main.py

