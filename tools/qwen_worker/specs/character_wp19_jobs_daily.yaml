task_id: character_wp19_jobs_daily

goal: |
  Write the `daily-maintenance` job, `app/character/jobs_daily.py`, and register
  it in `services/character-updater/main.py` (plan §5 job table, D-03, D-21).

      python services/character-updater/main.py daily-maintenance [--character slug] [--at ISO] [--dry-run]
      (cron, 00:00 America/New_York: `docker compose run --rm character-jobs daily-maintenance`)

  Plan §5, idempotency key daily_summaries (character_id, loop_day); compaction
  is naturally idempotent:
    1. Summaries for yesterday (NY date), for every active character. Waits up to
       ingest.catchup_wait_s (600) for ingest to pass midnight, then proceeds and
       marks the summary `partial`.
    2. Compaction of `messages`, only if ingest lag is under
       ingest.max_lag_messages, else skipped with exit 3 (steps already done stay
       done).

  THE FAILURE THAT MUST NEVER HAPPEN: a compaction problem throws away the
  night's summaries. Each character's summary is COMMITTED before compaction
  starts, so a lagging ingest (exit 3) or a failing messages DB leaves the
  summaries in place, and the re-run skips them (no second LLM call). Second:
  --dry-run writes nothing, calls no LLM and does not wait.

target_files:
  - app/character/jobs_daily.py
  - services/character-updater/main.py

test_files:
  - tests/character/test_character_jobs_daily.py
  - tests/character/test_character_updater_main.py

context_files:
