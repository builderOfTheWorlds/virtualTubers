task_id: 3layers_segment_schema

goal: |
  Implement the PURE half of Layer 2: the parsers, validators, prompt builders
  and brief merger for the segment planner. Every function is a function of
  its arguments — no LLM, no network, no disk. The orchestrator that drives
  them (`plan_segment.py`) is a separate module and is NOT your concern.

  Layer 2 takes ONE entry out of `arc_plan.yaml` (six hours of airtime) and
  turns it into a `brief.yaml` of roughly 170 authored slots, in two passes:

    2a — one call, ~9 chapter one-liners covering the six hours.
    2b — one call PER CHAPTER, ~19 slots each. These run concurrently.

  Two rules here are load-bearing and easy to get subtly wrong:

  1. THE BRIEF'S TOP-LEVEL SLOT KEY IS `slots`, NOT `scenes`. The already
     promoted `worklist.build_worklist` does `brief["slots"]`. Naming it
     anything else does not crash — it yields an empty worklist, and the run
     reports success in three seconds having generated nothing.

  2. `sensitivity` AND `depends_on` ARE A BUDGET, NOT A LABEL. Layer 3 gives
     every slot exactly `takes_per_slot` takes, of which `neutral_takes` are
     unconditioned. What is left is the conditioned budget, and each declared
     flag needs TWO conditioned takes (true and false) to be covered. At the
     shipped defaults, 3 takes minus 1 neutral is 2 — so a slot may declare
     exactly ONE dependency. A slot declaring three needs six takes; the four
     uncovered state combinations play a line written for the wrong state,
     silently, forever.

target_files:
  - utilities/3LayersWeeklyGeneration/src/segment_schema.py

test_files:
  - utilities/3LayersWeeklyGeneration/tests/test_segment_schema.py

context_files:
  - utilities/3LayersWeeklyGeneration/src/vocabulary.py
  - utilities/3LayersWeeklyGeneration/src/worklist.py
  - utilities/3LayersWeeklyGeneration/src/arc_schema.py

interface: |
  utilities/3LayersWeeklyGeneration/src/segment_schema.py must export exactly
  these names.

  ------------------------------------------------------------------
  class SegmentPlanError(ValueError)
  ------------------------------------------------------------------
      Raised ONLY for a model reply that cannot be parsed into a list.
      NOT raised for content that fails validation — that path returns
      problem strings so the orchestrator can retry with feedback.

  ------------------------------------------------------------------
  SYSTEM_PROMPT_CHAPTERS  and  SYSTEM_PROMPT_SLOTS
  ------------------------------------------------------------------
      Two module-level string constants, several sentences each. The first
      frames the model as breaking a six-hour segment into chapters; the
      second as writing the individual improv prompts inside one chapter.
      Both must be non-empty after `.strip()`.

  ------------------------------------------------------------------
  def parse_chapters(reply) -> list
  def parse_slots(reply) -> list
  ------------------------------------------------------------------
      Same extraction algorithm for both — implement it once as a private
      helper and call it from both with a different key name
      ("chapters" / "slots").

      IMPLEMENT EXACTLY THIS ALGORITHM, IN THIS ORDER:

        1. If the text contains a ``` fence, take the text BETWEEN the first
           fence and the next fence. Strip an optional language word
           ("yaml", "yml", "json") off the front of the first line.
        2. Otherwise use the whole text.
        3. `yaml.safe_load` it.
        4. If the result is a dict, return `result[key]` when that key is
           present and is a list.
        5. If the result is itself a list, return it.
        6. Otherwise raise SegmentPlanError.

      Do NOT write a regex like `^(.*?)(?:\n|$)` to find the payload. That
      matches the first LINE and turns a perfect multi-line reply into the
      string "chapters:".

      Every element of the returned list must be a dict. If any is not,
      raise SegmentPlanError.

  ------------------------------------------------------------------
  def validate_chapters(chapters, config) -> list[str]
  ------------------------------------------------------------------
      Returns a list of problem strings, [] when clean. Never raises.

      CHECK REQUIRED KEYS FIRST, AND RETURN EARLY. Indexing a chapter for
      `order` before you know `order` is present raises KeyError out of a
      function whose whole contract is to return problems.

        required = ["chapter_id", "order", "title", "summary",
                    "continuity_in", "continuity_out"]
        problems = []
        for ch in chapters:
            for key in required:
                if key not in ch:
                    problems.append(f"chapter is missing required key '{key}'")
        if problems:
            return problems

      Then, in this order:
        - `len(chapters)` must equal `config["segment"]["chapters_per_segment"]`.
        - The set of `order` values must equal `set(range(len(chapters)))`.
        - `chapter_id` values must be unique.
        - Every `summary` must be a non-empty string. The problem string MUST
          contain that chapter's `chapter_id`, because the whole point is to
          tell the model which one to fix.

          CHECK THE TYPE BEFORE CALLING .strip(). `summary:` with nothing
          after it is valid YAML that parses to None, and the key IS present,
          so the required-key check waves it through. `None.strip()` then
          raises AttributeError out of a function whose entire contract is to
          return problems rather than raise. Write it as:

              if not isinstance(ch["summary"], str) or not ch["summary"].strip():

          Apply the same isinstance-then-strip shape to every string field
          you test for emptiness anywhere in this module.

  ------------------------------------------------------------------
  def validate_slots(slots, pack, vocab, config) -> list[str]
  ------------------------------------------------------------------
      Returns a list of problem strings, [] when clean. Never raises.

      Note the argument order: slots, pack, vocab, config.

      THE RULE THAT MAKES "NEVER RAISES" TRUE: when a value fails its type
      check, APPEND THE PROBLEM AND THEN SKIP EVERY CHECK THAT USES IT.
      Recording a problem does not make the value usable — the next line
      still runs. Concretely:

          depends_on = slot.get("depends_on")
          if not isinstance(depends_on, list):
              problems.append(f"slot '{slot_id}' depends_on must be a list")
          else:
              ...   # the emptiness check AND the budget check go in HERE

      Writing the budget check after that `if` instead of inside its `else`
      is how `len(None)` reaches the interpreter. Same shape for
      `participants`, `prompt`, `lore` and `summary`.

      SCOPE THOSE CHECKS TO THE RIGHT KIND. `prompt`, `lore`, `sensitivity`
      and `depends_on` exist ONLY on ambient slots. A spine slot is a pointer
      to authored canon and legitimately has none of them, so every one of
      those checks — including the `isinstance(..., list)` guards — belongs
      inside `if slot["kind"] == "ambient":`. Running them on a spine slot
      reports a perfectly valid slot as broken and costs a retry that cannot
      succeed, because there is nothing for the model to fix.

      `participants` and `slot_id` are the only fields checked on BOTH kinds.

      REQUIRED KEYS FIRST, EARLY RETURN, same as chapters — but the required
      set depends on `kind`:

        ambient: slot_id, kind, prompt, lore, participants, sensitivity,
                 depends_on
        spine:   slot_id, kind, scene_ref, participants

      THE REQUIRED-KEY LOOP RUNS FIRST AND RETURNS BEFORE ANYTHING ELSE:

          for slot in slots:
              kind = slot.get("kind")
              ... pick `required` from kind, or record the bad-kind problem
                  and `continue` ...
              for key in required:
                  if key not in slot:
                      problems.append(
                          f"slot '{slot.get('slot_id', '<no slot_id>')}' "
                          f"is missing required key '{key}'")
          if problems:
              return problems          # <-- MANDATORY. Do not delete this.

      Note `slot.get("slot_id", ...)`, never `slot["slot_id"]`, inside that
      loop: `slot_id` is itself one of the required keys, so the very slot
      that is missing it is the one whose problem message you are building.
      Indexing it there raises KeyError out of a function that must return
      problems. The same applies to EVERY message anywhere in this function
      that names a slot — use `.get` with a fallback throughout.

      The early return is what lets every later check assume its keys exist.

      A slot whose `kind` is neither "ambient" nor "spine" gets ONE problem
      naming the offending value, and that slot is not checked further.
      (Layer 3 branches on `kind`; an unrecognised value is skipped by both
      branches, so the slot becomes a hole in the airtime that nothing
      reports.)

      Then, per slot:

        - Delegate to `vocab.validate_slot(slot)` and extend `problems` with
          whatever it returns. It already covers: unknown scene_ref, unknown
          lore stems, unknown sensitivity value, unknown depends_on keys, and
          depends_on being non-empty when sensitivity is not "flags". Do NOT
          reimplement those.

        - THE CHECKS VOCAB DOES NOT DO, which you must add:

          * participants: must be a non-empty list, and every id must be a key
            of `pack.cast`. The problem string must contain the offending id.
          * an ambient slot must NOT have a `scene_ref` key. A slot cannot be
            both generated and authored canon; accepting both lets a generated
            take overwrite scripted spine dialogue.
          * an ambient slot's `prompt` must be a non-empty STRING — same
            isinstance-then-strip shape as `summary` above, for the same
            reason. The problem string must contain the slot_id.
          * `participants` and `depends_on` must each be a list. A bare
            `participants:` in the reply parses to None, and `len(None)` and
            `None * 2` both raise.
          * `sensitivity == "flags"` with an empty `depends_on` is a problem.
            `worklist.conditions_for` builds its candidates from `depends_on`;
            an empty one yields no candidates and every take falls back to
            neutral. The slot declared it varies by state and then does not.
          * THE BUDGET CHECK — implement exactly this:

                takes = config["dialogue"]["takes_per_slot"]
                neutral = config["dialogue"]["neutral_takes"]
                conditioned = takes - neutral
                if len(depends_on) * 2 > conditioned:
                    problems.append(... slot_id ... len(depends_on) ...)

            Compute it from config every time. Do not hardcode 1 or 2 — the
            config is the knob a human turns when they buy more GPU hours.

        - Across the whole list: duplicate `slot_id` values are a problem.
          Slot ids become directory names under `slots/`; two slots sharing
          one id write their takes into the same directory and the second
          silently inherits the first's.

  ------------------------------------------------------------------
  def sensitivity_mix(slots) -> dict
  ------------------------------------------------------------------
      Returns `{"none": n, "tone": n, "flags": n}` counting AMBIENT slots
      only. A slot with no `sensitivity` key is not counted at all.

      Spine slots have no sensitivity — they are canon. Counting them would
      dilute the fraction and let the flags budget be exceeded while the
      arithmetic still looked fine.

  ------------------------------------------------------------------
  def check_sensitivity_budget(slots, config) -> str | None
  ------------------------------------------------------------------
      Returns a message string when the fraction of `flags` slots exceeds
      `config["segment"]["sensitivity_budget"]`, otherwise None.

      IMPLEMENT EXACTLY THIS:

          mix = sensitivity_mix(slots)
          total = sum(mix.values())
          if total == 0:
              return None                      # spine-only chapter
          fraction = mix["flags"] / total
          budget = config["segment"]["sensitivity_budget"]
          if fraction <= budget:
              return None
          log.warning(...)
          return (f"{mix['flags']} of {total} slots are state-sensitive "
                  f"({fraction:.2f}), over the budget of {budget}")

      The `total == 0` guard is not hypothetical: a chapter that is entirely
      scripted canon would otherwise abort a six-hour segment on a
      ZeroDivisionError.

      The returned message MUST contain the budget value rendered so that the
      substring "0.4" appears for a budget of 0.40.

      This is a WARNING, not a rejection. The brief is still usable; it just
      needs a human to look at it. Returning a problem string here instead
      would burn a retry on a judgement call the model cannot reliably fix.

  ------------------------------------------------------------------
  def build_chapter_prompt(pack, arc_segment, config, problems) -> str
  ------------------------------------------------------------------
      The 2a user message. Must contain, all verbatim from the arguments:
        - `arc_segment["synopsis"]`
        - `arc_segment["continuity_in"]` and `arc_segment["continuity_out"]`
        - `str(config["segment"]["chapters_per_segment"])`
        - the required chapter key list, and — this one is not optional —
          the legal range of `order` values, stated as actual numbers:
          0 to `chapters_per_segment - 1`. `validate_chapters` requires the
          orders to be exactly `range(n)`. A model told only "include an
          order key" numbers them from 1, which is a rejected batch and a
          wasted retry on EVERY segment of the week. A Python comment in
          your source does not reach the model; the number has to be in the
          returned string. DERIVE it from `chapters_per_segment` — do not
          write a literal "0 to 8". A prompt that says "0 to 8" while asking
          for five chapters contradicts itself in the same breath, and the
          model resolves the contradiction whichever way it likes.
        - an instruction to reply with ONLY YAML under a `chapters:` key
        - each string in `problems`, when `problems` is truthy

      When `problems` is None or empty the prompt must NOT contain the phrase
      "previous attempt" in any casing.

  ------------------------------------------------------------------
  def build_slot_prompt(pack, arc_segment, chapter, config, problems) -> str
  ------------------------------------------------------------------
      The 2b user message for ONE chapter. Must contain:

        - `chapter["summary"]` verbatim.
        - A CONCRETE SLOT TARGET: the integer
          `round(config["segment"]["target_slots"] / config["segment"]["chapters_per_segment"])`
          rendered into the text (170/9 -> 19). Without a number the model
          treats "a sequence of beats" as open-ended and stops wherever it
          feels like, which is how a six-hour segment comes back with forty
          slots.
        - Every flag in `config["state"]["flags"]`, rendered verbatim, as the
          legal `depends_on` keys. Validation rejects an invented key, but a
          rejection costs a full retry — listing them up front is free.
        - The cast: for each id in `pack.player_ids`, that id AND the member's
          name from `pack.cast`.
        - SPINE GROUND TRUTH: for each id in `arc_segment["spine_scenes"]`
          that exists in `pack.scenes`, the scene's `enter_narration`
          verbatim. The model bridges AROUND authored spine content and never
          invents spine plot — it can only do that if it can see the real
          narration.
        - The literal phrase "for the ear" (any casing), as part of the
          instruction that prompts are written to be SPOKEN. Prompts written
          for the page produce takes that are unspeakable aloud; this matches
          the pack format doc's existing ambient-authoring rule.
        - The one-dependency budget rule, stated plainly.
        - An instruction to reply with ONLY YAML under a `slots:` key.
        - Each string in `problems`, when `problems` is truthy.

      When `problems` is None or empty, no "previous attempt" phrasing.

  ------------------------------------------------------------------
  def merge_brief(arc_segment, chapters, slots_by_chapter, config) -> dict
  ------------------------------------------------------------------
      `slots_by_chapter` maps chapter_id -> list of slot dicts.

      IMPLEMENT EXACTLY THIS:

          out_slots = []
          for ch in sorted(chapters, key=lambda c: c["order"]):
              for slot in slots_by_chapter.get(ch["chapter_id"], []):
                  slot = dict(slot)
                  slot["chapter_id"] = ch["chapter_id"]
                  out_slots.append(slot)

          return {
              "segment_id": arc_segment["id"],
              "order": arc_segment["order"],
              "loop": arc_segment["loop"],
              "hours": arc_segment["hours"],
              "synopsis": arc_segment["synopsis"],
              "continuity_in": arc_segment["continuity_in"],
              "continuity_out": arc_segment["continuity_out"],
              "carry_in": arc_segment.get("carry_in", {}),
              "carry_out": arc_segment.get("carry_out", {}),
              "chapters": sorted(chapters, key=lambda c: c["order"]),
              "slots": out_slots,
          }

      Three things that block is careful about:

        - Iteration is driven by CHAPTER ORDER, not by `slots_by_chapter`'s
          key order. Chapters are 2b'd concurrently, so that dict arrives in
          whatever order the pool finished. Airtime is sequential; a brief
          ordered by completion time plays the segment's evening before its
          morning.
        - `.get(..., [])`, not `[...]`. merge_brief is called on partial state
          during a resumed run and must not raise on chapters that have not
          been 2b'd yet.
        - `dict(slot)` copies before stamping `chapter_id`, so the caller's
          slot dicts are not mutated underneath it.

notes: |
  - Module-level `log = logging.getLogger(__name__)`.
  - Follow the project logging conventions in CLAUDE.md: DEBUG on entry and at
    decision points, ERROR inside error handlers.
  - `vocab` is a `vocabulary.Vocabulary`. Use its public methods
    (`validate_slot`, `unknown_lore`, `unknown_state_keys`) rather than
    reaching into its frozensets.
  - `pack` is an `app/campaign/pack.py` CampaignPack. Read only: `.title`,
    `.genre`, `.scenes` (dict of id -> Scene with `.title`,
    `.enter_narration`, `.ambient`, `.prompt`), `.lore`, `.cast` (dict of id
    -> member with `.name`, `.role`), `.player_ids`, and `.gm_id`.
  - Import yaml at module level.
  - Do NOT modify anything under `app/` — it is shared with the live avatar
    app.
  - No network calls and no file I/O anywhere in this module.
