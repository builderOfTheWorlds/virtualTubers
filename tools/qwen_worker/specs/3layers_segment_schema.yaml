task_id: 3layers_segment_schema

goal: |
  Rewrite the PURE half of Layer 2 of the 3-layer offline content generator so
  that a segment is divided by a RECURSIVE TREE rather than a flat list of nine
  chapters. This module owns the parsing, the validation, the prompt text and
  the final merge into `brief.yaml`. It never calls a model, never touches the
  network, and never touches disk. The orchestrator that drives it
  (`plan_segment.py`) is a separate module and is NOT your concern.

  WHY THE TREE REPLACES THE FLAT SPLIT. A segment is six hours of airtime, and
  how much *happens* in those six hours is wildly uneven. The flat version gave
  a quiet stretch of road the same nine-way split as the arrival at the
  moonwell. The tree lets the model say "this slice carries three times the
  weight of that one", and recursion continues only where density actually
  demands it. A uniform-weight run reproduces the old shape almost exactly —
  root splits into ~9 leaves of ~19 slots — so the default behaviour does not
  regress.

  TWO PROPERTIES MATTER MORE THAN ANY INDIVIDUAL FUNCTION HERE.

  1. WORDS RECONCILE EXACTLY. A parent's `target_words` is split among its
     children and the children's shares MUST sum back to it, to the word.
     Slots may drift by a rounding unit; words may not. Words are the budget
     that ties back to the 168-hour target, and a tree that leaks three
     percent per level has lost a fifth of the week by depth four. Nothing in
     the output will look wrong — the stream simply runs dry early.

  2. THE TREE ALWAYS TERMINATES, AND NEVER BY DROPPING A NODE. Both
     `max_depth` and expand-exhaustion force a LEAF, flagged `forced: True`.
     A forced leaf is oversized and gets planned anyway; a dropped node is a
     silent hole in the airtime that nothing downstream can detect.

  Everything about slot validation and the sensitivity budget is UNCHANGED
  from the current module. Its tests are preserved verbatim in the acceptance
  file and are the oracle proving this rewrite did not disturb the parts it
  had no business disturbing.

target_files:
  - utilities/3LayersWeeklyGeneration/src/segment_schema.py

test_files:
  - utilities/3LayersWeeklyGeneration/tests/test_segment_schema.py

context_files:
  - utilities/3LayersWeeklyGeneration/src/vocabulary.py
  - utilities/3LayersWeeklyGeneration/src/arc_schema.py
  - utilities/3LayersWeeklyGeneration/src/worklist.py

interface: |
  utilities/3LayersWeeklyGeneration/src/segment_schema.py must export exactly
  these names.

  THE NODE RECORD — the single shape every unit below the segment root takes:

      {
        "node_id": str,          # f"{parent_id}-n{order}"
        "parent_id": str | None,
        "order": int,            # 0-based, contiguous among siblings
        "depth": int,            # 0 = the segment root
        "title": str,
        "summary": str,
        "continuity_in": str,
        "continuity_out": str,
        "target_words": int,
        "target_slots": int,
        "kind": "branch" | "leaf" | None,   # None = not yet resolved
        "forced": bool,
        "children": [node_id, ...],
        "slots": [...] | None,
      }

  Node ids are `f"{parent_id}-n{order}"` — root `seg-01`, child `seg-01-n2`,
  grandchild `seg-01-n2-n0`. NOT dotted: `worklist.take_path` uses the id as a
  literal directory name, and dotted components read as file extensions to
  every tool that later globs that tree.

  ------------------------------------------------------------------
  class SegmentPlanError(ValueError)
  ------------------------------------------------------------------
      Raised for a reply that cannot be parsed, and for an infeasible tree
      config. NOT raised for a batch that fails validation — that path returns
      problem strings and the caller retries.

  ------------------------------------------------------------------
  SYSTEM_PROMPT_EXPAND   (renamed from SYSTEM_PROMPT_CHAPTERS)
  SYSTEM_PROMPT_LEAF     (renamed from SYSTEM_PROMPT_SLOTS)
  ------------------------------------------------------------------
      Module-level string constants, several sentences each. EXPAND frames the
      model as dividing a stretch of airtime into child slices, each carrying a
      `weight` reflecting how much happens in it. LEAF is unchanged in spirit
      from the current SYSTEM_PROMPT_SLOTS. Both must be non-empty. The
      orchestrator imports both, and the test suite's fake LLM dispatches on
      their identity — so these exact names must exist.

  ------------------------------------------------------------------
  def derive_target_slots(target_words, config) -> int
  ------------------------------------------------------------------
      `round(target_words / (words_per_take * takes_per_slot))`, reading
      `config["budget"]["measured_baseline"]["words_per_take"]` and
      `config["dialogue"]["takes_per_slot"]`. At the shipped defaults that is
      105 * 3 = 315 words per slot, so the root's 53600 words derive to 170 —
      which must equal the `segment.target_slots` the config states
      independently.

      Do NOT hard-code 315. The whole point of reading the measured baseline is
      that re-measuring it re-derives every budget in the tree.

  ------------------------------------------------------------------
  def leaf_eligible(target_slots, config) -> bool
  ------------------------------------------------------------------
      `target_slots <= config["segment"]["tree"]["max_leaf_slots"]`.
      Return a real bool — the tests use `is True` / `is False`.

  ------------------------------------------------------------------
  def validate_tree_config(config) -> list[str]
  ------------------------------------------------------------------
      The knob interlock. Returns problem strings; [] when the config is
      feasible. Reads `config["segment"]["tree"]`. Check ALL of:

        - `max_children >= 2`
        - `max_depth >= 1`
        - `max_leaf_slots >= 1`
        - `0 < leaf_density_floor <= 1`
        - `min_node_words * 2 <= max_leaf_slots * words_per_take * takes_per_slot`

      Every problem string MUST contain the name of the offending knob — the
      tests assert on it, and an operator reading a startup failure needs to
      know which of five numbers to change.

      WHY THE LAST CHECK EXISTS. These knobs can be set mutually infeasible,
      and the failure is silent rather than loud: if `min_node_words` exceeds
      half a leaf's worth of words, no split can ever produce two floor-legal
      children, so every expand call fails validation, retries, exhausts, and
      degrades to a forced leaf. The run "succeeds" and quietly produces one
      giant leaf per segment. Catching it once at startup costs nothing.

      NOTE the caller raises SegmentPlanError on a non-empty result. This
      function itself RETURNS, it does not raise — same discipline as every
      other validator here.

  ------------------------------------------------------------------
  def distribute_words(children, node, config) -> list
  ------------------------------------------------------------------
      Turn the model's relative `weight` values into exact word budgets.
      Return a NEW list of NEW dicts — do not mutate the input, the tests
      assert the originals are untouched.

      Implement exactly this:

        1. `total = sum(float(c["weight"]) for c in children)`.
        2. For each child, `share = round(node["target_words"] * weight / total)`.
        3. RECONCILE: compute `remainder = node["target_words"] - sum(shares)`
           and add it to the child with the LARGEST share. The sum must then
           equal the parent exactly.
        4. Set each child's `target_slots = derive_target_slots(its words, config)`.

      Weights need NOT sum to 1. The model is asked for relative weight, and
      normalising locally is arithmetic — demanding it of the model would be a
      retry, and a 400-second generation, for something this line already fixes.

      THE RECONCILIATION IN STEP 3 IS THE POINT OF THIS FUNCTION. Independent
      rounding of each share does not sum to the parent. See goal property 1
      for why a per-level leak is unacceptable. Derived per-child SLOT counts
      are NOT reconciled — they may drift by one per child, and the
      segment-level density check absorbs that. Words exactly, slots
      approximately; do not try to reconcile twice.

  ------------------------------------------------------------------
  def parse_children(reply) -> list      (renamed from parse_chapters)
  def parse_slots(reply) -> list         (unchanged)
  ------------------------------------------------------------------
      Extract the list from a raw model reply. `parse_children` reads a
      `children:` key; `parse_slots` reads `slots:`. Both tolerate, in this
      order: a ```yaml or bare ``` fence; prose before the document; a mapping
      with the expected key OR a bare top-level list.

      Keep the existing shared `_parse_reply(reply, key)` helper and give both
      public functions a one-line body that calls it. Raise SegmentPlanError
      when nothing parses or the result is not a list of mappings.

  ------------------------------------------------------------------
  def validate_children(children, node, config) -> list[str]
                                          (renamed from validate_chapters)
  ------------------------------------------------------------------
      Returns problem strings, [] when clean. Never raises.

      CHECK REQUIRED KEYS FIRST AND RETURN EARLY, exactly as the arc validator
      does. The required keys are: order, title, summary, continuity_in,
      continuity_out, weight. Every later check indexes into the child; running
      them on a child missing `weight` dies with a KeyError, which turns a
      recoverable bad batch into a crashed run — the precise opposite of this
      function's contract.

      Then, IN THIS ORDER:

        - the list is non-empty. RETURN IMMEDIATELY if it is empty. Every
          later check — and `distribute_words` in particular — divides by the
          summed weight, which is 0 for an empty list. `validate_children`
          must return a problem string, never raise, so this early return is
          load-bearing, not defensive.
        - `len(children) <= max_children`. The problem string must contain the
          cap or the word `max_children`.
        - the `order` values are exactly the set 0..N-1. They need NOT arrive
          sorted — a complete but out-of-sequence set is FINE and must produce
          no problem. Gaps and duplicates are problems.
        - `weight` is a positive real number. Reject 0, negatives, strings and
          None. `bool` is not acceptable either — note `isinstance(True, int)`
          is True in Python.
        - `summary`, `continuity_in` and `continuity_out` are non-empty after
          `.strip()`. A value YAML read as None must be rejected, not crash.
        - EVERY child's distributed word share is `>= min_node_words`. Compute
          the shares by calling `distribute_words(children, node, config)`
          inside this function — ONLY once every check above has passed, since
          it needs a non-empty list and positive numeric weights — so a floor violation is caught BEFORE any child
          node is created. The problem string must contain `min_node_words` or
          the configured number.

      Every problem string must name the offending child by its `order` (or
      index when `order` itself is missing). During an unattended run these
      strings are the entire diagnosis and they are fed verbatim into the retry
      prompt.

      DELIBERATELY NOT VALIDATED: whether child 0's `continuity_in` actually
      follows from the parent's. It is prose, there is no deterministic check,
      and this codebase does not add trust-based guards. Continuity is handled
      on the prompt side — siblings are generated in one call and see each
      other, and the ancestor chain carries the parent's continuity down.

  def validate_slots(slots, pack, vocab, config, node=None) -> list[str]
  ------------------------------------------------------------------
      Returns a list of problem strings, [] when clean. Never raises.

      Note the argument order: slots, pack, vocab, config.

      THE RULE THAT MAKES "NEVER RAISES" TRUE: when a value fails its type
      check, APPEND THE PROBLEM AND THEN SKIP EVERY CHECK THAT USES IT.
      Recording a problem does not make the value usable — the next line
      still runs. Concretely:

          depends_on = slot.get("depends_on")
          if not isinstance(depends_on, list):
              problems.append(f"slot '{slot_id}' depends_on must be a list")
          else:
              ...   # the emptiness check AND the budget check go in HERE

      Writing the budget check after that `if` instead of inside its `else`
      is how `len(None)` reaches the interpreter. Same shape for
      `participants`, `prompt`, `lore` and `summary`.

      SCOPE THOSE CHECKS TO THE RIGHT KIND. `prompt`, `lore`, `sensitivity`
      and `depends_on` exist ONLY on ambient slots. A spine slot is a pointer
      to authored canon and legitimately has none of them, so every one of
      those checks — including the `isinstance(..., list)` guards — belongs
      inside `if slot["kind"] == "ambient":`. Running them on a spine slot
      reports a perfectly valid slot as broken and costs a retry that cannot
      succeed, because there is nothing for the model to fix.

      `participants` and `slot_id` are the only fields checked on BOTH kinds.

      REQUIRED KEYS FIRST, EARLY RETURN, same as chapters — but the required
      set depends on `kind`:

        ambient: slot_id, kind, prompt, lore, participants, sensitivity,
                 depends_on
        spine:   slot_id, kind, scene_ref, participants

      THE REQUIRED-KEY LOOP RUNS FIRST AND RETURNS BEFORE ANYTHING ELSE:

          for slot in slots:
              kind = slot.get("kind")
              ... pick `required` from kind, or record the bad-kind problem
                  and `continue` ...
              for key in required:
                  if key not in slot:
                      problems.append(
                          f"slot '{slot.get('slot_id', '<no slot_id>')}' "
                          f"is missing required key '{key}'")
          if problems:
              return problems          # <-- MANDATORY. Do not delete this.

      Note `slot.get("slot_id", ...)`, never `slot["slot_id"]`, inside that
      loop: `slot_id` is itself one of the required keys, so the very slot
      that is missing it is the one whose problem message you are building.
      Indexing it there raises KeyError out of a function that must return
      problems. The same applies to EVERY message anywhere in this function
      that names a slot — use `.get` with a fallback throughout.

      The early return is what lets every later check assume its keys exist.

      A slot whose `kind` is neither "ambient" nor "spine" gets ONE problem
      naming the offending value, and that slot is not checked further.
      (Layer 3 branches on `kind`; an unrecognised value is skipped by both
      branches, so the slot becomes a hole in the airtime that nothing
      reports.)

      Then, per slot:

        - Delegate to `vocab.validate_slot(slot)` and extend `problems` with
          whatever it returns. It already covers: unknown scene_ref, unknown
          lore stems, unknown sensitivity value, unknown depends_on keys, and
          depends_on being non-empty when sensitivity is not "flags". Do NOT
          reimplement those.

        - THE CHECKS VOCAB DOES NOT DO, which you must add:

          * participants: must be a non-empty list, and every id must be a key
            of `pack.cast`. The problem string must contain the offending id.
          * an ambient slot must NOT have a `scene_ref` key. A slot cannot be
            both generated and authored canon; accepting both lets a generated
            take overwrite scripted spine dialogue.
          * an ambient slot's `prompt` must be a non-empty STRING — same
            isinstance-then-strip shape as `summary` above, for the same
            reason. The problem string must contain the slot_id.
          * `participants` and `depends_on` must each be a list. A bare
            `participants:` in the reply parses to None, and `len(None)` and
            `None * 2` both raise.
          * `sensitivity == "flags"` with an empty `depends_on` is a problem.
            `worklist.conditions_for` builds its candidates from `depends_on`;
            an empty one yields no candidates and every take falls back to
            neutral. The slot declared it varies by state and then does not.
          * THE BUDGET CHECK — implement exactly this:

                takes = config["dialogue"]["takes_per_slot"]
                neutral = config["dialogue"]["neutral_takes"]
                conditioned = takes - neutral
                if len(depends_on) * 2 > conditioned:
                    problems.append(... slot_id ... len(depends_on) ...)

            Compute it from config every time. Do not hardcode 1 or 2 — the
            config is the knob a human turns when they buy more GPU hours.

        - Across the whole list: duplicate `slot_id` values are a problem.
          Slot ids become directory names under `slots/`; two slots sharing
          one id write their takes into the same directory and the second
          silently inherits the first's.

  ------------------------------------------------------------------
  def sensitivity_mix(slots) -> dict
  ------------------------------------------------------------------
      Returns `{"none": n, "tone": n, "flags": n}` counting AMBIENT slots
      only. A slot with no `sensitivity` key is not counted at all.

      Spine slots have no sensitivity — they are canon. Counting them would
      dilute the fraction and let the flags budget be exceeded while the
      arithmetic still looked fine.

  ------------------------------------------------------------------
  def check_sensitivity_budget(slots, config) -> str | None
  ------------------------------------------------------------------
      Returns a message string when the fraction of `flags` slots exceeds
      `config["segment"]["sensitivity_budget"]`, otherwise None.

      IMPLEMENT EXACTLY THIS:

          mix = sensitivity_mix(slots)
          total = sum(mix.values())
          if total == 0:
              return None                      # spine-only chapter
          fraction = mix["flags"] / total
          budget = config["segment"]["sensitivity_budget"]
          if fraction <= budget:
              return None
          log.warning(...)
          return (f"{mix['flags']} of {total} slots are state-sensitive "
                  f"({fraction:.2f}), over the budget of {budget}")

      The `total == 0` guard is not hypothetical: a chapter that is entirely
      scripted canon would otherwise abort a six-hour segment on a
      ZeroDivisionError.

      The returned message MUST contain the budget value rendered so that the
      substring "0.4" appears for a budget of 0.40.

      This is a WARNING, not a rejection. The brief is still usable; it just
      needs a human to look at it. Returning a problem string here instead
      would burn a retry on a judgement call the model cannot reliably fix.

  ------------------------------------------------------------------

      NEW IN v3 — THE OPTIONAL `node` PARAMETER. Everything above is unchanged.
      When `node` is given AND is not None, add ONE further check:

          if len(slots) < node["target_slots"] * leaf_density_floor:
              problem

      When `node` is None, no count check happens at all — that is the current
      behaviour and existing callers rely on it.

      WHY THIS IS NEW. Today `validate_slots` does not check slot count
      anywhere; `target_slots` appears only in the prompt and in one
      segment-level density check at the very end. Under recursion there are
      many more leaves and many more chances to under-deliver, and one
      aggregate warning after the whole segment is planned is far too late to
      retry. Catching it per-leaf converts a silent shortfall into a retry that
      costs one call.

  ------------------------------------------------------------------
  def build_expand_prompt(pack, arc_segment, ancestors, node, config, problems) -> str
                                       (renamed from build_chapter_prompt)
  ------------------------------------------------------------------
      The user prompt for ONE expand attempt. `ancestors` is a list of node
      records, ROOT-EXCLUSIVE, ordered shallow -> deep; it is empty at depth 1.

      Must contain, in this order:
        - the segment synopsis and both continuity ends from `arc_segment`;
        - each ancestor's title and summary, IN DEPTH ORDER — the test asserts
          the shallower title appears at a lower index in the string;
        - this node's summary, continuity_in, continuity_out and its
          `target_words` rendered as a number;
        - an expected-children guideline:
          `min(ceil(node["target_slots"] / max_leaf_slots), max_children)`,
          rendered as a number;
        - an explicit instruction to give each child a `weight` reflecting how
          much happens in it;
        - the required key list, and an instruction to reply with ONLY YAML
          under a `children:` key;
        - when `problems` is truthy, each problem string verbatim.

      When `problems` is None or empty the prompt must NOT contain the word
      "previous" in any case — the test asserts on exactly that.

      WHY THE EXPECTED-CHILDREN GUIDELINE. Without a number tied to the
      airtime being divided, the model picks a count unrelated to it — usually
      3 or 5 regardless of whether the node holds twenty slots or two hundred.

  ------------------------------------------------------------------
  def build_leaf_prompt(pack, arc_segment, ancestors, node, config, problems) -> str
                                       (renamed from build_slot_prompt)
  ------------------------------------------------------------------
      Same content as the current slot prompt, PLUS the ancestor chain, and
      with the slot count taken from `node["target_slots"]` rather than
      computed from a chapter count.

      Keep everything the current build_slot_prompt does: the legal state keys
      rendered verbatim, the cast list, the spine ground truth, the
      written-for-the-ear instruction, and the problems-on-retry behaviour.

      THE CAST MEMBER HAS ONLY THESE ATTRIBUTES: `id`, `name`, `role`,
      `archetype`, `system_prompt`. Render the cast as the current version
      does — `f"- {player_id}: {member.name}"` over `pack.player_ids`. There
      is NO `description` attribute; reading one raises AttributeError against
      every real pack and every test double.

      SPINE GROUND TRUTH GOES TO EVERY LEAF regardless of depth — it is not
      scoped to a branch. The current version already passes it to every
      chapter; keep that.

  ------------------------------------------------------------------
  def merge_brief(arc_segment, tree, config) -> dict
  ------------------------------------------------------------------
      `tree` is a dict of `node_id -> node record`, containing the root and
      every descendant. Flatten it into the shape `worklist.py` already reads.

      THE ROOT'S node_id IS `arc_segment["id"]`. Note the arc segment record
      spells it `id`, NOT `segment_id` — `segment_id` is the name that key
      takes in the BRIEF this function returns. Reading `arc_segment["segment_id"]`
      raises KeyError against every real arc plan. Alternatively find the root
      as the node whose `parent_id` is None; either is acceptable, but do not
      invent a key that does not exist on the input.

      DFS from the root, visiting each node's children IN `order` — NOT in the
      dict's insertion order, which is arbitrary after a concurrent run and is
      what the test with reversed insertion checks. At each LEAF, append its
      slots in their own order. Tag every emitted slot with
      `slot["node_id"] = <the leaf's id>` (this REPLACES the old
      `chapter_id` tag; no slot may carry a `chapter_id` key).

      Return exactly these keys:
        segment_id, order, loop, hours, synopsis, continuity_in,
        continuity_out, carry_in, carry_out, slots, nodes

      The first nine come from `arc_segment` exactly as the current version
      builds them (`carry_in`/`carry_out` via `.get(..., {})`).

      `nodes` is a flat summary list, one entry per node in the same DFS order,
      each with: node_id, parent_id, depth, kind, forced, target_slots, and
      `slots` = the ACTUAL number of slots that node emitted (0 for a branch).
      This exists so a human reading brief.yaml by hand can see the tree shape
      the run actually produced, and compare target against actual per node.
      Note the key `slots` inside a `nodes` entry is an integer COUNT, while
      the top-level `slots` is the list of slot records — that is intentional.

      DRAINING IN ARC ORDER IS LOAD-BEARING. Stopping a run at any point must
      leave a contiguous usable prefix of airtime rather than a scattered
      fraction that cannot air.

notes: |
  - Module-level `log = logging.getLogger(__name__)`.
  - Follow the project logging conventions in CLAUDE.md: DEBUG on entry and at
    every decision point, ERROR inside error handlers.
  - Builtin generics only in annotations. Do NOT import from `typing`; the
    current module imports List/Dict/Optional and this rewrite should not.
  - `vocab` is a `vocabulary.Vocabulary`. Use its public methods, not its
    frozensets.
  - `pack` is an `app/campaign/pack.py` CampaignPack, read-only.
  - Do NOT modify anything under `app/`.
  - No network calls and no file I/O anywhere in this module.
  - Do NOT keep `parse_chapters`, `validate_chapters`, `build_chapter_prompt`,
    `build_slot_prompt`, `SYSTEM_PROMPT_CHAPTERS` or `SYSTEM_PROMPT_SLOTS` as
    aliases. They are gone; leaving shims would let a stale caller keep
    working against the flat model.
  - Do NOT read `config["segment"]["chapters_per_segment"]` anywhere. It has
    been removed from generation.yaml and replaced by the `tree:` block.
