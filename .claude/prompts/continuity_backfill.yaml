    ambient: true
    continuity_in: The party is traveling together, and one of them carries the half-signet-ring.
  the-vault:
    ambient: false
    continuity_in: The party has learned they are the Letos, an ancient family charged with protecting
      reality. Grovley has revealed the secret vault in the subbasement.
    continuity_out: The party has entered the vault and accepted the duty of containing the shape. Chadwick
      holds half a signet ring, the other half with their betrayer.
  vigil-almost-jokes:
    ambient: true
    continuity_in: The party is traveling together.
  vigil-tracks:
    ambient: true
    continuity_in: The party is traveling together on a road.
  vigil-watches-longer:
    ambient: true
    continuity_in: The party is traveling together and taking turns keeping watch.
  weather-argument:
    ambient: true
    continuity_in: The party is travelling together on a road.
