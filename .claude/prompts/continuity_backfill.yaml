model: hermes3:70b
scenes:
  Leena-almost:
    ambient: true
    continuity_in: The party is traveling together when Leena notices something familiar that should not
      be.
  Vigil-counts:
    ambient: true
    continuity_in: The party is together in an unfamiliar location.
  after-the-choice:
    ambient: true
    continuity_in: The party is traveling together, having recently made a difficult decision that weighs
      on them.
  amulet-map:
    ambient: false
    continuity_in: The party has been invited to a treasure hunt and received a map with one mark on it.
      They are at the starting point, the Malvakar monument.
    continuity_out: The party knows there are nine dungeons to explore, with riddles at each, and the
      map will fill in as they solve them. They have deciphered the first riddle and know they are looking
      for something that happens exactly twice, forever.
  bahadur-revealed:
    ambient: false
    continuity_in: The party has opened a tear in the air and encountered a Bahadur. They are familiar
      with runes and can recognize a Bahadur when they see one.
    continuity_out: The party has been addressed by the Bahadur, which speaks of Muad'Malik and a door
      that has been prepared for ten thousand years. The tear in the air has stopped widening.
  bahadur-sighted:
    ambient: true
    continuity_in: The party is traveling together through a forest.
  before-the-well:
    ambient: true
    continuity_in: The party travels together toward a moonwell, feeling unspoken dread.
