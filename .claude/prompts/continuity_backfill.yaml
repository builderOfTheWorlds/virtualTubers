    ambient: true
    continuity_in: The party is traveling together on a cart or wagon.
  burn-it-down:
    ambient: false
    continuity_in: The party is trapped in a burning manor with no clear escape route. They have heard
      a spell being cast but do not know its full effects.
    continuity_out: The party has survived the manor's collapse and discovered the old butler alive but
      grieving over a body in the servants' quarters.
  camp-fire:
    ambient: true
    continuity_in: The party is traveling together and has stopped to rest for the night.
  carrying-the-signet:
    ambient: true
    continuity_in: The party is traveling together and one of them carries a half-signet-ring.
