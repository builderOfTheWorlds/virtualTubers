# Twitch login per broadcast worker, read by scripts/golive_watchdog.py for the external live check.
# Key = worker id (WORKER_ID). A null (or empty) login means "skip the Twitch check for this worker".
# Fill in the nulls once the user has confirmed the logins (non-secret); no restart needed, the
# watchdog re-reads this file every pass.
#
# probe: a channel that is live 24/7. If it reads offline the Twitch check itself is distrusted
# for that pass and the watchdog does nothing (GQL has returned null for everyone before).
probe: lofigirl
