
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Artifact Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/data?run={{ artifact.pack }}">← Back to Data Viewer</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">
                <span class="badge bg-info text-dark">{{ artifact.kind }}</span>
                {{ artifact.segment_id or '' }}
            </h5>
        </div>
        <div class="card-body">
            <p><strong>Run:</strong> {{ artifact.pack }}</p>
            <p><strong>Job:</strong> {{ artifact.job_id or '—' }}</p>
            <p><strong>Updated:</strong> {{ artifact.updated_at }}</p>
            <hr>
            <h6>Content</h6>
            <pre class="bg-dark text-white p-3 rounded" style="max-height: 70vh; overflow:auto;"><code>{{ artifact.content | tojson(indent=2) }}</code></pre>
        </div>
    </div>
</div>
</body>
</html>
