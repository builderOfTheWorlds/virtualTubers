<tr id="replay-row-{{ replay.name }}">
  {% if replay.error %}
    <td class="mono">{{ replay.name }}</td>
    <td colspan="5"><span class="badge err">{{ replay.error }}</span></td>
  {% else %}
    <td class="mono">{{ replay.name }}</td>
    <td>{{ replay.project | default("") }}</td>
    <td>{{ replay.date | default("") }}</td>
    <td>{{ replay.event_count | default("") }}</td>
    <td>{{ replay.byte_size | default("") }}</td>
    <td>{{ replay.uploaded_by | default("") }}</td>
  {% endif %}
  <td class="actions">
    <button class="btn"
      hx-get="/replays/{{ replay.name }}/view" hx-target="#replay-view" hx-swap="innerHTML">View</button>
    <form class="inline-form" style="display:inline"
          hx-post="/replays/{{ replay.name }}/play" hx-target="#replays-section" hx-swap="outerHTML">
      <button class="btn ok" type="submit"
        hx-confirm="Play {{ replay.name }} on every stream — all 6 character channels plus the roundtable?">Play</button>
    </form>
    <button class="btn danger"
      hx-post="/replays/{{ replay.name }}/delete" hx-target="closest tr" hx-swap="outerHTML"
      hx-confirm="Delete replay {{ replay.name }}? This removes it from the Rerun Theater library.">Delete</button>
  </td>
</tr>
