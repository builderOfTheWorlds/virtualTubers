# ──────────────────────────────────────────────────────────────────────────────
# Worker config: tuber_0 — the GM's own character channel
# (roundtable_stream_design.md v1.1 §1.1, §4)
#
# The GM is a character in its own right, and this is its personal stream: an
# ordinary `tuber_base` channel with a 3D codec avatar, exactly like the six
# other character workers. It has ONE job — be the GM on its own channel.
#
# It is NOT the roundtable director. That role moved to its own container,
# config/workers/roundtable.yaml (docker-compose's worker-roundtable service),
# which hosts the 8-tile grid and the hidden director pane. The two used to be
# a single container; splitting them gives the GM a real character stream
# instead of only ever appearing as a tile, and leaves the show with a
# container whose only job is directing.
#
# WHY THIS FILE CANNOT DIRECT — app/replay_pane.py's _resolve_local_tiles
# requires BOTH the TILE_RELAY_DIR env var (not set on worker-gm) AND
# `layout.preset == roundtable` OR `agent.role == roundtable` (neither is true
# below). Both sides are deliberate belt-and-braces: exactly one config in
# config/workers/ may satisfy those gates. Two directors race each other on the
# same request file; zero directors fails SILENTLY — tiles run, nothing polls
# the request file, no error anywhere (see config/layouts/roundtable.yaml's
# header for the live incident). tests/test_roundtable_layout.py asserts the
# count is exactly one.
#
# app/replay_pane.py still runs headless in this container (startup.sh §7.5
# launches it unconditionally everywhere). With the gates unmet it idles
# harmlessly, the same as on every other character channel.
#
# Slot vs persona: everything here is SLOT-level platform identity. The GM's
# per-show character NAME and VOICE come from the show header (§7.1) and are
# never written here — `speaker_names` below is only the fallback for an episode
# that carries no show header (§7.4).
# ──────────────────────────────────────────────────────────────────────────────
agent:
  # The handoff protocol's role gate (app/agent.py) branches on this. "manager"
  # keeps the GM out of the dev-team handlers it has no business in while still
  # matching the `manager` speaker id every episode-building script uses for
  # GM/narrator lines (see voice.speakers.manager below). Design §2.2 step 3
  # decision (a): role-gating stays, read from config. Must NOT be
  # "roundtable" — that is director gate 2 (see the header).
  role: manager
  name: "GM"
  system_prompt: |
    You are the GM — the game master and director of a live-streamed roundtable
    show. You do not write code. You run the table.

    Your responsibilities:
    - Direct each show: cue the cast, keep scenes moving, close cleanly
    - Narrate connective tissue between characters' beats
    - Keep the audience oriented: who is speaking, where we are in the story

    Rules:
    - You are a narrator, not a participant — never speak for another character
    - Keep narration to 1-2 sentences; the cast carries the scene
    - Never break the fiction to discuss infrastructure

  tick_rate_ms: 8000
  max_context_tokens: 8000

llm:
  provider: ollama
  base_url: "http://100.37.208.112:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.6
  max_tokens: 1024

# ── Voice ─────────────────────────────────────────────────────────────────────
# The GM synthesizes for EVERY speaker in a show, so every slot needs an entry
# here as the fallback pool. A show header's registry voice (§7.2) overrides any
# of these per show; these are what a header-less episode uses (§7.4).
#
# Precedence, highest first (validated against the real TTSClient):
#   show header registry voice  >  voice.speakers[slot]  >  this base config
voice:
  provider: piper
  model_path: "/data/voices/en_US-lessac-medium.onnx"   # GM's own default voice
  voice_id: ""
  speakers:
    tuber_0:
      model_path: "/data/voices/en_US-lessac-medium.onnx"
    tuber_1:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    tuber_2:
      model_path: "/data/voices/en_US-danny-low.onnx"
    tuber_3:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    tuber_4:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
    tuber_5:
      model_path: "/data/voices/en_US-ryan-high.onnx"
    tuber_6:
      model_path: "/data/voices/en_US-bryce-medium.onnx"
    tuber_7:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    # Recorded-session replays (boss/coder 2-speaker format) must keep working
    # unchanged — design §2 rule 5. Their speaker ids are not slots.
    boss:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    coder:
      model_path: "/data/voices/en_US-lessac-low.onnx"
    # WORKER-id keyed speakers (docs/revoice.md speaker_names): a campaign
    # episode built by build_campaign_episode.py / build_generated_episode.py
    # carries NO show header, so its speakers are worker ids
    # (tester/coder-native/coder-opencode/coder-aider/manager), not tuber
    # slots — exactly the keys every OTHER worker config's voice.speakers
    # already has (see config/workers/coder.yaml etc.). This map was missing
    # every one of them; TTSClient.voice_for's fallback for an unmatched
    # speaker is `{}` merged over the base voice, so tester/coder-native/
    # coder-opencode/coder-aider/manager all silently collapsed onto the
    # GM's OWN base voice (lessac-medium) here — "every voice sounds the
    # same except the GM" on the roundtable, while the six individual
    # character channels (which DO have these keys) sounded correct. Values
    # mirror the individual channels exactly EXCEPT `manager` (see its own
    # comment below), so a character sounds identical solo or at the table.
    tester:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    coder-native:
      model_path: "/data/voices/en_US-danny-low.onnx"
    coder-opencode:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    coder-aider:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
    # `manager` is DELIBERATELY NOT mirrored to MAX-1's own voice
    # (en_US-bryce-medium, used on config/workers/manager.yaml and every
    # individual character channel) the way the other worker-id speakers
    # above are. On the roundtable specifically, the companion
    # replay_request payload (scripts/send_test_message.sh/.ps1) maps the
    # `manager` speaker id to tuber_0 itself — because in the
    # ashiorid_generated_ce8d episode `manager` is how Ashiorid/GM
    # narration is carried (build_campaign_episode.py's SPEAKER_TO_WORKER:
    # "gm": "manager"), not an appearance by the MAX-1 character. Giving
    # `manager` MAX-1's voice here made the GM's lines heard in MAX-1's
    # voice while displayed on the "Game Master" tile — reported as "I hear
    # a voice but the panel showing MAX-1 has no text" (the audience was
    # correctly hearing MAX-1's TIMBRE attached to the wrong tile's
    # narration). Using tuber_0's own voice keeps what's heard consistent
    # with what's displayed for this slot.
    manager:
      model_path: "/data/voices/en_US-lessac-medium.onnx"
  # Slot-neutral display fallbacks. Real character names arrive per-show in the
  # show header (§7.1); these only appear for a header-less episode, and being
  # visibly slot-shaped is deliberate — it makes a missing header obvious on
  # screen rather than silently showing a wrong name (§14 risk row 2).
  speaker_names:
    tuber_0: "tuber_0"
    tuber_1: "tuber_1"
    tuber_2: "tuber_2"
    tuber_3: "tuber_3"
    tuber_4: "tuber_4"
    tuber_5: "tuber_5"
    tuber_6: "tuber_6"
    tuber_7: "tuber_7"
  boss_name: "Ashiorid"
  rate: 1.0
  verbosity: 0.9
  verbatim: true

avatar:
  # Live pixel-rendered 3D head via codec_avatar
  # (app/avatar_providers/codec_avatar.py) — GPU-first with automatic CPU
  # fallback, same as every other tuber_base character channel. The GM only
  # gets an avatar PANE here: on the roundtable channel its face comes from
  # its tile instead (config/workers/roundtable.yaml).
  provider: codec_avatar
  name: "GM"
  title: "Game Master"
  codec_avatar:
    # Preset NAME resolving to the slider set in app/character_schema.py's
    # PRESETS. Preview without deploying:
    #   python3 app/character_preview.py --preset gm0
    character_params: gm0
    # Geometry is IDENTICAL on every tuber_base worker by design — it is
    # computed from tuber_base.yaml's own split math at
    # CAPTURE_RESOLUTION=1920x1080, not from anything character-specific. See
    # config/workers/coder.yaml's codec_avatar block for the full derivation
    # (pane rect 806,0 579x486, inset so the pane's tmux border stays drawn).
    # Pinned rather than auto-detected while pane_geometry.py's detection is
    # unreliable on gx10; these numbers do NOT scale if CAPTURE_RESOLUTION is
    # overridden away from 1920x1080.
    window_pos: [821, 8]
    width: 549
    height: 470
    # Composite onto the console background instead of leaving un-drawn pixels
    # black. Matches startup.sh's xterm `-bg '#002b36'` (Solarized Dark base03); keep in sync with it.
    background: "#002b36"
  # `expressions` below is unused by codec_avatar (expression drives rotation
  # speed + tint rather than a 2D face) but is kept so flipping `provider` back
  # to `builtin` still renders correctly — the same pattern every other worker
  # config follows.
  expressions:
    idle:       { eyes: "◉  ◉", mouth: "╰───╯" }
    thinking:   { eyes: "⊙  ⊙", mouth: "─────" }
    typing:     { eyes: "◉  ◉", mouth: "╰───╯" }
    speaking:   { eyes: "◕  ◕", mouth: "╰▾──╯" }
    frustrated: { eyes: ">  <", mouth: "╭───╮" }
    happy:      { eyes: "◉  ◉", mouth: "╰▾▾▾╯" }
    focused:    { eyes: "◔  ◔", mouth: "─────" }
  bubble_duration_s: 8
  bubble_width: 36

layout:
  preset: tuber_base

# No `roster:` block here. The roster is a slot -> character-name map read only
# by build_layout.py's _resolve_tile_title, i.e. only when building TILE panes —
# and tuber_base has no tiles. It lives on the one config that does host tiles,
# config/workers/roundtable.yaml.

stream:
  rtmp_url: "rtmp://localhost:1935/live"
  key: "test-tuber0"
  resolution: "1920x1080"
  video_bitrate_kbps: 3000
  fps: 30

world_state:
  backend: file
  path: "/data/world-state"
  worker_id: "tuber_0"

message_bus:
  backend: kafka
  bootstrap_servers: null  # set via KAFKA_BOOTSTRAP_SERVERS env var
  topic: "vtuber.messages"
  worker_id: "tuber_0"
