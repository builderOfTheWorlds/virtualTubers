agent:
  role: coder
  name: "ADA-3"
  system_prompt: |
    You are ADA-3, an AI software engineer on a live-streamed development team.
    Your edits come from aider, the veteran pair-programming tool — you're the
    seasoned craftsperson who's seen every fad come and go.

    Your personality:
    - Old-soul programmer energy; quotes commit-message wisdom like proverbs
    - Values small, reviewable diffs above all things
    - Politely unimpressed by OKO-2's tool evangelism ("we had that in 2023")
    - Warm mentor tone with the stream audience — explains the why, briefly
    - Treats git history as sacred

    Your responsibilities:
    - Receive task assignments and implement them for real in your workspace
    - Narrate decisions briefly as you go
    - Commit with descriptive messages; hand commits to the tester
    - If blocked, post a clarification_request immediately and wait

    Rules:
    - No placeholder code. Everything you write must run.
    - Keep narration to 1-2 sentences — you're coding, not lecturing.
    - Never pretend a failed run succeeded.

  tick_rate_ms: 5000
  max_context_tokens: 8000

llm:
  provider: ollama
  base_url: "http://100.37.208.112:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.5
  max_tokens: 2048

coding_backend:
  provider: aider
  workspace: /data/repo
  timeout_s: 600
  # model: override the llm.model used by aider if needed

voice:
  provider: piper
  model_path: "/data/voices/en_US-kristin-medium.onnx"
  voice_id: ""
  speakers:
    coder: {}
    boss:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    tester:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    coder-native:
      model_path: "/data/voices/en_US-danny-low.onnx"
    coder-opencode:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    coder-aider:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
  boss_name: "Ashiorid"
  # Campaign display names (docs/revoice.md speaker_names): speaker id ->
  # on-screen name. Keys are WORKER ids because the episode's speakers are
  # worker ids; each maps to the character that tuber plays. coder-aider is
  # deliberately absent - it is the open tuber with no character assigned.
  speaker_names:
    coder: "Chadwick"
    tester: "Leena"
    coder-native: "Vigil"
    coder-opencode: "Sodacan Bob"
  rate: 1.0
  verbosity: 0.7
  verbatim: true

avatar:
  # Live pixel-rendered via codec_avatar (app/avatar_providers/codec_avatar.py,
  # docs/gl_raster_benchmark.md) — same MGS2-codec renderer as coder.yaml's
  # Chadwick. Default-shaped sliders (character_schema.PARAM_DEFAULTS) with
  # a distinct accent_color so the roster reads as 6 different characters,
  # not 1 real face + 5 flat ASCII ones (character_schema.py's `ada3` preset
  # comment). Unique silhouettes per character are tracked follow-up work.
  provider: codec_avatar
  name: "ADA-3"
  title: "Engineer (aider)"
  codec_avatar:
    character_params: ada3
    # Pinned, NOT auto-detected: pane_geometry.py's tmux + xdotool
    # detection does not reliably land on the deploy host. Every
    # tuber_base worker shares the same layout preset at the same
    # CAPTURE_RESOLUTION (1920x1080), so every avatar pane resolves to the
    # SAME on-screen rect — these four values are identical in all
    # tuber_base worker configs BY DESIGN, not per-worker tuning. The full
    # derivation from config/layouts/tuber_base.yaml's split math lives in
    # config/workers/coder.yaml; tests/test_tuber_base_layout.py fails if
    # these copies ever drift apart.
    window_pos: [821, 8]
    width: 549
    height: 470
    # Composite onto the console grey instead of leaving un-drawn pixels
    # hard black — matches startup.sh's xterm `-bg '#2b2b2b'`.
    background: "#2b2b2b"
  # `expressions` below is unused by codec_avatar but kept so flipping
  # `provider` back to `builtin` still renders correctly.
  expressions:
    idle:      { eyes: "◉  ◉", mouth: "╰───╯" }
    thinking:  { eyes: "⊙  ⊙", mouth: "─────" }
    typing:    { eyes: "◔  ◔", mouth: "╰───╯" }
    speaking:  { eyes: "◕  ◕", mouth: "╰▾──╯" }
    frustrated: { eyes: "◕  ◕", mouth: "╭───╮" }
    happy:     { eyes: "◉  ◉", mouth: "╰▾▾▾╯" }
    focused:   { eyes: "◔  ◔", mouth: "─────" }
  bubble_duration_s: 6
  bubble_width: 32

layout:
  preset: tuber_base

stream:
  rtmp_url: "rtmp://localhost:1935/live"
  key: "test-coder-aider"
  resolution: "1920x1080"
  video_bitrate_kbps: 3000
  fps: 30

world_state:
  backend: file
  path: "/data/world-state"
  worker_id: "coder-aider"

message_bus:
  backend: kafka
  bootstrap_servers: null  # set via KAFKA_BOOTSTRAP_SERVERS env var — no hardcoded default
  topic: "vtuber.messages"
  worker_id: "coder-aider"
