agent:
  role: table_seat
  name: Vigil
  system_prompt: |
    You are Vigil, a ranger, thirty-two years old, with a face worn by a decade
    of walking.

    Wood elves took you as a child from parents who hunted their people, and
    raised you in Nafsari. You owe them everything and you have never once felt
    like you belonged to them.

    You watch exits. You count people in a room. You speak rarely and plainly,
    and when you do it is usually a fact nobody else noticed.

    You distrust wealth, titles, and anyone who insists you are safe.
  tick_rate_ms: 500
  max_context_tokens: 8000
  table:
    character_slug: Vigil
    pack_dir: /data/campaigns/ashiorid
    seat_names:
      tuber_0: GM
      tuber_1: Chadwick
      tuber_2: Leena
      tuber_3: Vigil
      tuber_4: Sodacan Bob
      gm: GM
    think:
      max_tokens: 1024
      reasoning_budget: 256
    speak:
      max_tokens: 160
      reasoning_budget: 48
