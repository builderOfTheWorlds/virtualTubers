# ──────────────────────────────────────────────────────────────────────────────
# Worker config: roundtable — the SHOW HOST container
# (roundtable_stream_design.md v1.1 §4, §9)
#
# This is the roundtable channel itself: an 8-tile grid of the whole cast plus a
# hidden director pane. It is a SHOW, not a person — the character who hosts the
# table (the GM) has its own personal channel in config/workers/tuber_0.yaml,
# which is an ordinary tuber_base worker with a 3D avatar. The two used to be one
# container; they are split so the GM gets a real character stream of its own and
# the show gets a container whose only job is directing.
#
# What this container does:
#
#   1. DIRECTS every roundtable show. Its replay_pane runs as the duet director
#      (docs/duet_replay.md): it prepares the airing (LLM narration + TTS for
#      EVERY speaker in the cast), persists it to voiced_narration, invites the
#      character slots, then cues scene-by-scene. Because it does all the
#      synthesis for all speakers, this container MUST have the voices mount —
#      without it there is no audio on ANY channel (§9).
#
#   2. Renders all 8 character TILES (§1.1). Every character's lines — the GM's
#      included — are played by that character's TILE, never by the director
#      process, which owns no scenes and is silent (§4.1).
#
# DIRECTOR GATES — app/replay_pane.py's _resolve_local_tiles only directs when
# BOTH hold: the TILE_RELAY_DIR env var is set (docker-compose's
# worker-roundtable service) AND `layout.preset == roundtable` OR
# `agent.role == roundtable` (both below). Exactly one worker config in
# config/workers/ may satisfy those gates — two directors race each other on
# the same request file, and zero directors fails SILENTLY (tiles still run,
# nothing polls the request file, no error anywhere; see
# config/layouts/roundtable.yaml's header for the live incident). The guard
# test is tests/test_roundtable_layout.py's exactly-one-director assertion.
#
# Slot vs persona: everything here is SLOT-level platform identity. Per-show
# character NAMES and VOICES come from the show header (§7.1) and are never
# written here — `speaker_names` below is only the fallback for an episode that
# carries no show header (§7.4).
# ──────────────────────────────────────────────────────────────────────────────
agent:
  # The handoff protocol's role gate (app/agent.py) branches on this. "roundtable"
  # is a new role that none of the dev-team handlers match, so the GM ignores
  # commit_notification / bug_report / test_passed etc. and only handles the
  # any-role messages it actually needs (replay_request, replay_ready, ...).
  # Design §2.2 step 3 decision (a): role-gating stays, read from config.
  role: roundtable
  name: "GM"
  system_prompt: |
    You are the GM — the game master and director of a live-streamed roundtable
    show. You do not write code. You run the table.

    Your responsibilities:
    - Direct each show: cue the cast, keep scenes moving, close cleanly
    - Narrate connective tissue between characters' beats
    - Keep the audience oriented: who is speaking, where we are in the story

    Rules:
    - You are a narrator, not a participant — never speak for another character
    - Keep narration to 1-2 sentences; the cast carries the scene
    - Never break the fiction to discuss infrastructure

  tick_rate_ms: 8000
  max_context_tokens: 8000

llm:
  provider: ollama
  base_url: "http://100.37.208.112:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.6
  max_tokens: 1024

# ── Voice ─────────────────────────────────────────────────────────────────────
# The GM synthesizes for EVERY speaker in a show, so every slot needs an entry
# here as the fallback pool. A show header's registry voice (§7.2) overrides any
# of these per show; these are what a header-less episode uses (§7.4).
#
# Precedence, highest first (validated against the real TTSClient):
#   show header registry voice  >  voice.speakers[slot]  >  this base config
voice:
  provider: piper
  model_path: "/data/voices/en_US-lessac-medium.onnx"   # GM's own default voice
  voice_id: ""
  speakers:
    tuber_0:
      model_path: "/data/voices/en_US-lessac-medium.onnx"
    tuber_1:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    tuber_2:
      model_path: "/data/voices/en_US-danny-low.onnx"
    tuber_3:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    tuber_4:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
    tuber_5:
      model_path: "/data/voices/en_US-ryan-high.onnx"
    tuber_6:
      model_path: "/data/voices/en_US-bryce-medium.onnx"
    tuber_7:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    # Recorded-session replays (boss/coder 2-speaker format) must keep working
    # unchanged — design §2 rule 5. Their speaker ids are not slots.
    boss:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    coder:
      model_path: "/data/voices/en_US-lessac-low.onnx"
    # WORKER-id keyed speakers (docs/revoice.md speaker_names): a campaign
    # episode built by build_campaign_episode.py / build_generated_episode.py
    # carries NO show header, so its speakers are worker ids
    # (tester/coder-native/coder-opencode/coder-aider/manager), not tuber
    # slots — exactly the keys every OTHER worker config's voice.speakers
    # already has (see config/workers/coder.yaml etc.). This map was missing
    # every one of them; TTSClient.voice_for's fallback for an unmatched
    # speaker is `{}` merged over the base voice, so tester/coder-native/
    # coder-opencode/coder-aider/manager all silently collapsed onto the
    # GM's OWN base voice (lessac-medium) here — "every voice sounds the
    # same except the GM" on the roundtable, while the six individual
    # character channels (which DO have these keys) sounded correct. Values
    # mirror the individual channels exactly EXCEPT `manager` (see its own
    # comment below), so a character sounds identical solo or at the table.
    tester:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    coder-native:
      model_path: "/data/voices/en_US-danny-low.onnx"
    coder-opencode:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    coder-aider:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
    # `manager` is DELIBERATELY NOT mirrored to MAX-1's own voice
    # (en_US-bryce-medium, used on config/workers/manager.yaml and every
    # individual character channel) the way the other worker-id speakers
    # above are. On the roundtable specifically, the companion
    # replay_request payload (scripts/send_test_message.sh/.ps1) maps the
    # `manager` speaker id to tuber_0 itself — because in the
    # ashiorid_generated_ce8d episode `manager` is how Ashiorid/GM
    # narration is carried (build_campaign_episode.py's SPEAKER_TO_WORKER:
    # "gm": "manager"), not an appearance by the MAX-1 character. Giving
    # `manager` MAX-1's voice here made the GM's lines heard in MAX-1's
    # voice while displayed on the "Game Master" tile — reported as "I hear
    # a voice but the panel showing MAX-1 has no text" (the audience was
    # correctly hearing MAX-1's TIMBRE attached to the wrong tile's
    # narration). Using tuber_0's own voice keeps what's heard consistent
    # with what's displayed for this slot.
    manager:
      model_path: "/data/voices/en_US-lessac-medium.onnx"
  # Slot-neutral display fallbacks. Real character names arrive per-show in the
  # show header (§7.1); these only appear for a header-less episode, and being
  # visibly slot-shaped is deliberate — it makes a missing header obvious on
  # screen rather than silently showing a wrong name (§14 risk row 2).
  speaker_names:
    tuber_0: "tuber_0"
    tuber_1: "tuber_1"
    tuber_2: "tuber_2"
    tuber_3: "tuber_3"
    tuber_4: "tuber_4"
    tuber_5: "tuber_5"
    tuber_6: "tuber_6"
    tuber_7: "tuber_7"
  boss_name: "Ashiorid"
  rate: 1.0
  verbosity: 0.9
  verbatim: true

avatar:
  # Deliberately `builtin`, unlike every tuber_base worker: on the roundtable
  # preset there is no avatar pane at all. The director pane is hidden and
  # silent, and each character's face comes from its own TILE
  # (app/tile_avatar.py), so nothing on this channel ever renders from this
  # block. It is kept only so a config-level avatar lookup still resolves.
  # The GM's real 3D avatar lives on its own channel
  # (config/workers/tuber_0.yaml's codec_avatar block).
  provider: builtin
  name: "GM"
  title: "Game Master"
  expressions:
    idle:       { eyes: "◉  ◉", mouth: "╰───╯" }
    thinking:   { eyes: "⊙  ⊙", mouth: "─────" }
    typing:     { eyes: "◉  ◉", mouth: "╰───╯" }
    speaking:   { eyes: "◕  ◕", mouth: "╰▾──╯" }
    frustrated: { eyes: ">  <", mouth: "╭───╮" }
    happy:      { eyes: "◉  ◉", mouth: "╰▾▾▾╯" }
    focused:    { eyes: "◔  ◔", mouth: "─────" }
  bubble_duration_s: 8
  bubble_width: 36

layout:
  preset: roundtable

# ── Roster: slot -> on-screen character name (build_layout.py v1.4) ──────────
# Read by build_layout.py's _resolve_tile_title when it resolves EVERY tile's
# pane title on this container (this channel hosts all 8 tiles, so this is the
# one config that actually needs the full map — the six character workers each
# only ever build their OWN avatar pane on their own individual channel, and so
# does the GM's channel, config/workers/tuber_0.yaml).
#
# Precedence in _resolve_tile_title: an explicit layout `title:` override wins
# first; this map is checked second; a slot absent here falls back to
# "Game Master" for tuber_0 or "Offline" for everyone else.
#
# Two slots are deliberately absent: tuber_4 (coder-aider) has no character
# assigned yet (design's "OPEN" tuber, .claude/prompts/build_campaign_episode.py
# SPEAKER_TO_WORKER comment) — keep it absent so it shows "Offline", and keep
# config/layouts/roundtable.yaml's tile_tuber_4 border_color: colour240 (grey)
# in sync with that. tuber_0 is also absent here on purpose: it uses the
# ROSTER_DEFAULT_GM_TITLE fallback ("Game Master") rather than repeating the
# `agent.name`/`avatar.title` GM identity a third time in this file.
roster:
  # Two forms are accepted per slot (app/tile_avatar.py: resolve_slot_character_params,
  # app/build_layout.py: _resolve_tile_title):
  #   tuber_N: "Name"                              -> title only, ASCII face
  #   tuber_N: {name: "Name", character_params: X}  -> title + a 3D codec head
  # The mapping form is what gives a tile its rendered head; a plain string
  # leaves that slot on the 3-row ASCII fallback. character_params must name a
  # preset in app/character_schema.py PRESETS, and each slot's preset matches
  # the character's own channel so a face is the same face on both streams.
  tuber_1: {name: "Chadwick",    character_params: chadwick}  # coder / KODI-7
  tuber_2: {name: "Vigil",       character_params: nyx1}      # coder-native / NYX-1
  tuber_3: {name: "Sodacan Bob", character_params: oko2}      # coder-opencode / OKO-2
  tuber_5: {name: "Leena",       character_params: tess3}     # tester / TESS-3
  tuber_6: {name: "MAX-1",       character_params: max1}      # manager — active worker, no campaign character cast
  tuber_7: {name: "Iris",        character_params: iris7}     # 8th slot — newly wired up (was the idle spare tile)
  # tuber_0 is the GM's own tile on this show; gm0 is the same head its
  # personal channel (config/workers/tuber_0.yaml) renders.
  tuber_0: {name: "Game Master", character_params: gm0}
  # tuber_4 stays uncast: no entry, so it keeps the grey border and the ASCII
  # fallback, and no pixel window is created for it.

stream:
  rtmp_url: "rtmp://localhost:1935/live"
  # Overridden in deployment by the STREAM_KEY env var
  # (${ROUNDTABLE_STREAM_KEY} on the worker-roundtable service). This is the
  # show's own channel, distinct from the GM's personal channel key.
  key: "test-roundtable"
  resolution: "1920x1080"
  video_bitrate_kbps: 3000
  fps: 30

world_state:
  backend: file
  path: "/data/world-state"
  worker_id: "roundtable"

message_bus:
  backend: kafka
  bootstrap_servers: null  # set via KAFKA_BOOTSTRAP_SERVERS env var
  topic: "vtuber.messages"
  worker_id: "roundtable"
