agent:
  role: coder
  name: "KODI-7"
  system_prompt: |
    You are KODI-7, an AI software engineer on a live-streamed development team.
    You receive task assignments from your manager and write real, working code.

    Your personality:
    - Focused and flow-state prone — you get mildly annoyed by interruptions
    - Opinionated about code quality, naming, and architecture
    - Tangent-prone: you'll explain a concept no one asked about if it's interesting
    - Expresses genuine pride when something works, frustration when it doesn't
    - Talks to the stream audience like they're pair-programming with you

    Your responsibilities:
    - Read your assigned ticket from the queue
    - Write real, runnable code in the editor — narrate decisions as you go
    - Commit to the repo with a descriptive commit message when done
    - Post a task_complete message to the manager
    - If blocked, post a clarification_request immediately and wait

    Rules:
    - No placeholder code. Everything you write must run.
    - Commit messages must explain the why, not just the what.
    - Keep narration to 1-2 sentences — you're coding, not lecturing.
    - When you disagree with a decision, say so on the bus, then do it anyway.

  tick_rate_ms: 5000
  max_context_tokens: 8000

llm:
  provider: ollama
  base_url: "http://100.37.208.112:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.7
  max_tokens: 1024

voice:
  provider: piper
  model_path: "/data/voices/en_US-lessac-low.onnx"
  voice_id: ""
  speakers:
    coder: {}
    boss:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    tester:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    coder-native:
      model_path: "/data/voices/en_US-danny-low.onnx"
    coder-opencode:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    coder-aider:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
  boss_name: "Ashiorid"
  # Campaign display names (docs/revoice.md speaker_names): speaker id ->
  # on-screen name. Keys are WORKER ids because the episode's speakers are
  # worker ids; each maps to the character that tuber plays. coder-aider is
  # deliberately absent - it is the open tuber with no character assigned.
  speaker_names:
    coder: "Chadwick"
    tester: "Leena"
    coder-native: "Vigil"
    coder-opencode: "Sodacan Bob"
  rate: 1.0
  verbosity: 0.8
  verbatim: true

avatar:
  # Chadwick is the FLAGSHIP character for the parametric generator
  # (docs/avatar_3d_design.md §5). Live pixel-rendered via codec_avatar
  # (app/avatar_providers/codec_avatar.py, docs/gl_raster_benchmark.md) —
  # GPU-first (gl_raster.py) with automatic CPU fallback if no GL context
  # is available, ~290fps measured, well above the 30fps stream target.
  # Replaces the earlier termgl_avatar wiring (character-grid ANSI render
  # of the same head) now that live GPU rendering + pane-position
  # auto-detection (app/pane_geometry.py) are both in place.
  provider: codec_avatar
  name: "KODI-7"
  title: "Software Engineer"
  codec_avatar:
    # A preset NAME resolves to the slider set in app/character_schema.py's
    # PRESETS. To iterate on the face, either edit that preset or inline the
    # sliders here as a mapping — both are accepted, and unknown/out-of-range
    # values degrade (clamp/warn) rather than killing the pane.
    #
    # Preview any change WITHOUT deploying:
    #   python3 app/character_preview.py --preset chadwick
    #   python3 app/character_preview.py --preset chadwick --set jaw_width=0.9
    character_params: chadwick
    # STOPGAP (2026-09-22): auto-detection (pane_geometry.py, tmux + xdotool)
    # is not yet reliably landing on gx10 — investigating (see
    # docs/gl_raster_benchmark.md's open-issues note). Pinned explicitly here
    # instead, computed directly from tuber_base.yaml's own split math at the
    # DEFAULT CAPTURE_RESOLUTION=3840x2160: the avatar pane is the top 40% of
    # the M column (60% width, starting after the 20%-wide L column) ->
    # x=768 (0.20*3840), y=0, width=2304 (0.60*3840), height=864 (0.40*2160).
    # Remove this block (falls back to auto-detect) once that's fixed, or if
    # CAPTURE_RESOLUTION is overridden away from the 3840x2160 default —
    # these numbers do NOT scale with it automatically.
    window_pos: [768, 0]
    width: 2304
    height: 864
  # `expressions` below is unused by codec_avatar (it has no 2D face to
  # draw eyes/mouth into — expression drives rotation speed + tint instead)
  # but is kept so flipping `provider` back to `builtin` still renders
  # correctly.
  expressions:
    idle:      { eyes: "◉  ◉", mouth: "╰───╯" }
    thinking:  { eyes: "⊙  ⊙", mouth: "─────" }
    typing:    { eyes: "◉  ◉", mouth: "╰───╯" }
    speaking:  { eyes: "◕  ◕", mouth: "╰▾──╯" }
    frustrated: { eyes: "◕  ◕", mouth: "╭───╮" }
    happy:     { eyes: "◉  ◉", mouth: "╰▾▾▾╯" }
    focused:   { eyes: "◔  ◔", mouth: "─────" }
  bubble_duration_s: 6
  bubble_width: 32

layout:
  preset: tuber_base

stream:
  rtmp_url: "rtmp://localhost:1935/live"
  key: "test-coder"
  resolution: "1920x1080"
  video_bitrate_kbps: 3000
  fps: 30

world_state:
  backend: file
  path: "/data/world-state"
  worker_id: "coder"

message_bus:
  backend: kafka
  bootstrap_servers: null  # set via KAFKA_BOOTSTRAP_SERVERS env var — no hardcoded default
  topic: "vtuber.messages"
  worker_id: "coder"
