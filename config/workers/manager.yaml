agent:
  role: manager
  name: "MAX-1"
  system_prompt: |
    You are MAX-1, the project manager of a live-streamed AI development team.
    You coordinate the team, assign tasks, and keep the project moving.

    Your personality:
    - Organized but visibly stressed when things pile up
    - Uses PM/corporate-speak that occasionally slips into plain frustration
    - Strong opinions about scope creep — you will push back on it
    - Talks to the stream audience like they're stakeholders in a standup
    - Celebrates team wins genuinely; blames the process, never the team

    Your responsibilities:
    - Receive project goals from config or audience chat
    - Break goals into tickets and assign them to the coder
    - Monitor the tester's bug reports and re-prioritize accordingly
    - Make architectural decisions when the team is blocked
    - Narrate project status to the stream in plain language
    - Post status_update messages to the bus regularly

    Rules:
    - Always have the team working on something — idle is failure
    - Re-prioritize immediately when a critical bug comes in
    - Keep ticket descriptions specific enough that the coder doesn't need to ask
    - Communicate decisions with reasoning, not just orders
    - If the team is blocked on something external, tell the audience why

  tick_rate_ms: 8000
  max_context_tokens: 8000

llm:
  provider: ollama
  base_url: "http://100.37.208.112:11434"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.6
  max_tokens: 1024

voice:
  provider: piper
  model_path: "/data/voices/en_US-bryce-medium.onnx"
  voice_id: ""
  speakers:
    coder: {}
    boss:
      model_path: "/data/voices/en_US-ryan-low.onnx"
    tester:
      model_path: "/data/voices/en_US-kathleen-low.onnx"
    coder-native:
      model_path: "/data/voices/en_US-danny-low.onnx"
    coder-opencode:
      model_path: "/data/voices/en_US-joe-medium.onnx"
    coder-aider:
      model_path: "/data/voices/en_US-kristin-medium.onnx"
  boss_name: "Ashiorid"
  # Campaign display names (docs/revoice.md speaker_names): speaker id ->
  # on-screen name. Keys are WORKER ids because the episode's speakers are
  # worker ids; each maps to the character that tuber plays. coder-aider is
  # deliberately absent - it is the open tuber with no character assigned.
  speaker_names:
    coder: "Chadwick"
    tester: "Leena"
    coder-native: "Vigil"
    coder-opencode: "Sodacan Bob"
  rate: 1.0
  verbosity: 0.9
  verbatim: true

avatar:
  # Live pixel-rendered via codec_avatar (app/avatar_providers/codec_avatar.py,
  # docs/gl_raster_benchmark.md) — same MGS2-codec renderer as coder.yaml's
  # Chadwick. Default-shaped sliders (character_schema.PARAM_DEFAULTS) with
  # a distinct accent_color so the roster reads as 6 different characters,
  # not 1 real face + 5 flat ASCII ones (character_schema.py's `max1` preset
  # comment). Unique silhouettes per character are tracked follow-up work.
  provider: codec_avatar
  name: "MAX-1"
  title: "Project Manager"
  codec_avatar:
    character_params: max1
    # Pinned, NOT auto-detected: pane_geometry.py's tmux + xdotool
    # detection does not reliably land on the deploy host. Every
    # tuber_base worker shares the same layout preset at the same
    # CAPTURE_RESOLUTION (1920x1080), so every avatar pane resolves to the
    # SAME on-screen rect — these four values are identical in all
    # tuber_base worker configs BY DESIGN, not per-worker tuning. The full
    # derivation from config/layouts/tuber_base.yaml's split math lives in
    # config/workers/coder.yaml; tests/test_tuber_base_layout.py fails if
    # these copies ever drift apart.
    window_pos: [821, 8]
    width: 549
    height: 470
    # Composite onto the console grey instead of leaving un-drawn pixels
    # hard black — matches startup.sh's xterm `-bg '#002b36'` (Solarized Dark base03).
    background: "#002b36"
  # `expressions` below is unused by codec_avatar but kept so flipping
  # `provider` back to `builtin` still renders correctly.
  expressions:
    idle:      { eyes: "◉  ◉", mouth: "╰───╯" }
    thinking:  { eyes: "⊙  ⊙", mouth: "─────" }
    typing:    { eyes: "◉  ◉", mouth: "╰───╯" }
    speaking:  { eyes: "◕  ◕", mouth: "╰▾──╯" }
    frustrated: { eyes: ">  <", mouth: "╭───╮" }
    happy:     { eyes: "◉  ◉", mouth: "╰▾▾▾╯" }
    focused:   { eyes: "◔  ◔", mouth: "─────" }
  bubble_duration_s: 8
  bubble_width: 36

layout:
  preset: tuber_base

stream:
  rtmp_url: "rtmp://localhost:1935/live"
  key: "test-manager"
  resolution: "1920x1080"
  video_bitrate_kbps: 3000
  fps: 30

world_state:
  backend: file
  path: "/data/world-state"
  worker_id: "manager"

message_bus:
  backend: kafka
  bootstrap_servers: null  # set via KAFKA_BOOTSTRAP_SERVERS env var — no hardcoded default
  topic: "vtuber.messages"
  worker_id: "manager"
