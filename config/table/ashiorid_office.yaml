# Live agent table: ashiorid_office — build plan P5.3 ("the pack-agnostic claim": the office
# runs on the SAME table code as the D&D pack; only this file differs).
#
#   .venv/bin/python scripts/build_table_configs.py config/table/ashiorid_office.yaml \
#       --out config/workers/table/ashiorid_office
#   docker compose -f docker-compose.yml -f docker-compose.office.yml \
#       -f docker-compose.table-office.yml up -d
#
# The CEO is the table's GM (tuber_0). The Party Member (tuber_7) is seated (its channel
# and tile stay up) but never in active_players: it never speaks (U1, silent observer).
pack: ashiorid_office
pack_dir: /data/campaigns/ashiorid_office
gm_slug: ceo
gm_seat: tuber_0

seats:     # service <-> seat <-> persona: docker-compose.office.yml header
  - {seat: tuber_0, slug: ceo,            base: config/workers/office/ceo.yaml,            service: worker-gm}
  - {seat: tuber_1, slug: tech_lead,      base: config/workers/office/tech_lead.yaml,      service: worker-manager}
  - {seat: tuber_2, slug: analyst,        base: config/workers/office/analyst.yaml,        service: worker-coder-native}
  - {seat: tuber_3, slug: engineer,       base: config/workers/office/engineer.yaml,       service: worker-coder-aider}
  - {seat: tuber_4, slug: tester,         base: config/workers/office/tester.yaml,         service: worker-tester}
  - {seat: tuber_5, slug: marketing,      base: config/workers/office/marketing.yaml,      service: worker-coder-opencode}
  - {seat: tuber_6, slug: office_manager, base: config/workers/office/office_manager.yaml, service: worker-coder}
  - {seat: tuber_7, slug: party_member,   base: config/workers/office/party_member.yaml,   service: worker-observer}

active_players: [tuber_1, tuber_2, tuber_3, tuber_4, tuber_5, tuber_6]
silent_seats: [tuber_7]

# The office profiles carry no lore stems; every seat knows the company basics.
common_lore: [company, office, org_chart, product, rituals]

# Operator control (app/table/control.py, scripts/table_ctl.py, control panel "Live table"):
# manual = the GM waits for a scene_request after boot and goes idle after each scene;
# auto = plays by itself from the persisted position (else start_index). The week run is
# unattended: auto resumes by itself after any GM restart (position file: played set, story
# log, ambient history), no table_run_start needed. Operator controls still work.
start_mode: auto
tick_rate_ms: 500
run_id: ashiorid_office_20260929_135927_9c1b
contracts_fixture: /data/table/fixtures/ashiorid_office_20260929_135927_9c1b.json
# WEEK RUN (operator): the 28-block week run id goes HERE, as the only edit. While set, the
# generator replaces run_id, points contracts_fixture at /data/table/fixtures/<week>.json (export
# it first: scripts/export_table_fixture.py <week>; the GM container needs no generator-DB
# credentials for the story), drops skip_scenes (curated for the old run) and gives the run its
# own position_file, so the old run's story log cannot seed the week.
# Keep null until told; the old run above keeps playing.
week_run_id: null
only_with_active_players: true
start_index: 0
max_scenes: null   # no cap: auto play runs to the end of the story or table_run_start duration_min

# Office loop fix (2026-10-10, .claude/prompts/ashiorid_office_loop_fix_plan.md).
# Story memory: the GM + seats see what already happened (persisted in the position file).
story_log: true
story_max_entries: 6         # GM context
story_max_chars: 2500
story_seat_max_entries: 4    # seat prompts
story_seat_max_chars: 800
# Contract filters (load time, logged per drop). The planner retells the same events in
# sibling leaves; collapse drops a leaf whose slots mostly repeat earlier kept leaves.
dedupe_canon_goal: true
collapse_redundant_leaves: true
collapse_leaf_threshold: 0.5     # slot goal word-set similarity that counts as a repeat
collapse_leaf_min_share: 0.5     # share of a leaf's slots that must repeat to drop it
dedupe_near_threshold: 0.6       # near-duplicate single slots (vs the last 8 kept)
dedupe_near_window: 8
# Paraphrased retellings the word filters cannot see (word overlap of real repeats is
# 0.25-0.53, same range as distinct scenes). Flagged by the local model, reviewed by hand
# 2026-10-10. Scene ids are per run_id: rebuild this list when run_id changes.
skip_scenes:
  - off-hours-arc.off-hours-arc-n0-n1.off-hours-arc-n0-n1-001          # 2nd Office Manager arrival
  - off-hours-arc.off-hours-arc-n1.off-hours-arc-n1-002                # 3rd arrival
  - off-hours-arc.off-hours-arc-n1.off-hours-arc-n1-003                # setup again
  - first-standup-arc.first-standup-arc-n0.first-standup-arc-n0-001    # "team gathers" (n0-002 adds the directive)
  - first-standup-arc.first-standup-arc-n1-n0.first-standup-arc-n1-n0-002   # requirements again
  - first-standup-arc.first-standup-arc-n1-n1.first-standup-arc-n1-n1-001   # tech plan again
  - first-standup-arc.first-standup-arc-n1-n1.first-standup-arc-n1-n1-002   # tech plan again
  - build-arc.build-arc-n1.build-arc-n1-001                            # 2nd lunch
  - build-arc.build-arc-n1.build-arc-n1-002                            # analyst review again
  - ship-arc.ship-arc-n0-n1.ship-arc-n0-n1-003                         # early wind-down (n1-004 closes the day)
  - ship-arc.ship-arc-n1.ship-arc-n1-002                               # release notes drafted again
# Cross-scene repeats: a seat line sharing a 6-word run with the last 2 scenes is
# retaken; a GM opening like one of the last 3 scenes' is asked for once more.
cross_scene_repeat: {scenes: 2, ngram: 6, gm_scenes: 3, gm_threshold: 0.5}
# The narration's "you" is the silent Party Member: a GM direction giving "you" a spoken
# line ('"Fair?" you ask') is asked for again, then rejected (live run 2026-10-10).
gm_silent_you: true

# Long unattended runs (see TableRuntime). No auto_duration_s: the week ends with its last
# block (block_clock.end_after_last_block_s), not on a timer.
auto_pace: {words_per_s: 2.9, per_line_s: 2.2, lead_s: 25}   # models the voice queue (copied from ashiorid.yaml)
auto_skip_stuck: true
auto_max_consecutive_stuck: 3     # then: cool down, ambient, carry on (never halts under block_clock)
auto_stuck_cooldown_s: 300        # doubles per further stuck scene, up to the max
auto_stuck_cooldown_max_s: 1800
scene_max_s: 1800                 # watchdog: a scene running longer than this counts as stuck

# GOLIVE WEEK (.claude/prompts/golive_20261024_plan.md D1/A1-A3): each arc segment (order 0..27)
# is a 6 h block in its real wall-clock window. The block's spine contracts play first (leftovers
# of an earlier block carry over), then plot-free AMBIENT scenes until the window ends. Before
# `anchor` (prelude from 2026-10-24 20:00) and after the last block: ambient only, forever.
# offset_s shifts the clock for soak tests (offset_s: N makes "now" = real now + N).
block_clock:
  anchor: '2026-10-25T00:00:00-04:00'      # block 0 = Sunday 00:00-06:00
  block_hours: 6
  prelude_from: '2026-10-24T20:00:00-04:00'
  offset_s: 0
  tz: America/New_York                     # day phases follow the local hour
  spine_max_attempts: 2                    # a spine scene that got stuck/interrupted is retried once
  spine_gap_s: 0                           # idle gap before a spine scene
  end_after_last_block_s: null             # null = the run never ends

# Ambient filler (app/table/ambient_source.py). Pool: pack_scenes rows with ambient: true in the
# generator DB (promotion stays a user step, plan A4) plus an optional YAML dir for staging/soak.
ambient:
  postgres: true
  pack: ashiorid_office
  dir: null                  # e.g. a mounted copy of .claude/prompts/office_ambient_stage
  reload_s: 900
  no_repeat_s: 172800        # an ambient scene does not air again within 48 h (when the pool allows)
  rounds: {normal: 2, quiet: 1}      # off_hours and intensity: quiet scenes use the quiet rounds
  story_log: short           # short = one clipped plot-free line (separate small budget); none = nothing
  gap_s:                     # idle seconds between scenes, [min, max] drawn at random; quiet nights
    off_hours: [60, 180]
    morning: [15, 45]
    workday: [10, 30]
    evening: [20, 60]
    default: 15

think_s: 60
speak_s: 45
gm_blocks_order: [truth, secrets, unlocks, table_rules, style]
# Loop mechanics are never character knowledge (office BANNED_WORDS); never in the CEO's narration.
gm_forbidden_phrases: [time loop, the loop, simulation, simulated]

think:      {max_tokens: 1024, reasoning_budget: 256}
speak:      {max_tokens: 160,  reasoning_budget: 48}
direct:     {max_tokens: 768,  reasoning_budget: 384}
adjudicate: {max_tokens: 512,  reasoning_budget: 64}   # 256 cut the JSON (office run 2026-10-08)
overrule:   {max_tokens: 160,  reasoning_budget: 48}

roundtable:
  base: config/workers/office/roundtable.yaml      # office voices + speaker names already set
  service: worker-roundtable
  live:
    enabled: true
    table_arbiter: tuber_0
    observer_slot: tuber_7
    max_age_s: 1800         # backstop only: auto_pace keeps the queue short. 120 dropped Nora (2026-10-08)
    consume_timeout_s: 20
    line_gap_s: 0.5
    spool_max: 200
  voices: {}

gm_generator_db: true        # GENERATOR_POSTGRES_* env on worker-gm (ambient pool from pack_scenes)

compose_base: [docker-compose.office.yml]
compose_overlay: docker-compose.table-office.yml

llm:
  provider: vllm
  model: table-agents
  base_url: http://host.docker.internal:8092
  api_key_env: VLLM_API_KEY
  temperature: 0.7
  max_tokens: 1024
  extra_body:
    presence_penalty: 1.0
