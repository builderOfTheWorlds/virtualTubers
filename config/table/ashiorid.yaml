# Live agent table: ashiorid (D&D) — build plan P3.7.
#
# Source for scripts/build_table_configs.py, which writes config/workers/table/<slug>.yaml
# (one per seat) from the existing SLOT configs (voice/avatar/stream stay the slot's).
# Pack-agnostic: the office table is a second file like this one (P5.3).
pack: ashiorid
pack_dir: /data/campaigns/ashiorid          # mounted read-only in docker-compose.table.yml
gm_slug: gm
gm_seat: tuber_0

# seat -> cast id, slot config it is built on, compose service (seat order == turn order)
seats:
  - {seat: tuber_0, slug: gm,          base: config/workers/tuber_0.yaml,      service: worker-gm}
  - {seat: tuber_1, slug: chadwick,    base: config/workers/manager.yaml,      service: worker-manager}
  - {seat: tuber_2, slug: Leena,       base: config/workers/coder-native.yaml, service: worker-coder-native}
  - {seat: tuber_3, slug: Vigil,       base: config/workers/coder-aider.yaml,  service: worker-coder-aider}
  - {seat: tuber_4, slug: sodacan_bob, base: config/workers/tester.yaml,       service: worker-tester}

# P5.1: every player seat (the P3.7 slice was GM + Chadwick only).
active_players: [tuber_1, tuber_2, tuber_3, tuber_4]

# Operator control (app/table/control.py, scripts/table_ctl.py, control panel "Live table"):
# manual = the GM waits for a scene_request after boot and goes idle after each scene;
# auto = plays max_scenes by itself from the persisted position (else start_index).
start_mode: auto
# Fresh position per story run: a stale index from an older run would skip the opening.
position_file: /data/world-state/table_ashiorid_e309_position.json
tick_rate_ms: 500            # every GM<->seat hop waits up to one tick on each side

# Scene source (U8): the 3-layer generator run. e309 (2026-10-09, vllm-agents,
# 8 segments) replaces ce8d (23 prompt-less spine slots, 2 empty segments).
# Fixture written by scripts/export_table_fixture.py <run_id>.
run_id: ashiorid_1_20261009_034648_e309
contracts_fixture: /data/table/fixtures/ashiorid_1_20261009_034648_e309.json
only_with_active_players: true
dedupe_canon_goal: true       # the planner repeats some slots verbatim inside a leaf
start_index: 0
max_scenes: 60                # cap only; auto_duration_s ends the run

# Long unattended run (TableRuntime docstring). ~1 hour: no new scene after 3600 s,
# the running one finishes. Pacing models the roundtable voice queue (measured
# 2026-10-08: ~2.6 spoken words/s + ~5 s TTS/handoff per line) so the GM does
# not out-write the voices and lines never age past live.max_age_s.
auto_duration_s: 3600
auto_pace: {words_per_s: 2.6, per_line_s: 5.0, lead_s: 15}
auto_skip_stuck: true
auto_max_consecutive_stuck: 3

think_s: 60
speak_s: 45
gm_blocks_order: [truth, secrets, unlocks, table_rules, style]
# GM-only twist phrases the GM's public narration may never contain (LLMGM.direct rejects
# and the arbiter retries). Arc-introduced names (Grovley, Malmont) are NOT listed.
gm_forbidden_phrases: [Begene, four cribs, half-sibling, half-brother, half-sister, fathered all]

# Per-call budgets (W0, .claude/prompts/benchmark_methodology_dnd_agents.md "W0 on vLLM")
think:      {max_tokens: 1024, reasoning_budget: 256}
speak:      {max_tokens: 160,  reasoning_budget: 48}
direct:     {max_tokens: 768,  reasoning_budget: 384}
adjudicate: {max_tokens: 512,  reasoning_budget: 64}   # 256 cut the JSON (office run 2026-10-08)
overrule:   {max_tokens: 160,  reasoning_budget: 48}

# The roundtable channel (P4): its slot config + the live feed (table_line from the
# arbiter, app/table/live_feed.py) + per-seat voices that fit the cast.
roundtable:
  base: config/workers/roundtable.yaml
  service: worker-roundtable
  live:
    enabled: true
    table_arbiter: tuber_0
    observer_slot: tuber_7        # no D&D seat; the office keeps its silent observer here
    max_age_s: 1800         # backstop only: auto_pace keeps the queue short. 120 dropped Nora (2026-10-08)
    consume_timeout_s: 20
    line_gap_s: 0.5
    spool_max: 200
  voices:                         # seat -> piper voice (cast voice hints: GM narrator, Chadwick gruff ...)
    tuber_0: /data/voices/en_US-lessac-medium.onnx
    tuber_1: /data/voices/en_US-ryan-high.onnx
    tuber_2: /data/voices/en_US-kristin-medium.onnx
    tuber_3: /data/voices/en_US-joe-medium.onnx
    tuber_4: /data/voices/en_US-bryce-medium.onnx

llm:
  provider: vllm
  model: table-agents          # vllm-agents --served-model-name
  base_url: http://host.docker.internal:8092
  api_key_env: VLLM_API_KEY
  temperature: 0.7
  max_tokens: 1024
  # Qwen's documented remedy for Thinking-model repetition (0..2); added after the
  # 2026-10-08 MoE slice collapsed into verbatim repeats. Passed to vLLM verbatim.
  extra_body:
    presence_penalty: 1.0
