# ──────────────────────────────────────────────────────────────────────────────
# Layout preset: roundtable
#
# The 7th channel — the "main" stream (roundtable_stream_design.md v1.1 §6).
# Hosted by the GM container (tuber_0). Eight tiles: one per character slot
# (tuber_0..tuber_6, INCLUDING the GM's own — §1.1) plus a spare grid-balancing
# tile, laid out as an EVEN 4x2 grid filling the whole screen, PLUS one hidden
# director pane (see below) that is not part of the visible grid.
#
# ── v1.3: pure tile grid, no VISIBLE show log, no system strip ────────────────
# Two earlier ideas were tried and dropped from the VISIBLE layout:
#   * a left-side "Show Log" column (v1.2) — pulled 20% of the width off the
#     grid, which meant the grid's own even-quarters math (see below) was
#     computed against a narrower remainder than the columns actually need to
#     read at a normal font size. Character voicelines in a tile need real
#     width; the log duplicated what the director's own scenes already make
#     visible tile-by-tile, so it was cut rather than re-sized.
#   * an htop "System" strip — operator telemetry that read on the live
#     broadcast as an eighth "character" sitting in the grid.
# Both are gone from the SCREEN. The director PROCESS they hosted is not —
# see "director pane (hidden)" below. `config/panels/replay.yaml`'s
# `python3 /app/replay_pane.py` is not just a display: it IS the roundtable
# duet director (perform_director_request in app/replay_pane.py). Dropping
# the pane that ran it from this file stops anyone from ever launching that
# process, so a replay_request gets queued to the request file and then
# nothing ever polls it — the roundtable silently stops airing entirely,
# with no error anywhere (confirmed live: 8 tile_pane.py processes running,
# zero replay_pane.py processes, after the show-log pane was first removed).
# Every pixel of the VISIBLE grid is a character tile now; the director still
# runs, just off-screen.
#
# ── Geometry: four equal columns, two equal rows ──────────────────────────────
# tmux's `split-window -p <pct>` sizes the NEWLY CREATED pane to <pct> percent
# of its TARGET's current size at split time — not of the whole screen. To cut
# a full-width base pane into four EQUAL columns, the size passed to each
# successive split must shrink to account for the pane getting smaller, not
# stay at a flat 25:
#
#   split 1 (target: the 100%-wide base) size=75  -> new pane = 75%, base = 25%
#   split 2 (target: that 75% pane)      size=66  -> new pane = 66% of 75% = 50%
#   split 3 (target: that 50% pane)      size=50  -> new pane = 50% of 50% = 25%
#
# i.e. size_k = 100 * (N-1-k) / (N-k) for the k-th additional pane out of N
# total columns (N=4 here: 75, 66.67 (rounded to 66), 50). This is the general
# form of the tiling math the ORIGINAL preset already used for its 4-column
# rows — reused unmodified here, just now applied to a 100%-wide base instead
# of an 80%-wide remainder left over from a sidebar. That is the actual fix for
# "tuber_1/tuber_5 unreadably narrow": the columns were never uneven, they were
# even quarters of a pane that itself was too narrow.
#
# The two ROWS are cut first (target: the base pane, split: v i.e. stacked,
# size=50 -> exact halves), then each row's four columns are cut independently
# with the same 75/66/50 sequence, so the grid ends up eight equal cells:
#
#   ┌───────────┬───────────┬───────────┬───────────┐
#   │  tuber_0  │  tuber_1  │  tuber_2  │  tuber_3  │
#   ├───────────┼───────────┼───────────┼───────────┤
#   │  tuber_4  │  tuber_5  │  tuber_6  │     —     │
#   └───────────┴───────────┴───────────┴───────────┘
#
# At startup.sh's real xterm the capture is 1920x1080 with FONT_SIZE=7, whose
# monospace cell is exactly 6x12 px (startup.sh's FONT_SIZE comment explains
# why 7: 12x24 halves to 6x12 with no fractional glyph scaling). So the real
# grid is 1920/6 x 1080/12 = 320x90 characters, and an even 4x2 grid gives
# 320/4 x 90/2 = 80-col, 45-row tiles — 480x540 PIXELS each.
#
# A tile needs 10 rows to draw at all (app/tile_pane.py's TILE_FIXED_OVERHEAD
# of 8 = border 2 + avatar 3 + two subpanel dividers + status 1, plus
# MIN_DIALOGUE_LINES of 2), so 45 rows is deep headroom — the text subpanel
# simply grows into whatever is left, since tile_pane.py detects its own pane
# size at render time rather than assuming one. Confirm with `tmux list-panes`
# on the GM container after any change here — arithmetic alone has hidden a
# layout bug in this file before (the double-width tuber_6 regression the
# spare tile below exists to prevent).
#
# Adding/removing a tile is one entry in this list (OPEN-4). The 8th grid cell
# is spare capacity, not a committed slot.
# ──────────────────────────────────────────────────────────────────────────────
preset: roundtable
# Cosmetic only (v1.4): the tmux status bar's default bottom-left segment is
# "[<session>] <window-index>:<window-name>*" — literally "[worker] 0:python3*"
# on air, meaningless to a viewer. build_layout.py (see its status_label
# handling) turns this into a single static label instead of touching the
# actual tmux session name, which stays "worker" everywhere else (attach
# commands, pane targeting, existing docs/tests all assume it).
status_label: "virtualTubers_roundtable"
panes:
  # ── Base pane: the GM's own tile (top-left). ────────────────────────────────
  # tuber_0 is a character, so it gets a tile like everyone else. It no longer
  # overrides border_color: every ACTIVE tuber (including the GM) renders in
  # the same light-blue (config/panels/tile.yaml's colour117) so the cast
  # reads consistently on stream — a per-slot rainbow (this used to be
  # magenta) was flagged as confusing on the live broadcast (v1.4).
  - use: tile
    id: tile_tuber_0
    with:
      slot: "tuber_0"

  # ── Bottom row, split off the base first so both rows divide evenly. ───────
  # tuber_4 (coder-aider) has no character assigned (see tuber_0.yaml's
  # `roster` config) — grey/offline like the spare cell, not light blue.
  - use: tile
    id: tile_tuber_4
    border_color: colour240
    target: tile_tuber_0
    split: v
    size: 50
    with:
      slot: "tuber_4"

  # ── Top row, columns 2-4 (75/66/50 -> four equal quarters, see header). ────
  - use: tile
    id: tile_tuber_1
    target: tile_tuber_0
    split: h
    size: 75
    with:
      slot: "tuber_1"

  - use: tile
    id: tile_tuber_2
    target: tile_tuber_1
    split: h
    size: 66
    with:
      slot: "tuber_2"

  - use: tile
    id: tile_tuber_3
    target: tile_tuber_2
    split: h
    size: 50
    with:
      slot: "tuber_3"

  # ── Bottom row, columns 2-4. ───────────────────────────────────────────────
  - use: tile
    id: tile_tuber_5
    target: tile_tuber_4
    split: h
    size: 75
    with:
      slot: "tuber_5"

  - use: tile
    id: tile_tuber_6
    target: tile_tuber_5
    split: h
    size: 66
    with:
      slot: "tuber_6"

  # ── 8th grid cell: tuber_7, promoted from spare (OPEN-4, now resolved). ────
  # Previously an idle grey placeholder pinned to the uncast tuber_7 slot
  # (see ROSTER_SIZE history in app/episode_validator.py). Now a real active
  # tile: same light-blue border as every other cast slot, title resolved
  # from tuber_0.yaml's roster ("Iris") the same way tiles 0-6 already are.
  - use: tile
    id: tile_tuber_7
    target: tile_tuber_6
    split: h
    size: 50
    with:
      slot: "tuber_7"
