# ──────────────────────────────────────────────────────────────────────────────
# Panel type: radar_chart
#
# Small shaded 3D radar/spike mesh (termgl, see docs/panels.md's "3D
# rendering (termgl)" section) of the six live model-performance metrics
# (Contract A of docs/tuber_base_layout_plan.md): tokens/sec, avg latency,
# context tokens, error/retry rate, uptime, messages sent. Reads
# `<runtime-dir>/metrics_<worker_id>.json` (default runtime dir /tmp/panes),
# the same file app/agent_metrics.py rewrites atomically after every LLM
# completion. Tolerant of a missing/stale file — renders a flat/zeroed mesh
# with a STALE header, never crashes.
#
# Runs under /opt/render3d's Python 3.11 venv (not the system python3.10)
# — termgl requires Python >=3.11 (see Dockerfile's render3d venv comment).
#
# No `{runtime_dir}`/`{worker_id}` placeholders exist in build_layout.py's
# substitution context (only `{config_path}`/`{resolved_path}` are
# guaranteed) — radar_pane.py derives the metrics path itself from the
# worker config it's given. See app/radar_pane.py's module docstring.
# ──────────────────────────────────────────────────────────────────────────────
type: radar_chart
title: "Stats"
border_color: green
command: "/opt/render3d/bin/python3 /app/radar_pane.py --config {config_path}"
