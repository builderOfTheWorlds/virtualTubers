# ──────────────────────────────────────────────────────────────────────────────
# Panel type: knowledge_graph
#
# STATIC PLACEHOLDER node/edge graph (Decision 3 of
# docs/tuber_base_layout_plan.md: STUB structure only — wiring to real
# campaign-pack/Postgres data is explicitly a separate future task),
# rendered as a real shaded 3D graph via termgl (docs/panels.md's "3D
# rendering (termgl)" section): nodes are octahedra on a Fibonacci sphere,
# edges are projected 3D lines. Clearly labeled "(placeholder)" every frame
# so nobody mistakes it for real data.
#
# Runs under /opt/render3d's Python 3.11 venv (not the system python3.10)
# — termgl requires Python >=3.11 (see Dockerfile's render3d venv comment).
# ──────────────────────────────────────────────────────────────────────────────
type: knowledge_graph
title: "Knowledge"
# cyan matches the "Message Bus" (kafka_feed) pane's light-blue text — tmux's
# `select-pane -P fg=<border_color>` sets the pane's default text style, not
# just the border, so this was rendering as hard-to-read dark blue on the
# dark-grey xterm background.
border_color: cyan
command: "/opt/render3d/bin/python3 /app/knowledge_graph_pane.py --config {config_path}"
