# ──────────────────────────────────────────────────────────────────────────────
# Panel type: kafka_feed
#
# Reusable panel-type definition for the rich Kafka "Message Bus" feed pane.
# The layout engine resolves this (panel default -> layout override -> worker
# override), writes the resolved copy to a runtime dir, and launches the pane
# with the resolved file passed as --feed-config to app/tail_bus.py.
#
# Only the `content:` block is consumed by tail_bus.py. Feed colors live HERE,
# never coupled to any avatar block (senders include `broadcast`, which has no
# avatar).
# ──────────────────────────────────────────────────────────────────────────────
type: kafka_feed
title: "Message Bus"
border_color: cyan
command: "python3 /app/tail_bus.py --bus-config {config_path} --feed-config {resolved_path}"

content:
  # Sender color, keyed by the message `from` value. broadcast is a valid key.
  colors:
    coder: green
    coder-native: green
    coder-opencode: green
    coder-aider: green
    manager: yellow
    tester: magenta
    broadcast: cyan
    operator: blue

  filters:
    # NOTE: agent.py emits its bus heartbeat as type "status_update" (not
    # "heartbeat"; since agent v2.6.0 only every agent.bus_heartbeat_every
    # ticks, default 12), so both are hidden by default to stop the flood. agent_thinking (Contract B, docs/tuber_base_layout_plan.md)
    # is also hidden by default — it has its own dedicated `thinking` pane
    # and must not flood this reformatted conversation feed. Fully
    # configurable — edit this list to change what is hidden.
    hide_types: [heartbeat, status_update, agent_thinking]
    # Empty = show everything except hidden. Non-empty = whitelist (only these).
    show_types: []
    # all | broadcast | to:<id> | from:<id>
    direction: all

  # Colors the TYPE column when the message type matches a category below.
  highlight:
    task_complete: green
    clarification_request: yellow
    error: red
    bug_report: red
    test_passed: green
    manager_report: cyan
    operator_reply: blue
    coding_run_report: magenta
    viewer_joined: cyan

  # Payload rendering. mode: pretty | raw | hidden. Truncated to max_chars.
  payload:
    mode: pretty
    max_chars: 80

  # Timestamp formatting. local: true converts the UTC ISO stamp to local time.
  # NOTE: conversation mode (below) ignores this block — its timestamp format
  # is hardcoded per Contract C (`%m%d%y %H:%M:%S`), not configurable here.
  timestamp:
    format: "%H:%M:%S"
    local: true

  # Print a one-time column header at startup. Only applies to columns mode.
  header: true

  # Columns mode only: a short correlation tag column (first `chars` of the
  # message's correlation_id, docs/message_bus.md "Correlation IDs") between
  # TYPE and PAYLOAD, so one task's chain — including its bug-fix retries —
  # can be followed by eye. Off by default (tail_bus.py's built-in default;
  # the narrow pane's default line stays unchanged). docs/message_bus_feed.md.
  # correlation:
  #   show: false
  #   chars: 6
  #   color: gray

  # Rendering mode: "columns" (default, today's rich aligned feed — kept
  # byte-for-byte identical) | "conversation" (Contract C, new: a plain
  # `<mmDDyy HH:MM:SS> : <character_name>: <message>` conversation log, used
  # by the tuber_base layout's kafka_feed pane via `with: { content: {
  # format: conversation } }`).
  format: columns

  # Conversation-mode character-name resolution (Contract C): message
  # `from` -> display name, same shape/precedence pattern as `colors` above.
  # Seeded with each worker's configured `agent.name` value plus the two
  # non-worker senders. Unknown `from` falls back to the raw id.
  display_names:
    coder: "KODI-7"
    coder-native: "NYX-1"
    coder-opencode: "OKO-2"
    coder-aider: "ADA-3"
    tester: "TESS-3"
    manager: "MAX-1"
    broadcast: "Broadcast"
    operator: "Operator"

